<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Folder review</title>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="base.css">
<style>
  /* The page never grows: body is exactly the window, and only the side panels scroll. */
  html, body { height: 100%; }
  body { height: 100vh; overflow: hidden; display: grid; grid-template-rows: var(--header-h) minmax(0, 1fr) var(--chain-h, auto); color: var(--ink); font-size: var(--fs-md); }
  header { display: flex; align-items: center; gap: 12px; padding: 0 var(--pad); border-bottom: 1px solid var(--line); background: var(--surface); }
  header h1 { margin: 0; font-size: var(--fs-lg); font-weight: 500; }
  header .muted, .muted { color: var(--muted); }
  header a { margin-left: auto; color: var(--ink); }
  header a[hidden] + .open { margin-left: auto; }
  main { display: grid; grid-template-columns: 260px minmax(0, 1fr) 260px; grid-template-rows: minmax(0, 1fr); min-height: 0; overflow: hidden; }
  /* Phone / narrow window: one column, the 3D view first, then the case list and the facts + layers; the page scrolls. */
  @media (max-width: 820px) {
    body { height: auto; min-height: 100dvh; overflow: auto; grid-template-rows: auto auto auto; }
    header { flex-wrap: wrap; row-gap: 4px; padding: 6px var(--pad); }
    header a { margin-left: 0; }
    main { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto; overflow: visible; }
    .stage { order: -1; height: 62dvh; touch-action: none; }
    .panel, .panel.right { border: 0; border-top: 1px solid var(--line); overflow: visible; max-height: none; }
    .panel:not(.right) { max-height: 30dvh; overflow: auto; }
    .views { flex-wrap: wrap; justify-content: flex-end; max-width: 70%; }
    .note { max-width: 45%; }
  }
  .panel { border-right: 1px solid var(--line); min-height: 0; overflow-y: auto; }
  .list li > span:not(.badge) { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .panel.right { border-right: 0; border-left: 1px solid var(--line); }
  /* The stage is sized by the grid, never by its canvas: the canvas is absolutely placed, so its pixel size cannot push the page taller. */
  .stage { position: relative; min-width: 0; min-height: 0; overflow: hidden; background: var(--scene-bg); }
  .stage canvas { position: absolute; inset: 0; display: block; width: 100%; height: 100%; }
  .views { position: absolute; top: 8px; right: 8px; display: flex; gap: 4px; }
  .steps { position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%); display: flex; gap: 4px; align-items: center; }
  .note { position: absolute; top: 44px; left: 8px; max-width: 60%; color: var(--muted); font-size: var(--fs-sm); }
  .list li { cursor: pointer; }
  .list li .badge { font-size: var(--fs-xs); }
  .list li.look .badge { border-color: var(--danger); color: var(--danger); }
  /* A case that was not built: its reason sits under the name, two lines at most (full text on hover). */
  .list li:has(small.why) { height: auto; flex-wrap: wrap; row-gap: 2px; padding: 6px 4px; }
  .list li > span:not(.badge) { white-space: nowrap; }
  .list li small.why { flex: 1 1 100%; margin-left: 26px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; white-space: normal; line-height: 1.35; color: var(--danger); }
  /* Facts: compact collapsible groups (case result, tilt, islands, tips, ...), label left, value right. */
  .fact-list { display: grid; grid-template-columns: minmax(0, 46%) minmax(0, 1fr); gap: 1px 8px; margin: 0; line-height: 1.35; }
  .fact-list dt { color: var(--muted); }
  .fact-list dt[data-tip] { cursor: help; }
  .fact-list dd { margin: 0; text-align: right; font-variant-numeric: tabular-nums; overflow-wrap: break-word; min-width: 0; }
  .fact-list dd.bad { color: var(--danger); }
  .fact-group { margin-top: var(--gap); }
  .peel-report { margin-top: var(--gap); }
  .peel-chart svg { width: 100%; height: auto; display: block; }
  .peel-legend { margin: 2px 0 0; font-size: var(--fs-sm); }
  .peel-key.ours { color: var(--danger); } .peel-key.owner { color: var(--ink); }
  .source { color: var(--muted); font-size: var(--fs-sm); overflow-wrap: anywhere; margin: 0 0 6px; }
  .swatch { width: 10px; height: 10px; border-radius: 2px; flex: none; border: 1px solid var(--swatch-border); }
  /* Layer groups: the base.css collapsible band; the count (on / total) stays regular weight. */
  .layer-group > summary .count { margin-left: auto; font-weight: 400; color: var(--muted); font-variant-numeric: tabular-nums; }
  .layer-group .legend-row { min-height: calc(var(--row) - 2px); gap: 6px; padding-left: 4px; }
  .legend-row .legend-label { flex: 1; min-width: 0; overflow-wrap: anywhere; }
  .legend-row.later { opacity: .45; }
  /* benchwork rows: the same height and rhythm as a legend row, with the input first so the eye runs
     down the column that is actually being set. Tokens only - this surface uses the house values. */
  .bench-row { display: flex; align-items: center; gap: 6px; min-height: calc(var(--row) - 2px); padding-left: 4px; cursor: help; }
  .bench-row input[type=number] { width: 72px; flex: none; }
  .bench-row .bench-name { flex: 1; min-width: 0; overflow-wrap: anywhere; font-variant-numeric: tabular-nums; }
  .bench-row .bench-unit { flex: none; font-size: var(--fs-sm); }
  .bench-actions { display: flex; gap: 6px; margin: 6px 0 2px; }
  #bench-status:empty { display: none; }
  .stepper { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; margin: 0 0 4px; }
  .stepper .step-where { flex-basis: 100%; font-size: var(--fs-sm); cursor: help; }
  /* The print tilt, prominent, top-left over the 3D view. */
  .tilt-chip { position: absolute; top: 8px; left: 8px; display: flex; align-items: baseline; gap: 6px; padding: 3px 8px; border: 1px solid var(--line-strong); border-radius: var(--radius); background: var(--surface); cursor: help; }
  .tilt-chip[hidden] { display: none; }
  .tilt-chip .tilt-angle { font-size: var(--fs-xl); font-weight: 700; letter-spacing: .02em; }
  .tilt-chip .tilt-band { font-size: var(--fs-sm); color: var(--muted); }
  .tilt-chip.unconfirmed { border-color: var(--danger); }
  .tilt-chip.unconfirmed .tilt-angle { color: var(--danger); }
  /* The box centre's label, pinned to its sphere each frame. */
  .marker-label { position: absolute; left: 0; top: 0; transform: translate(10px, -26px); padding: 1px 6px; border-radius: 3px; background: var(--surface); border: 1px solid var(--line-strong); font-size: var(--fs-sm); white-space: nowrap; pointer-events: none; }
  .marker-label[hidden] { display: none; }
  .side-label { transform: translate(-50%, -50%); background: var(--paper); font-weight: 600; }
  /* Hover tooltip (3D objects and panel labels): flat, hairline, never takes the pointer. */
  .hover-tip { position: fixed; z-index: 30; max-width: 280px; padding: 4px 8px; border: 1px solid var(--line-strong); border-radius: var(--radius); background: var(--surface); font-size: var(--fs-sm); line-height: 1.35; pointer-events: none; }
  .hover-tip[hidden] { display: none; }
  .hover-tip .hover-tip-title { font-weight: 700; }
  .hover-tip .hover-tip-title:empty { display: none; }
  .hover-tip .hover-tip-fact { font-variant-numeric: tabular-nums; }
  .hover-tip .hover-tip-note { margin-top: 2px; color: var(--muted); }
  .segmented { margin-bottom: 6px; }
  .open { display: flex; gap: 4px; }
  .open input { display: none; }
  body.dragging .stage { outline: 2px dashed var(--accent, var(--ink)); outline-offset: -6px; }
  /* A case with no 3D result: a card in the middle of the stage, never an empty view. */
  .nocase { position: absolute; inset: 0; display: grid; place-items: center; padding: 24px; pointer-events: none; }
  .nocase[hidden] { display: none; }
  .nocase div { max-width: 460px; max-height: 100%; overflow: auto; padding: 16px; border: 1px solid var(--line-strong); border-radius: var(--radius); background: var(--surface); pointer-events: auto; }
  .nocase h2 { margin: 0 0 4px; font-size: var(--fs-xl); font-weight: 500; }
  .nocase .result { margin: 0 0 10px; color: var(--danger); }
  .nocase p { margin: 0 0 8px; line-height: 1.45; }
  .nocase code { color: var(--muted); font-size: var(--fs-sm); overflow-wrap: anywhere; }

/* THE CHAIN: the engine's steps as nodes, left to right, in the order they actually run.
   It is generated from DENTURE_STEPS - the same list the step-by-step buttons walk - so it cannot
   describe a chain the engine does not run. No drag handles, deliberately: see the note it prints. */
.chain { position: relative; border-top: 1px solid var(--line); margin-top: 10px; padding: 10px 12px 14px; min-width: 0; min-height: 0; overflow-y: auto; }
/* The divider between the 3D view and the stages (owner, 2026-11-20: "allow push up the divider in case
   we need more space to show the editor"). Drag it; double-click puts it back to fit the content. */
.chain-divider { position: sticky; top: -10px; z-index: 5; height: 10px; margin: -10px -12px 0; cursor: row-resize; touch-action: none; }
.chain-divider::after { content: ""; display: block; width: 48px; height: 4px; margin: 3px auto 0; border-radius: 2px; background: var(--line-strong); }
.chain-divider:hover::after, .chain-divider.dragging::after { background: var(--red); }
@media (max-width: 820px) { .chain-divider { display: none; } }
.chain-head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.chain-head h3 { margin: 0; }
.chain-rail { display: flex; gap: 0; overflow-x: auto; padding: 10px 0 4px; align-items: flex-start; min-width: 0; }
.chain-node { flex: 0 0 auto; width: 186px; border: 1px solid var(--line); border-radius: 6px;
  padding: 7px 8px; background: var(--surface); display: flex; flex-direction: column; gap: 5px; }
/* The card is a DIV, not a button: a button may not contain the inputs the settings rows need, and
   a card that cannot hold a field can never become an editor. The title is the button instead. */
.chain-node:has(.n[aria-pressed="true"]) { border-color: var(--red); box-shadow: 0 0 0 1px var(--red); }
.chain-node .n { height: auto; padding: 0; background: none; border: 0; text-align: left; cursor: pointer; }
/* base.css paints a pressed button's TEXT in --paper for its dark fill; the card drops the fill, so the
   selected card's title went paper-on-paper and vanished (owner, 2026-11-20). The card border shows selection. */
.chain-node .n[aria-pressed="true"] { background: none; border: 0; color: var(--ink); }
.chain-node.absent { opacity: 0.5; }
/* A locked aligner node: readable, plainly not a control (no pointer, a muted tag instead of a button). */
.chain-node.locked { cursor: default; }
.chain-node.locked .n { cursor: default; }
.chain-node .lock { align-self: flex-start; font-size: 10px; color: var(--muted); border: 1px solid var(--line); border-radius: 8px; padding: 0 6px; }
.chain-node .n { font-weight: 600; font-size: 12px; line-height: 1.25; }
/* Capped, because the rail is as tall as its TALLEST card and step 7 owns nine rules: without this
   the chain ate the page and squeezed the 3D view to a sliver, while the card responsible was
   scrolled out of sight to the right. A card scrolls its own settings instead. */
.chain-sets { display: flex; flex-direction: column; gap: 3px; border-top: 1px dashed var(--line); padding-top: 4px; }
.chain-set { display: flex; align-items: center; gap: 5px; font-size: 11px; }
.chain-set .k { color: var(--muted); }
.chain-set .v { margin-left: auto; font-variant-numeric: tabular-nums; }
.chain-set select { max-width: 150px; margin-left: auto; font-size: 11px; height: 20px; min-width: 0; }
.chain-set:has(select) { flex-wrap: wrap; row-gap: 2px; }
.chain-set:has(select) select { flex: 1 1 100%; max-width: 100%; margin-left: 0; }
.chain-set input { width: 84px; min-width: 0; max-width: 100%; box-sizing: border-box; height: 20px; margin-left: auto; font-size: 11px; padding: 0 4px; }
.chain-none { font-size: 11px; color: var(--muted); border-top: 1px dashed var(--line); padding-top: 4px; }
.chain-node .outs { display: flex; flex-direction: column; gap: 2px; }
.chain-node .out { display: flex; align-items: center; gap: 5px; font-size: 11px; color: var(--muted); }
.chain-node .swatch { width: 9px; height: 9px; border-radius: 2px; flex: 0 0 auto; }
.chain-node .count { margin-left: auto; font-variant-numeric: tabular-nums; }
.chain-link { flex: 0 0 auto; align-self: flex-start; margin-top: 28px; width: 14px; text-align: center; color: var(--muted); }
.chain-note { font-size: 11px; color: var(--muted); margin: 2px 0 0; max-width: 92ch; }
.chain-key { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 14px; font-size: 11px; color: var(--muted); margin: 8px 0 2px; }
.chain-key .out { display: inline-flex; align-items: center; gap: 5px; color: var(--ink); }
.chain-key .k { font-weight: 600; }

/* The New-type strip: the type being made, and its steps, above the stage tabs. Text left-aligned (house rule). */
.type-strip { display: flex; flex-direction: column; gap: 6px; padding: 6px 0 8px; border-bottom: 1px solid var(--line); margin-bottom: 6px; text-align: left; }
.type-fields { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; }
.type-title { font-size: 12px; }
.type-field { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; }
.type-field .k { color: var(--muted); }
.type-field input, .type-field select { height: 22px; font-size: 11px; padding: 0 5px; min-width: 0; box-sizing: border-box; }
.type-field input { width: 160px; }
.type-field input.type-id { width: 130px; font-family: var(--font-mono, monospace); }
.type-field input.type-badge-input { width: 56px; }
.type-based { color: var(--muted); font-size: 11px; }
.type-new { height: 22px; padding: 0 10px; font-size: 11px; }
.type-steps { display: flex; flex-wrap: wrap; gap: 4px 6px; margin: 0; padding: 0; list-style: none; font-size: 11px; color: var(--muted); }
.type-steps li { padding: 1px 8px; border: 1px solid var(--line); border-radius: 10px; }
.type-steps li.done { color: var(--ink); border-color: var(--ink); }
.type-steps li.now { color: var(--ink); border-color: var(--red); box-shadow: 0 0 0 1px var(--red); }
.type-step-link { height: auto; padding: 0; border: 0; background: none; color: inherit; font-size: 11px; cursor: pointer; text-decoration: underline; }
.type-note { margin: 0; font-size: 11px; color: var(--muted); }
.type-note.type-warn { color: var(--warning); }

/* The three stages: one tab per stage, one stage on screen, so the 3D view keeps its height. */
.stage-tabs { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.stage-tab { height: auto; padding: 4px 12px; border: 1px solid var(--line); border-radius: 14px; background: var(--surface); cursor: pointer; font-weight: 600; }
.stage-tab[aria-pressed="true"] { border-color: var(--red); box-shadow: 0 0 0 1px var(--red); }
/* A PRESSED button keeps its dark fill under the mouse. base.css turns every hovered button white
   (`button:hover`) while the pressed state paints its text paper-white, so the tab just clicked went
   blank exactly while the pointer was on it (UX check, 2026-11-20). Same trap in the segmented switch. */
.stage-tab[aria-pressed="true"]:hover:not(:disabled), .segmented button[aria-pressed='true']:hover:not(:disabled) { background: var(--ink); color: var(--paper); }
.chain-node .n[aria-pressed="true"]:hover:not(:disabled) { background: none; color: var(--ink); }
.stage-arrow { color: var(--muted); }
.stage-body { min-width: 0; }
.chain-node.search { width: 300px; }
.deg-figure svg { width: 100%; height: auto; max-width: 280px; display: block; }
.deg-figure .picked { fill: var(--red); }
.chain-node.search input.type-name { width: 150px; }
.chain-node.search input.type-badge { width: 72px; }
.chain-none.bad { color: var(--danger); }
.deg-how { margin: 4px 0 6px; font-size: 11px; color: var(--muted); line-height: 1.35; }
.deg-figure .plate { stroke: var(--muted); stroke-width: 2; }
.deg-figure .up { stroke: var(--muted); stroke-dasharray: 3 2; }
.deg-figure .lean, .deg-figure .arc { stroke: var(--red); fill: none; stroke-width: 1.5; }
.deg-figure text { font-size: 11px; fill: var(--muted); }
/* The zone editor. */
.zone-status { font-size: 12px; padding: 5px 8px; border-radius: 4px; margin: 8px 0 6px; }
.zone-status.default { background: var(--surface); border: 1px solid var(--line); }
.zone-status.edited { border: 1px solid var(--warning); }
.zone-bar { display: flex; gap: 6px; align-items: center; margin-bottom: 6px; }
.zone-bar select, .zone-bar button { height: auto; padding: 3px 8px; }
.zone-report { font-size: 11px; display: flex; flex-direction: column; gap: 2px; margin-bottom: 6px; }
.zone-report .ok { color: var(--success); }
.zone-report .bad { color: var(--danger); }
.zone-report .warn { color: var(--warning); }
.zone-outs { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 11px; margin-bottom: 4px; }
.zone-out { display: flex; gap: 4px; align-items: center; }
.zone-out .k { color: var(--muted); font-family: var(--font-mono, monospace); }
.zone-out select, .zone-node select { height: 20px; font-size: 11px; max-width: 120px; }
.zone-node { width: 200px; }
.zone-node.idle { opacity: 0.6; border-style: dashed; }
.zone-node.fixed { background: transparent; }
.zone-head { display: flex; align-items: center; gap: 4px; }
.zone-tools { margin-left: auto; display: flex; gap: 2px; }
.zone-tools button { height: 18px; width: 20px; padding: 0; font-size: 11px; }
.zone-node input { width: 64px; height: 18px; margin-left: auto; font-size: 11px; padding: 0 3px; }
.zone-node .chain-set select { margin-left: auto; }

/* The React Flow canvas and its nodes. Colours are tokens: the bundle's own stylesheet supplies the
   canvas chrome, and nothing here may hold a literal. */
.zone-canvas { min-height: 220px; resize: vertical; overflow: hidden; border: 1px solid var(--line); border-radius: 6px; background: var(--sunken); }
.zone-canvas .zn, .zone-canvas .zo { font-size: 11px; background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px; width: 220px; color: var(--ink); }
.zone-canvas .zn.idle { opacity: 0.6; border-style: dashed; }
.zone-canvas .zn.fixed { background: transparent; }
.zone-canvas .zn-head { display: flex; align-items: baseline; gap: 6px; font-size: 12px; }
.zone-canvas .zn-id { margin-left: auto; color: var(--muted); font-size: 10px; }
.zone-canvas .zn-says { color: var(--muted); font-size: 10px; line-height: 1.35; margin: 2px 0 6px; }
.zone-canvas .zn-readout { font-size: 10px; line-height: 1.35; margin: 0 0 6px; padding: 3px 5px; background: var(--paper); border-radius: 3px; color: var(--ink); }
.zone-canvas .zn-takes { font-size: 10px; line-height: 1.35; margin: 0 0 6px; color: var(--ink); }
.restore-mark { margin-left: 4px; padding: 0 5px; font-size: 11px; line-height: 16px; border: 1px solid var(--line); border-radius: 3px; background: var(--paper); cursor: pointer; }
.restore-mark[hidden] { display: none; }
.zone-canvas .zn-restore { margin-left: 4px; padding: 0 5px; font-size: 11px; line-height: 16px; border: 1px solid var(--line); border-radius: 3px; background: var(--paper); cursor: pointer; }
/* position: relative so each Handle sits on ITS row, not at a fraction of the node's height. */
.zone-canvas .zn-row { position: relative; display: flex; align-items: center; gap: 6px; min-height: 22px; }
.zone-canvas .zn-in { color: var(--muted); }
.zone-canvas .zn-type, .zone-canvas .zn-outtype { margin-left: auto; color: var(--muted); font-size: 10px; }
.zone-canvas .zn-out-row { border-top: 1px solid var(--line); margin-top: 4px; }
.zone-canvas .zn input, .zone-canvas .zn select { margin-left: auto; font-size: 11px; height: 20px; padding: 0 3px; }
.zone-canvas .zn input { width: 64px; }
/* A dropdown gets its own line under its label, so a described choice is read whole, not cut off. */
.zone-canvas .zn-row:has(select) { flex-wrap: wrap; row-gap: 2px; padding-bottom: 2px; }
/* A dropdown is as wide as the node and no wider: the chosen words end in "..." and the whole choice
   shows on hover (owner screenshot, 2026-11-20: "tissue side - the side that rests on the gums" ran
   past the node's edge). */
.zone-canvas .zn select { flex: 1 1 100%; width: 100%; min-width: 0; max-width: 100%; margin-left: 0; box-sizing: border-box; text-overflow: ellipsis; }
.zone-canvas .zn input { box-sizing: border-box; }
/* The node's group: a coloured stripe and a small label, so a kind is found at a glance. */
.zone-canvas .zn { border-left: 4px solid var(--zn-group, var(--line)); }
.zone-canvas .zn-group { font-size: 9px; letter-spacing: 0.04em; text-transform: uppercase; color: var(--zn-group, var(--muted)); margin-bottom: 1px; }
.zone-canvas .zn-live { color: var(--red); }
.zone-canvas .zn-note { color: var(--muted); font-size: 10px; margin-top: 4px; }
.zone-canvas .zo { width: 280px; border-color: var(--ink); }
.zone-canvas .zo-row { align-items: flex-start; padding: 4px 0; border-top: 1px solid var(--line); }
.zone-canvas .zo-row .react-flow__handle { top: 12px; }
.zone-canvas .zo-row.empty b { color: var(--danger); }
.zone-canvas .zn.has-issue { border-color: var(--danger); }
.zone-canvas .zn-issue { color: var(--danger); font-size: 10px; line-height: 1.35; margin: 2px 0; }
.zone-canvas .zn-warn { color: var(--warning); font-size: 10px; line-height: 1.35; margin: 2px 0; }
.zone-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; margin: 4px 0 6px; font-size: 12px; }
.zone-bar .chain-key { margin: 0; }
.zone-bar .chain-note { flex: 1 1 420px; margin: 0; }
.zone-summary.ok { color: var(--success); }
.zone-summary.bad { color: var(--danger); }
.zone-legend { display: flex; flex-wrap: wrap; gap: 4px 10px; color: var(--muted); font-size: 11px; }
.zone-legend span { border-left: 4px solid var(--zn-group); padding-left: 4px; }
.zone-tools-row { display: flex; gap: 6px; margin-left: auto; }
/* With the divider dragged, the stage area is a fixed height: the canvas takes what the chrome leaves,
   so its zoom controls stay inside the pane (UX review 2026-11-20). Without it, a generous fixed height. */
.zone-canvas { height: 480px; }
:root[style*="--chain-h"] .chain { display: flex; flex-direction: column; }
:root[style*="--chain-h"] #stage-body { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; }
:root[style*="--chain-h"] .zone-canvas { flex: 1 1 auto; height: auto; min-height: 260px; }
.zone-canvas .react-flow__minimap { width: 120px; height: 80px; }
.zone-canvas .react-flow__minimap svg { width: 120px; height: 80px; }

<main>
  <div class="panel">

  </div>

      <span class="tilt-angle" data-ui="review-tilt-angle"></span>

      <p id="nocase-text"></p>
      <code id="nocase-code"></code>
    </div></div>
    <div class="views">

      <button data-view="top">Top view</button>
      <button data-view="bottom">Bottom view</button>
      <button data-view="side">Side view</button>
    </div>
    <div class="steps">
      <button id="prev">Previous</button>
      <span class="muted" id="position"></span>
      <button id="next">Next</button>
    </div>
  </div>
  <div class="panel right" data-ui="review-panel-right">
    <section data-ui="review-case">
      <h3>Case</h3>
      <p class="source" id="source" data-ui="review-source"></p>
      <div id="facts" class="facts" data-ui="review-facts"></div>
      <details class="fact-group peel-report" data-ui="review-peel-report" id="peel" open hidden>
        <summary class="peel-title" data-ui="review-peel-title">Peel and strength</summary>
        <div class="peel-chart" data-ui="review-peel-chart" id="peel-chart"></div>
        <p class="peel-legend" data-ui="review-peel-legend"><span class="peel-key ours">ours</span> <span class="peel-key owner">owner's slicer</span> <span class="muted">layer area (mm²) by height (mm)</span></p>
      </details>
    </section>
    <section data-ui="review-layers-section">
      <h3>Layers</h3>
      <div id="layers" data-ui="review-layers"></div>
    </section>
    <!--
      BENCHWORK: turn a rule and run this case again. Hidden until the rules module loads, because a
      panel whose controls do not match the engine's rule names is worse than no panel - it would
      pass names `packRules` ignores and the run would look like an answer having tested nothing.

    <section data-ui="bench-section" id="bench-section" hidden>
      <h3>benchwork — turn a rule</h3>

      <div id="bench-rules" data-ui="bench-rules"></div>
      <div class="bench-actions">
        <button id="bench-run" data-ui="bench-run">Apply and run again</button>

      </div>
      <p class="muted" id="bench-status" data-ui="bench-status"></p>
    </section>
  </div>
</main>

  if (!model) return;

  camera.position.copy(sphere.center).addScaledVector(direction.normalize(), distance);

tiltPreviewNote.dataset.ui = 'tilt-preview-note';

/** One step's card: what it produced, and the settings it is known to own. */
/** One line: the colour of each layer this tab's steps drew, in place of the step cards above a canvas. */
function colourKey(stage, present) {
  const line = document.createElement('div');
  line.className = 'chain-key';
  line.dataset.ui = `chain-key-${stage.id}`;
  line.append(Object.assign(document.createElement('span'), { className: 'k', textContent: 'In 3D:' }));
  for (const key of stage.steps.flatMap((at) => DENTURE_STEPS[at][2]).filter((k) => present.has(k))) {
    const item = document.createElement('span');
    item.className = 'out';
    const entry = entryOf(key);
    if (entry) { item.dataset.tipTitle = entry[1]; item.dataset.tip = entry[2]; }
    const swatch = Object.assign(document.createElement('span'), { className: 'swatch' });
    swatch.style.background = colourOf(key);
    item.append(swatch, Object.assign(document.createElement('span'), { textContent: shortLabel(key) }));
    line.append(item);
  }
  return line;
}

function chainCard(at, present, names) {
  const [label, , keys] = DENTURE_STEPS[at];
  const here = keys.filter((key) => present.has(key));
  const node = document.createElement('div');
  node.className = here.length > 0 ? 'chain-node' : 'chain-node absent';
  node.dataset.ui = `chain-node-${at + 1}`;
  const title = document.createElement('button');
  title.type = 'button';
  title.className = 'n';
  // The tabs are the one numbering (1 Orient ... 5 Print angle); a card's own step
  // number beside them read as a fourth and fifth stage (UX review 2026-11-20).
  title.textContent = label.replace(/^\d+\.\s*/, '');
  title.setAttribute('aria-pressed', String(stepAt === at + 1));
  title.dataset.ui = `chain-step-${at + 1}`;
  title.dataset.tipTitle = label;
  title.dataset.tip = ruleText(DENTURE_STEPS[at][1]);
  title.addEventListener('click', () => setStep(stepAt === at + 1 ? null : at + 1));
  const outs = document.createElement('span');
  outs.className = 'outs';
  const SHOWN = 4;
  for (const key of keys.slice(0, SHOWN)) {
    const row = document.createElement('span');
    row.className = 'out';
    const swatch = document.createElement('span');
    swatch.className = 'swatch';
    swatch.style.background = present.has(key) ? colourOf(key) : 'transparent';
    swatch.style.border = present.has(key) ? 'none' : '1px dashed var(--line)';
    const text = document.createElement('span');
    text.textContent = shortLabel(key);
    row.append(swatch, text);
    const full = names.find((name) => bare(plain(name)).startsWith(bare(key)));
    const count = full && /(\d+) faces$/.exec(plain(full));
    if (count) {
      const n = document.createElement('span');
      n.className = 'count';
      n.textContent = Number(count[1]).toLocaleString();
      row.append(n);
    }
    outs.append(row);
  }
  if (keys.length > SHOWN) {
    const more = document.createElement('span');
    more.className = 'out';
    more.textContent = `+${keys.length - SHOWN} more (${here.length} of ${keys.length} in this case)`;
    outs.append(more);
  }
  node.append(title, outs);
  const settings = NODE_SETTINGS[at];
  if (settings) node.append(settingsBox(settings, names));
  return node;
}

/** The settings rows of a card. Live rules mirror the benchwork panel's field: one place holds what is turned. */
function settingsBox(settings, names) {
  const box = document.createElement('div');
  box.className = 'chain-sets';
  for (const setting of settings) {
    const row = document.createElement('label');
    row.className = 'chain-set';
    row.dataset.ui = `chain-set-${setting.rule ?? setting.key}`;
    const k = document.createElement('span');
    k.className = 'k';
    const field = setting.rule && benchFields?.get(setting.rule);
    k.textContent = field?.rule.label ?? setting.key;
    row.append(k);
    // After the field's own handler has copied the value into the rule list (a bubbling listener runs after the
    // target's): tabs 4 and 5 preview the new setting (plan D3).
    if (field) row.addEventListener('change', () => scheduleTiltPreview());
    if (field && field.rule.choices) {
      // A mode is a dropdown of its described choices; empty means the engine's own default.
      const input = document.createElement('select');
      input.append(new Option('default', ''));
      for (const [value, label] of field.rule.choices) input.append(new Option(label, value));
      input.value = field.input.value;
      input.addEventListener('change', () => { field.input.value = input.value; });
      input.dataset.ui = `chain-input-${setting.rule}`;
      row.append(input);
      row.dataset.tipTitle = field.rule.label;
      row.dataset.tip = `${field.rule.says} Press Apply and run again to use it.`;
    } else if (field && field.rule.type === 'flag') {
      // A yes/no rule is a dropdown that says what it means, not a bare checkbox (owner: "anything that is
      // not a number should be a dropdown"). It mirrors the panel's checkbox, which Apply reads.
      const input = document.createElement('select');
      input.append(new Option('no (standard)', 'no'), new Option('yes', 'yes'));
      input.value = field.input.checked ? 'yes' : 'no';
      input.addEventListener('change', () => { field.input.checked = input.value === 'yes'; });
      input.dataset.ui = `chain-input-${setting.rule}`;
      row.append(input);
      row.dataset.tipTitle = field.rule.label;
      row.dataset.tip = `${field.rule.says} Press Apply and run again to use it. Read in: ${setting.why}`;
    } else if (field) {
      const input = document.createElement('input');
      input.type = 'number';
      input.step = 'any';
      input.min = '0';
      // Empty means the engine's own value, said as a value: "auto (45)", never a word that looks typed.
      const fallback = RULES[setting.rule];
      input.placeholder = fallback === undefined ? 'auto' : `auto (${fallback})`;
      input.value = field.input.value;
      input.addEventListener('input', () => { field.input.value = input.value; });
      input.dataset.ui = `chain-input-${setting.rule}`;
      row.append(input);
      row.dataset.tipTitle = field.rule.label;
      row.dataset.tip = `${field.rule.says} Empty uses the engine's own value. Press Apply and run again to use it. Read in: ${setting.why}`;
    } else {
      const v = document.createElement('span');
      v.className = 'v';
      v.textContent = setting.read ? String(setting.read(names, RULES))
        : (RULES[setting.rule] === undefined ? 'engine default' : String(RULES[setting.rule]));
      row.append(v);
      row.dataset.tipTitle = setting.key;
      row.dataset.tip = setting.why ?? 'An engine constant: no rule reaches it.';
    }
    box.append(row);
  }
  return box;
}

/** The print-angle search: the range auto-detection searches, and how its degrees are measured. */
/** An id from a full name: lower-case letters, digits and dashes; '' when the name has none (a Japanese name, say). */
function idOfName(name) {
  return name.normalize('NFKD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 40);
}

/**
 * THE NEW-TYPE STRIP (owner, 2026-11-22: "badge set by user, with full name in drop down; category set by app to choose
 * from"). One place, above the stage tabs, that says which type is being made and how far it has got: category (the
 * app's list; the folder decides which one runs), full name, id, badge, and the steps in order with each one marked
 * from what actually happened - named, run, saved - never guessed. Stages 2-4 are optional edits, so they are links.
 */
function drawTypeStrip() {
  const strip = document.getElementById('type-strip');
  if (!strip) return;
  strip.textContent = '';
  const save = (key, value) => { try { localStorage.setItem(key, value); } catch { /* per-viewer only */ } };
  const field = (label, ui, input, tip) => {
    const row = Object.assign(document.createElement('label'), { className: 'type-field' });
    row.dataset.tipTitle = label;
    row.dataset.tip = tip;
    input.dataset.ui = ui;
    row.append(Object.assign(document.createElement('span'), { className: 'k', textContent: label }), input);
    return row;
  };
  const category = document.createElement('select');
  for (const [value, label] of TYPE_CATEGORIES) {
    // The folder on screen was run as one category; a type of another needs a folder of those scans.
    const option = Object.assign(document.createElement('option'), { value, textContent: label, selected: value === kindNow, disabled: value !== kindNow });
    if (value !== kindNow) option.title = `This folder was run as ${kindNow === 'denture' ? 'dentures' : 'aligners'}: open a folder of ${label.toLowerCase()} scans to make a ${label.toLowerCase()} type.`;
    category.append(option);
  }
  const fullName = Object.assign(document.createElement('input'), { type: 'text', value: typeFullName, maxLength: 60, placeholder: 'Soft denture', spellcheck: false });
  const id = Object.assign(document.createElement('input'), { type: 'text', value: typeName, spellcheck: false, className: 'type-id' });
  const badge = Object.assign(document.createElement('input'), { type: 'text', value: typeBadge, maxLength: 5, placeholder: 'G', spellcheck: false, className: 'type-badge-input' });
  fullName.addEventListener('input', () => {
    typeFullName = fullName.value;
    save('review-type-full-name', typeFullName);
    // The id follows the name until it is typed by hand; a name with no Latin letters keeps the id there was.
    const derived = idOfName(typeFullName);
    if (!typeIdTyped && derived) { typeName = derived; id.value = derived; save('review-type-id', typeName); }
  });
  fullName.addEventListener('change', () => drawTypeStrip());
  id.addEventListener('change', () => { typeName = id.value.trim(); typeIdTyped = true; save('review-type-id', typeName); drawTypeStrip(); });
  badge.addEventListener('change', () => { typeBadge = badge.value.trim(); save('review-type-badge', typeBadge); drawTypeStrip(); });
  const newType = Object.assign(document.createElement('button'), { type: 'button', textContent: 'New type', className: 'type-new' });
  newType.dataset.ui = 'type-new';
  newType.title = 'Start a new type from the built-in one: clears the name, id and badge and puts the search, the zone setup and every setting back to the standard ones. The review on screen is not touched.';
  newType.addEventListener('click', () => {
    typeFullName = ''; typeName = ''; typeBadge = ''; typeIdTyped = false; ranTypeId = null; savedTypeId = null;
    for (const key of ['review-type-full-name', 'review-type-id', 'review-type-badge']) save(key, '');
    document.getElementById('bench-reset')?.click();
    drawTypeStrip();
    document.querySelector('[data-ui="type-full-name"]')?.focus();
  });
  const fields = Object.assign(document.createElement('div'), { className: 'type-fields' });
  fields.append(
    Object.assign(document.createElement('b'), { className: 'type-title', textContent: 'Type' }),
    field('category', 'type-category', category, 'What the type is for - the app\'s list. The folder on screen decides which one runs.'),
    field('name', 'type-full-name', fullName, 'The full name the app shows in its type list, one line, up to 60 characters.'),
    field('id', 'type-name', id, 'The file name: lower-case letters, digits, dots and dashes. Follows the name until you type it yourself. Save type writes types/<category>/<id>.type.json.'),
    field('badge', 'type-badge', badge, 'Up to 5 characters, no spaces: shown beside the name in the app\'s type list. Empty = the app\'s default badge.'),
    Object.assign(document.createElement('span'), { className: 'type-based', textContent: 'based on the built-in' }),
    newType,
  );
  // The steps, in order, each marked from what happened.
  // A valid id is enough: with no full name the type is named after its id (typeInForce typeNameOf), and asking for one
  // here left Apply and Save working but never ticked (Fable, 2026-11-23).
  const named = /^[a-z0-9][a-z0-9.-]*$/.test(typeName);
  const ran = named && ranTypeId === typeName;
  const saved = ran && savedTypeId === typeName;
  const steps = Object.assign(document.createElement('ol'), { className: 'type-steps' });
  steps.dataset.ui = 'type-steps';
  const current = !named ? 'name' : !ran ? 'apply' : !saved ? 'save' : null;
  for (const [key, label, done, stage] of [
    ['name', 'Name it', named, null], ['orient', '1 Orient', false, 'orient'], ['rim', '2 Rim', false, 'rim'], ['zones', '3 Zones', false, 'zones'],
    ['support', '4 Settings', false, 'support'], ['angle', '5 Print angle', false, 'angle'], ['apply', 'Apply and run', ran, null], ['save', 'Save type', saved, null],
  ]) {
    const step = document.createElement('li');
    step.dataset.ui = `type-step-${key}`;
    step.className = `${done ? 'done' : ''}${current === key ? ' now' : ''}`.trim();
    if (stage && kindNow === 'denture') {
      // Optional edits: a link to the stage, not a box to tick.
      const go = Object.assign(document.createElement('button'), { type: 'button', textContent: label, className: 'type-step-link' });
      go.addEventListener('click', () => { stageNow = stage; save('review-stage', stage); if (lastChain) drawChain(...lastChain); });
      step.append(go);
    } else if (!stage) {
      step.textContent = `${done ? '✓ ' : ''}${label}`;
    } else {
      continue; // an aligner run has no editable stages yet
    }
    steps.append(step);
  }
  strip.append(fields, steps);
  if (ran && ranTypeLoad && !ranTypeLoad.loads) {
    const warn = Object.assign(document.createElement('p'), { className: 'type-note type-warn', textContent: `The app will not load this type yet: ${ranTypeLoad.reason}` });
    warn.dataset.ui = 'type-load-warning';
    strip.append(warn);
  }
  if (kindNow === 'aligner') {
    // An aligner run has no editable stages yet: say what an aligner type can change today, so the missing links read as
    // a fact rather than a fault. (The app loads aligner types since 2026-11-23, docs/TYPE-PIPELINE.md section 8a.)
    strip.append(Object.assign(document.createElement('p'), { className: 'type-note',
      textContent: 'An aligner type carries its own name and badge; its numbers are the built-in aligner\'s until the aligner stages become editable.' }));
  }
}

/**
 * The restore mark (docs/WORKBENCH-TABS-PLAN.md section 4): one small button beside an edited value that puts back
 * its standard value and says which. The caller shows it only while the value differs. The canvas nodes draw the
 * same mark (nodeEditor/ZoneEditor.tsx), with the standard value from the library's `defaultOf`.
 */
function restoreMark(standard, onRestore) {
  const button = Object.assign(document.createElement('button'), { type: 'button', className: 'restore-mark', textContent: '↺', title: `Restore to ${standard}` });
  button.dataset.ui = 'restore-mark';
  button.setAttribute('aria-label', `Restore to ${standard}`);
  button.addEventListener('click', (event) => { event.preventDefault(); onRestore(); });
  return button;
}

function searchCard() {
  const s = searchNow();
  const node = document.createElement('div');
  node.className = 'chain-node search';
  node.dataset.ui = 'chain-node-print-angle';
  const title = document.createElement('span');
  title.className = 'n';
  title.textContent = 'Print-angle search';
  const fig = document.createElement('div');
  fig.className = 'deg-figure';
  // Drawn from the numbers, not a picture of them: the plate, upright (0), the search's end, and the
  // angle this case picked. Leaning RIGHT here is "teeth side further up" (denture/pose.rs:13-17).
  const ray = (deg, len) => {
    const r = (deg * Math.PI) / 180;
    return [60 + len * Math.sin(r), 112 - len * Math.cos(r)].map((n) => n.toFixed(1));
  };
  const [ex, ey] = ray(s.endDeg, 92);
  const [ax0, ay0] = ray(s.startDeg, 44);
  const [ax1, ay1] = ray(s.endDeg, 44);
  const picked = caseNow?.printAngleDeg;
  const [px, py] = ray(picked ?? 0, 92);
  fig.innerHTML = `<svg viewBox="0 0 260 128" role="img" aria-label="Print angle: 0 degrees upright, search to ${s.endDeg} degrees${picked == null ? '' : `, picked ${picked} degrees`}">`
    + '<line x1="8" y1="112" x2="252" y2="112" class="plate"/><text x="160" y="125">build plate</text>'
    + `<line x1="60" y1="112" x2="60" y2="16" class="up"/><text x="48" y="12">0°</text>`
    + (s.startDeg > 0 ? (() => { const [sx, sy] = ray(s.startDeg, 92); return `<line x1="60" y1="112" x2="${sx}" y2="${sy}" class="up"/><text x="${Number(sx) + 4}" y="${sy}">${s.startDeg}°</text>`; })() : '')
    + `<line x1="60" y1="112" x2="${ex}" y2="${ey}" class="up"/><text x="${Number(ex) + 4}" y="${ey}">${s.endDeg}°</text>`
    + `<path d="M${ax0} ${ay0} A44 44 0 0 1 ${ax1} ${ay1}" class="arc"/>`
    + (picked == null ? '' : `<line x1="60" y1="112" x2="${px}" y2="${py}" class="lean"/><text x="${Number(px) + 6}" y="${Number(py) + 14}" class="picked">picked ${picked}°</text>`)
    + '</svg>';
  const how = document.createElement('p');
  how.className = 'deg-how';
  // Fable read this from denture/upright.rs:25 and pose.rs:1-17; verified there 2026-11-20.
  how.textContent = '0° is the denture standing upright on the open ends of the U, front of the arch on top. Each degree leans it back so the teeth side faces further up.';
  const box = document.createElement('div');
  box.className = 'chain-sets';
  // The type's name and badge moved to the New-type strip above the stage tabs (drawTypeStrip).
  // The search: real fields now that the engine takes a type's numbers (engine 70).
  const defaults = graphLib?.PRINT_ANGLE_SEARCH ?? { startDeg: 0, endDeg: 45, stepDeg: 2, marginDeg: 2 };
  for (const [key, label, field, why] of POSE_FIELDS) {
    const row = document.createElement('label');
    row.className = 'chain-set';
    row.dataset.tipTitle = label;
    row.dataset.tip = `${why} Built-in: ${defaults[field]}°.`;
    const input = Object.assign(document.createElement('input'), { type: 'number', step: 'any', min: '0', max: '90', value: String(s[field]) });
    input.dataset.ui = `pose-${key}`;
    input.addEventListener('change', () => {
      const value = Number(input.value);
      if (input.value === '' || value === defaults[field]) delete poseEdits[key];
      else poseEdits[key] = value;
      try { localStorage.setItem('review-pose', JSON.stringify(poseEdits)); } catch { /* per-viewer only */ }
      if (lastChain) drawChain(...lastChain);
      scheduleTiltPreview();
    });
    row.append(Object.assign(document.createElement('span'), { className: 'k', textContent: `${label} (°)${poseEdits[key] !== undefined ? ' · edited' : ''}` }), input);
    if (poseEdits[key] !== undefined) {
      row.append(restoreMark(`the built-in ${defaults[field]}°`, () => {
        delete poseEdits[key];
        try { localStorage.setItem('review-pose', JSON.stringify(poseEdits)); } catch { /* per-viewer only */ }
        if (lastChain) drawChain(...lastChain);
        scheduleTiltPreview();
      }));
    }
    box.append(row);
  }
  const pickedRow = document.createElement('div');
  pickedRow.className = 'chain-set';
  pickedRow.dataset.tipTitle = 'picked';
  pickedRow.dataset.tip = `What the search chose for this case${caseNow?.stableBand ? `, stable over ${caseNow.stableBand}` : ''}. It keeps the best lean by an ORDERED preference: safety tiers, then fewest boxed-in lowest points, then fewest lows outside the allowed area, THEN the smallest overhang area (denture/tilt.rs:16-19).`;
  pickedRow.innerHTML = '<span class="k">picked</span><span class="v"></span>';
  pickedRow.querySelector('.v').textContent = caseNow?.printAngleDeg == null ? '-' : `${caseNow.printAngleDeg}°`;
  box.append(pickedRow);
  // The live preview (plan D3): the pick the page's settings give, and every angle the search tried with them.
  const live = tiltNow();
  if (live?.kind === 'scan') {
    const previewRow = document.createElement('div');
    previewRow.className = 'chain-set';
    previewRow.dataset.ui = 'search-preview-pick';
    previewRow.dataset.tipTitle = 'preview';
    previewRow.dataset.tip = 'What the search picks with the settings on this page, before Apply. No support is built for it.';
    previewRow.innerHTML = '<span class="k">preview</span><span class="v"></span>';
    previewRow.querySelector('.v').textContent = `${live.pickedDeg}°${live.band ? `, stable ${live.band[0]}-${live.band[1]}°` : ''}`;
    const angles = document.createElement('div');
    angles.className = 'chain-none';
    angles.dataset.ui = 'search-preview-angles';
    angles.textContent = `Angles tried: ${live.rows.map((r) => `${r.tiltDeg}° ${r.failed.length ? `fails ${r.failed.join(', ')}` : r.robust ? 'robust' : 'passes'}`).join(' · ')}`;
    box.append(previewRow, angles);
  }
  const problem = searchProblem(s);
  const note = document.createElement('div');
  note.className = problem ? 'chain-none bad' : 'chain-none';
  note.dataset.ui = 'search-note';
  note.textContent = problem
    ? `Fix the search first: ${problem}.`
    : 'Apply tries these angles on this folder. Save type keeps them, as the type named above, for next time. In the app the angle dial still fine-tunes or overrides it.';
  node.append(title, fig, how, box, note);
  return node;
}

/** The stage tabs and whichever stage is chosen. */
function drawChain(present, names) {
  lastChain = [present, names];
  const section = document.getElementById('chain');
  const tabs = document.getElementById('stage-tabs');
  const body = document.getElementById('stage-body');
  if (!section || !tabs || !body) return;
  // The type being made sits above the stages for both kinds - only a served review can run or save one.
  const strip = document.getElementById('type-strip');
  if (strip) { strip.hidden = !reviewServed; if (reviewServed) drawTypeStrip(); }
  if (kindNow !== 'denture') {
    // An aligner run shows the aligner's LOCKED graph read-only (step 4.4c, docs/ORIENT-NODES.md section 10).
    section.hidden = !graphLib;
    // The canvas when the bundle loaded; the plain cards otherwise, so the aligner graph never vanishes.
    if (graphLib) { tabs.textContent = ''; body.textContent = ''; if (!drawRimCanvas(body, 'aligner')) drawAlignerGraph(body); }
    return;
  }
  section.hidden = false;
  tabs.textContent = '';
  STAGES.forEach((stage, k) => {
    if (k > 0) tabs.append(Object.assign(document.createElement('span'), { className: 'stage-arrow', textContent: '→' }));
    const tab = document.createElement('button');
    tab.type = 'button';
    tab.className = 'stage-tab';
    tab.textContent = stage.title;
    tab.dataset.ui = `stage-tab-${stage.id}`;
    tab.setAttribute('aria-pressed', String(stageNow === stage.id));
    tab.addEventListener('click', () => {
      stageNow = stage.id;
      try { localStorage.setItem('review-stage', stageNow); } catch { /* per-viewer convenience only */ }
      // Only what this tab and the earlier ones produce (the owner's preview rule): the step walk's cut-off.
      setStep(stage.cut);
      drawChain(present, names);
      // The per-node overlay belongs to the Zones tab only.
      showZonePreview();
      // Tabs 4 and 5 preview the page's settings (plan D3); off them their tips come down.
      scheduleTiltPreview();
    });
    tabs.append(tab);
  });
  body.textContent = '';
  const stage = STAGES.find((s) => s.id === stageNow) ?? STAGES.find((s) => s.id === 'zones');
  if (stage.id === 'zones') { drawZoneEditor(body, present, names); return; }
  // ORIENT AND RIM SHOW THEIR STEPS AS NODES on the canvas below, so the step cards only repeated them and took the
  // room (owner 2026-11-23: "do we still need these, or combine it with the canvas"). What the cards still told you -
  // which colour in 3D is which - stays as one line of swatches; the tab itself already cuts the 3D to its steps.
  // Without the canvas bundle the cards come back, so the tab is never empty.
  const hasCanvas = stage.id === 'orient' ? Boolean(orientLib && editorLib) : stage.id === 'rim' ? Boolean(graphLib && editorLib?.mountRimCanvas) : false;
  // The key rides in the canvas's own toolbar row, not a row of its own (owner 2026-11-23: "combine with the bottom
  // canvas so there's more space").
  if (hasCanvas) {
    if (stage.id === 'orient') drawOrientEditor(body, colourKey(stage, present));
    else drawRimCanvas(body, 'denture', colourKey(stage, present));
    return;
  }
  const rail = document.createElement('div');
  rail.className = 'chain-rail';
  rail.dataset.ui = `stage-rail-${stage.id}`;
  const cards = stage.steps.map((at) => chainCard(at, present, names));
  if (stage.id === 'angle') cards.push(searchCard());
  cards.forEach((card, k) => {
    if (k > 0) rail.append(Object.assign(document.createElement('span'), { className: 'chain-link', textContent: '>' }));
    rail.append(card);
  });
  body.append(rail);
  if (stage.id === 'support' || stage.id === 'angle') body.append(tiltPreviewNote);
  if (stage.id === 'orient') drawOrientEditor(body);
  if (stage.id === 'rim') drawRimCanvas(body, 'denture');
}

/**
 * Stage 1's Orient graph, editable (U6): which face goes to the plate and which way is up. The standard setup is
 * today's denture Step 1; "Flat-base recipe" is the owner's new kind's (ruling 1, 2026-11-23): the largest flat area
 * set on the plate. Every rule lives in `orientGraph.mjs`; this only draws it and keeps it.
 */
function drawOrientEditor(body, key = null) {
  if (!orientLib || !editorLib) return;
  const g = orientGraph;
  const { problems } = orientLib.validate(g);
  const save = (next) => {
    orientGraph = next;
    try { localStorage.setItem('review-orient-graph', JSON.stringify(next)); } catch { /* per-viewer only */ }
    relabelSides();
    autoRunOrient(); // before the redraw, so the status line already says a run is coming
    if (lastChain) drawChain(...lastChain);
  };
  const status = document.createElement('div');
  status.className = orientLib.isDefault(g) ? 'zone-status default' : 'zone-status edited';
  status.dataset.ui = 'orient-status';
  const ran = ranOrientGraph === 'default' ? 'the standard Step 1' : `your Orient setup (${ranOrientGraph.slice(0, 8)})`;
  // Measured against what RAN, not against the standard: "changed - Apply" right after an Apply read as a dead button.
  status.textContent = ranThis(orientLib, g, ranOrientGraphJson)
    ? `Orient graph: ${ran} - the review on screen ran this.`
    // Only while a run is really queued: a canvas edited before a reload starts nothing until it is edited again.
    : autoRunTimer !== null || autoRunWaiting ? `Orient graph: changed - it runs on its own in a moment (about 27 s). The review on screen used ${ran}.`
    : `Orient graph: changed - Apply and run again to use it. The review on screen used ${ran}.`;
  const bar = document.createElement('div');
  bar.className = 'zone-bar';
  const summary = document.createElement('span');
  summary.dataset.ui = 'orient-report';
  summary.className = problems.length ? 'zone-summary bad' : 'zone-summary ok';
  summary.textContent = problems.length === 0 ? 'All connections are complete.' : `${problems.length} to fix: ${problems[0]}`;
  const pick = document.createElement('select');
  pick.dataset.ui = 'orient-add-kind';
  for (const [groupKey, group] of Object.entries(orientLib.NODE_GROUPS)) {
    const optgroup = Object.assign(document.createElement('optgroup'), { label: group.title });
    for (const kind of Object.keys(orientLib.KINDS).filter((k) => orientLib.KIND_GROUP[k] === groupKey)) {
      optgroup.append(Object.assign(document.createElement('option'), { value: kind, textContent: orientLib.KIND_WORDS[kind].title, title: orientLib.KIND_WORDS[kind].says }));
    }
    pick.append(optgroup);
  }
  const add = Object.assign(document.createElement('button'), { type: 'button', textContent: 'Add node', title: 'Adds the chosen node in the middle of the view.' });
  add.dataset.ui = 'orient-add';
  add.addEventListener('click', () => save(orientLib.addNode(g, pick.value)));
  const flat = Object.assign(document.createElement('button'), { type: 'button', textContent: 'Flat-base recipe', title: 'Largest flat area -> Set as bottom: the base goes on the plate. Made for a model with a flat base.' });
  flat.dataset.ui = 'orient-flat-base';
  flat.addEventListener('click', () => { orientPositions = editorLib.autoLayout(orientLib.flatBaseGraph(), []); save(orientLib.flatBaseGraph()); });
  const reset = Object.assign(document.createElement('button'), { type: 'button', textContent: 'Back to standard Step 1', title: 'The canvas goes back to today\'s Step 1.' });
  reset.dataset.ui = 'orient-reset';
  reset.disabled = orientLib.isDefault(g);
  reset.addEventListener('click', () => { orientPositions = editorLib.autoLayout(orientLib.defaultGraph(), []); save(orientLib.defaultGraph()); });
  const tools = Object.assign(document.createElement('span'), { className: 'zone-tools-row' });
  tools.append(pick, add, flat, reset);
  bar.append(summary, ...(key ? [key] : []), tools);
  const props = {
    lib: orientLib, graph: g, positions: orientPositions, liveParams: [], onGraph: save,
    // What each step measured on the case on screen (B3): the readouts of the graph that RAN for it.
    values: orientRead?.lines ?? {},
    onPositions: (next) => {
      orientPositions = next;
      try { localStorage.setItem('review-orient-layout', JSON.stringify(next)); } catch { /* per-viewer only */ }
      orientHandle?.update({ ...props, positions: next });
    },
  };
  if (!orientPositions?.outputs) orientPositions = { ...editorLib.autoLayout(g, []), ...(orientPositions ?? {}) };
  props.positions = orientPositions;
  body.append(status, bar, orientSideNote, orientCanvasHost);
  relabelSides();
  if (orientHandle) orientHandle.update(props);
  else orientHandle = editorLib.mountZoneEditor(orientCanvasHost, props);
}

/**
 * The rim tab as a node canvas (`nodeGraph.mjs` rimTabView / rimOutputLines, `nodeEditor/RimCanvas.tsx`): the rim and
 * the strips grown from it, with their settings (C3) and the Rim output card; the nodes computed from the finished rim
 * greyed with their reason. False when the bundle or the graph library did not load, so the caller can fall back to
 * plain cards.
 */
function drawRimCanvas(body, kind, key = null) {
  if (!graphLib || !editorLib?.mountRimCanvas) return false;
  const note = document.createElement('p');
  note.className = 'chain-note';
  note.dataset.ui = 'rim-canvas-note';
  note.textContent = kind === 'aligner'
    ? 'The aligner\'s steps as nodes. They are locked in this version: each stands for today\'s aligner code, and the settings that shape them are in the aligner profile. Greyed nodes need the finished rim.'
    : 'The rim and the strips grown from it, with their settings: change one and Apply and run to see it. The rim reads the final orientation of 1 Orient. Greyed nodes need the finished rim, so they appear here only for reference.';
  if (key) {
    const bar = Object.assign(document.createElement('div'), { className: 'zone-bar' });
    bar.append(note, key);
    body.append(bar, rimCanvasHost);
  } else {
    body.append(note, rimCanvasHost);
  }
  // standsOnFlatArea: the Orient canvas's pose is a Stand on the flat area, the only pose the flat edge can follow.
  const pose = orientGraph?.nodes?.find((n) => n.id === orientGraph.outputs?.pose);
  const ctx = { graph: zoneGraph, placement: placementEdits, ran: ranPlacement, standsOnFlatArea: pose?.kind === 'setBottom' };
  const props = { kind, view: graphLib.rimTabView(kind, ctx), output: graphLib.rimOutputLines(kind, ctx), onField: kind === 'denture' ? onRimField : undefined };
  if (rimHandle) rimHandle.update(props);
  else rimHandle = editorLib.mountRimCanvas(rimCanvasHost, props);
  return true;
}

/**
 * One Rim tab field changed (C3). The Rim's settings go on the zone graph's RIM node - the one graph the engine reads,
 * drawn on two tabs - and a value equal to the standard is REMOVED rather than written, so an undone edit leaves the
 * standard graph standard. The strip widths go to `placementEdits`, the type's profile numbers sent with Apply.
 */
function onRimField(nodeId, field, value) {
  const back = value === null || String(value) === String(field.standard);
  if (field.target === 'graph') {
    zoneGraph = { ...zoneGraph, nodes: zoneGraph.nodes.map((n) => {
      if (n.id !== nodeId) return n;
      const { [field.key]: _old, ...rest } = n.params ?? {};
      return { ...n, params: back ? rest : { ...rest, [field.key]: value } };
    }) };
    try { localStorage.setItem('review-zone-graph', JSON.stringify(zoneGraph)); } catch { /* per-viewer only */ }
  } else {
    if (back) delete placementEdits[field.key];
    else placementEdits[field.key] = value;
    try { localStorage.setItem('review-placement', JSON.stringify(placementEdits)); } catch { /* per-viewer only */ }
  }
  if (lastChain) drawChain(...lastChain);
  scheduleTiltPreview();
}

/**
 * The aligner's graph, read-only: today's aligner chain as locked nodes (`nodeGraph.mjs` alignerGraph). Nothing here
 * is a control - every node is fixed in this version, and a field that accepted an edit the engine refuses would be
 * a control that lies. Each card says what the step is, what it reads and which output it fills.
 */
function drawAlignerGraph(body) {
  const g = graphLib.alignerGraph();
  const note = document.createElement('p');
  note.className = 'chain-note';
  note.dataset.ui = 'aligner-graph-note';
  note.textContent = 'The aligner\'s steps as nodes, in the same shape as the denture\'s zone graph. They are locked in this version: each stands for today\'s aligner code. The settings that shape them are in the aligner profile.';
  const rail = document.createElement('div');
  rail.className = 'chain-rail';
  rail.dataset.ui = 'aligner-graph-nodes';
  g.nodes.forEach((n, k) => {
    const spec = graphLib.ALIGNER_KINDS[n.kind];
    if (k > 0) rail.append(Object.assign(document.createElement('span'), { className: 'chain-link', textContent: '>' }));
    const card = document.createElement('div');
    card.className = 'chain-node locked';
    card.dataset.ui = `aligner-node-${n.id}`;
    const title = Object.assign(document.createElement('span'), { className: 'n', textContent: spec.label });
    const lock = Object.assign(document.createElement('span'), { className: 'lock', textContent: 'locked' });
    const says = Object.assign(document.createElement('span'), { className: 'chain-none', textContent: spec.says });
    card.append(title, lock, says);
    const from = Object.values(n.inputs);
    if (from.length > 0) {
      const names = from.map((id) => graphLib.ALIGNER_KINDS[g.nodes.find((m) => m.id === id).kind].label);
      card.append(Object.assign(document.createElement('span'), { className: 'chain-none', textContent: `Reads: ${names.join(', ')}` }));
    }
    const fills = Object.entries(g.outputs).filter(([, id]) => id === n.id).map(([name]) => name.replace(/_/g, ' '));
    if (fills.length > 0) card.append(Object.assign(document.createElement('span'), { className: 'chain-none', textContent: `Output: ${fills.join(', ')}` }));
    rail.append(card);
  });
  body.append(note, rail);
}

/** Stage 2: the zone graph, editable. */
function drawZoneEditor(body, present, names) {
  if (!graphLib) {
    body.append(Object.assign(document.createElement('p'), { className: 'chain-none', textContent: 'The zone editor needs the review server (nodeGraph.mjs did not load).' }));
    return;
  }
  const g = zoneGraph;
  const { problems, warnings } = graphLib.validate(g);
  const idle = new Set(graphLib.unreached(g));
  const save = (next) => {
    // R1b's angle is the one zone parameter that runs today (rule noSupportSteepDeg). The canvas edits
    // the graph; this carries that one value on to the rule, so Apply re-runs with it.
    const live = benchFields?.get('noSupportSteepDeg');
    const deg = next.nodes.find((n) => n.id === 'R1b')?.params.deg;
    if (live && deg !== undefined) live.input.value = Number(deg) > 0 ? String(deg) : '';
    zoneGraph = next;
    try { localStorage.setItem('review-zone-graph', JSON.stringify(next)); } catch { /* per-viewer only */ }
    scheduleZonePreview();
    drawChain(present, names);
  };

  // Status: which of the two things the operator is looking at, every time - in one line, so the
  // canvas keeps the room (UX review 2026-11-20: seven rows of chrome above it hid its own controls).
  const status = document.createElement('div');
  status.className = graphLib.isDefault(g) ? 'zone-status default' : 'zone-status edited';
  status.dataset.ui = 'zone-status';
  // Two facts, both said every time: what the canvas holds, and what produced the review on screen.
  // They differ right after an edit, until Apply runs it - and that gap is exactly what must be visible.
  const ran = ranZoneGraph === 'default' ? 'the standard setup'
    : ranZoneGraph === 'unknown' ? 'a setup this folder does not record' : `your setup (${ranZoneGraph.slice(0, 8)})`;
  // F5: once this page has applied a graph, say whether the canvas still IS that graph.
  // Measured against what RAN (the summary's graph), as the Orient tab's: a folder that does not record it keeps the
  // old wording, since nothing on screen can say whether the canvas matches it.
  status.textContent = ranZoneGraph !== 'unknown' && ranThis(graphLib, g, ranZoneGraphJson)
    ? `Zone setup: ${ran} - the review on screen ran this.`
    : graphLib.isDefault(g) ? `Standard zone setup. The review on screen used ${ran}.`
    : `Your zone setup (changed) - Apply and run again to use it. The review on screen used ${ran}.`;

  // One toolbar: is it complete, the colour key, add a node, back to standard.
  const bar = document.createElement('div');
  bar.className = 'zone-bar';
  // Problems that name a node are drawn ON that node; only the rest (an output left empty) need words here.
  const onNodes = (m) => g.nodes.some((n) => m.startsWith(`${n.id}: `));
  const loose = problems.filter((m) => !onNodes(m));
  const summary = document.createElement('span');
  summary.dataset.ui = 'zone-report';
  summary.className = problems.length ? 'zone-summary bad' : 'zone-summary ok';
  summary.textContent = problems.length === 0 ? 'All connections are complete.'
    : `${problems.length} to fix${problems.length > loose.length ? ' - shown in red on the nodes' : ''}${loose.length ? `: ${loose[0]}` : ''}.`;
  const legend = document.createElement('span');
  legend.className = 'zone-legend';
  legend.dataset.ui = 'zone-legend';
  for (const [groupKey, group] of Object.entries(graphLib.NODE_GROUPS)) {
    if (groupKey === 'orient') continue; // not drawn on this canvas
    const key = Object.assign(document.createElement('span'), { textContent: group.title, title: group.says });
    key.style.setProperty('--zn-group', `var(${group.token})`);
    legend.append(key);
  }
  const pick = document.createElement('select');
  pick.dataset.ui = 'zone-add-kind';
  // Grouped like the canvas's coloured stripes, so the list reads in the same categories.
  for (const [groupKey, group] of Object.entries(graphLib.NODE_GROUPS)) {
    const kinds = Object.entries(graphLib.KINDS).filter(([kind, spec]) => spec.stage === 'zones' && graphLib.KIND_GROUP[kind] === groupKey);
    if (kinds.length === 0) continue;
    const optgroup = Object.assign(document.createElement('optgroup'), { label: group.title });
    for (const [kind] of kinds) optgroup.append(Object.assign(document.createElement('option'), { value: kind, textContent: graphLib.KIND_WORDS[kind].title, title: graphLib.KIND_WORDS[kind].says }));
    pick.append(optgroup);
  }
  const add = Object.assign(document.createElement('button'), { type: 'button', textContent: 'Add node', title: 'Adds the chosen node in the middle of the view. Remove one by selecting it and pressing × or Delete.' });
  add.dataset.ui = 'zone-add';
  add.addEventListener('click', () => save(graphLib.addNode(g, pick.value)));
  const reset = Object.assign(document.createElement('button'), { type: 'button', textContent: 'Back to standard setup', title: 'Undo every zone edit: the canvas goes back to the standard setup.' });
  reset.dataset.ui = 'zone-reset';
  reset.disabled = graphLib.isDefault(g);
  reset.addEventListener('click', () => {
    zonePositions = editorLib ? editorLib.autoLayout(graphLib.defaultGraph(), graphLib.FIXED.outputs) : null;
    try { localStorage.removeItem('review-zone-layout-2'); } catch { /* per-viewer only */ }
    save(graphLib.defaultGraph());
  });
  const tools = Object.assign(document.createElement('span'), { className: 'zone-tools-row' });
  tools.append(pick, add, reset);
  bar.append(summary, legend, tools);
  // Kept for the card editor fallback, which still lists every problem in words.
  const report = document.createElement('div');
  report.className = 'zone-report';
  for (const p of problems) report.append(Object.assign(document.createElement('div'), { className: 'bad', textContent: p }));
  for (const w of warnings) report.append(Object.assign(document.createElement('div'), { className: 'warn', textContent: w }));

  // The outputs the engine reads, by name - each one a choice of node.
  const outs = document.createElement('div');
  outs.className = 'zone-outs';
  outs.dataset.ui = 'zone-outputs';
  for (const [name, want] of Object.entries(graphLib.REQUIRED_OUTPUTS)) {
    const label = document.createElement('label');
    label.className = 'zone-out';
    label.dataset.tipTitle = graphLib.OUTPUT_WORDS[name].title;
    label.dataset.tip = `${graphLib.OUTPUT_WORDS[name].says} Needs ${graphLib.TYPE_WORDS[want] ?? want}; left empty, the run is refused.`;
    const sel = sourceSelect(g, want, g.outputs[name]);
    sel.dataset.ui = `zone-out-${name}`;
    sel.addEventListener('change', () => save(graphLib.bindOutput(g, name, sel.value || null)));
    label.append(Object.assign(document.createElement('span'), { className: 'k', textContent: graphLib.OUTPUT_WORDS[name].title }), sel);
    outs.append(label);
  }

  // The canvas: drag nodes, draw wires socket to socket, delete with Backspace. Outputs are nodes on
  // it, so the output row is only the fallback's.
  if (editorLib) {
    const props = {
      lib: graphLib, graph: g, positions: zonePositions,
      liveParams: benchFields?.has('noSupportSteepDeg') ? ['R1b.deg'] : [],
      onGraph: save,
      // The selected node's values on the model (plan D2): the zone as it stands at that node.
      onSelect: (id) => { if (id !== zoneSelected) { zoneSelected = id; showZonePreview(); } },
      onPositions: (next) => {
        zonePositions = next;
        try { localStorage.setItem('review-zone-layout-2', JSON.stringify(next)); } catch { /* per-viewer only */ }
        editorHandle?.update({ ...props, positions: next });
      },
    };
    // Only the output node is filled in here: a node ADDED from the toolbar is left unplaced, and the
    // canvas puts it in the middle of the view, where the operator is looking.
    if (!zonePositions.outputs) zonePositions = { ...editorLib.autoLayout(g, graphLib.FIXED.outputs), ...zonePositions };
    body.append(status, bar, zonePreviewNote, zoneCanvasHost);
    // An edit can change what the selected node means against the run: the note says so.
    if (zoneSelected) showZonePreview();
    if (editorHandle) editorHandle.update(props);
    else editorHandle = editorLib.mountZoneEditor(zoneCanvasHost, props);
    return;
  }

  // Fallback: the card editor, when the canvas bundle is not there.
  const rail = document.createElement('div');
  rail.className = 'chain-rail zone-rail';
  rail.dataset.ui = 'zone-nodes';
  g.nodes.forEach((n, k) => rail.append(zoneCard(g, n, k, idle, save)));

  body.append(status, bar, report, outs, rail);
}

/** A select of the nodes whose output fits `want` ('mask', or 'mask|rim'). */
function sourceSelect(g, want, current) {
  const sel = document.createElement('select');
  sel.append(Object.assign(document.createElement('option'), { value: '', textContent: '— none —' }));
  // A Mark's `under` is optional ("zone?"): the mark is not part of the type.
  const fits = graphLib.inputType(want).split('|');
  for (const n of g.nodes) {
    const out = graphLib.KINDS[n.kind]?.out;
    if (!fits.includes(out)) continue;
    sel.append(Object.assign(document.createElement('option'), { value: n.id, textContent: `${n.id} · ${graphLib.KINDS[n.kind].label}`, selected: n.id === current }));
  }
  return sel;
}

/** One zone node: kind, wires, parameters, remove, move. */
function zoneCard(g, n, k, idle, save) {
  const spec = graphLib.KINDS[n.kind];
  const card = document.createElement('div');
  card.className = `chain-node zone-node${idle.has(n.id) ? ' idle' : ''}${spec.fixed ? ' fixed' : ''}`;
  card.dataset.ui = `zone-node-${n.id}`;
  const head = document.createElement('div');
  head.className = 'zone-head';
  const title = document.createElement('span');
  title.className = 'n';
  const words = graphLib.KIND_WORDS[n.kind];
  title.textContent = `${words.title} · ${n.id}`;
  title.dataset.tipTitle = words.title;
  title.dataset.tip = `${words.says}${n.note ? ` — ${n.note}` : ''}`;
  head.append(title);
  const tools = document.createElement('span');
  tools.className = 'zone-tools';
  const mk = (txt, ui, tip, on, disabled = false) => {
    const b = Object.assign(document.createElement('button'), { type: 'button', textContent: txt, disabled });
    b.dataset.ui = ui;
    b.title = tip;
    b.addEventListener('click', on);
    return b;
  };
  const move = (dir) => {
    const nodes = [...g.nodes];
    const j = k + dir;
    if (j < 0 || j >= nodes.length) return;
    [nodes[k], nodes[j]] = [nodes[j], nodes[k]];
    save({ ...g, nodes });
  };
  tools.append(
    mk('◀', `zone-left-${n.id}`, 'Move left. This only changes where the card is drawn — what a zone means is set by its WIRES.', () => move(-1), k === 0),
    mk('▶', `zone-right-${n.id}`, 'Move right. Layout only; the wires decide the order of combination.', () => move(1), k === g.nodes.length - 1),
    mk('×', `zone-remove-${n.id}`, spec.fixed ? 'Found by stage 1 — it cannot be removed here.' : 'Remove. Anything wired to it is left EMPTY and named in the report, never quietly re-routed.', () => save(graphLib.removeNode(g, n.id)), Boolean(spec.fixed)),
  );
  head.append(tools);
  card.append(head);
  if (idle.has(n.id)) card.append(Object.assign(document.createElement('div'), { className: 'chain-none', textContent: 'reaches no output — not evaluated, costs nothing' }));

  // Inputs: each a choice of wire. This IS the rearranging: which node feeds which side.
  for (const [name, want] of Object.entries(spec.inputs)) {
    const row = document.createElement('label');
    row.className = 'chain-set';
    row.dataset.tipTitle = `${n.id}.${name}`;
    row.dataset.tip = n.kind === 'subtract' ? (name === 'a' ? 'A, the minuend: the faces kept unless B holds them.' : 'B: the faces taken away from A.') : `Takes a ${want.replace('|', ' or ')}.`;
    const sel = sourceSelect(g, want, n.inputs[name]);
    sel.dataset.ui = `zone-in-${n.id}-${name}`;
    sel.addEventListener('change', () => save(graphLib.rewire(g, n.id, name, sel.value || null)));
    row.append(Object.assign(document.createElement('span'), { className: 'k', textContent: `in ${name}` }), sel);
    card.append(row);
  }
  // Parameters.
  for (const [key, value] of Object.entries(n.params)) {
    const row = document.createElement('label');
    row.className = 'chain-set';
    const numeric = typeof graphLib.KINDS[n.kind].params[key] === 'number';
    const words = graphLib.PARAM_WORDS[key] ?? { label: key, help: '' };
    // Anything that is not a number is a dropdown of the values the engine accepts - never free text.
    const input = document.createElement(numeric ? 'input' : 'select');
    if (numeric) Object.assign(input, { type: 'number', step: 'any' });
    else for (const [v, label] of words.choices ?? []) input.append(new Option(label, v));
    input.value = String(value);
    // Fixed in this version (graphLib.FIXED mirrors the engine): shown, never editable.
    const fixedHere = Boolean(graphLib.FIXED.params[n.kind]?.includes(key));
    input.disabled = fixedHere;
    input.dataset.ui = `zone-param-${n.id}-${key}`;
    // R1b's angle is the ONE zone parameter that already runs today, through the rule
    // noSupportSteepDeg. Its field mirrors the benchwork panel, so turning it here and pressing Apply
    // actually re-runs the case - the only zone edit that does, until the engine takes a graph.
    const live = n.id === 'R1b' && key === 'deg' ? benchFields?.get('noSupportSteepDeg') : null;
    if (live) {
      input.value = live.input.value === '' ? String(value) : live.input.value;
      input.addEventListener('input', () => { live.input.value = input.value === '0' ? '' : input.value; });
    }
    // A dropdown hands back its choice's OWN value: a Mark's `seen` is true / false, and the engine refuses "true".
    const picked = () => (words.choices ?? []).find(([v]) => String(v) === input.value)?.[0] ?? input.value;
    input.addEventListener('change', () => save(graphLib.setParam(g, n.id, key, numeric ? Number(input.value) : picked())));
    row.title = fixedHere ? `${words.help} Fixed in this version: the engine does not read an edit yet.` : words.help;
    row.append(Object.assign(document.createElement('span'), { className: 'k', textContent: live ? `${words.label} · live` : words.label }), input);
    if (key === 'deg' && n.kind === 'parallelCast') {
      row.dataset.tipTitle = live ? 'deg · live (noSupportSteepDeg)' : 'deg';
      row.dataset.tip = `Degrees from the FROM axis toward the TOWARD axis. 0 = off. R1 is 45 from back toward tissue: direction = normalize(back·cos θ − top·sin θ) - it leans to TISSUE, not toward the teeth.${live ? ' LIVE: this one runs today - it mirrors the benchwork rule noSupportSteepDeg, so press Apply in that panel to re-run. The engine reads only values strictly between 45 and 90 as on; benchwork refuses the rest.' : ''}`;
    }
    card.append(row);
  }
  return card;
}

/** The divider: drag (or arrow keys) to set the stage area's height; double-click to fit the content again. */
(function wireChainDivider() {
  const bar = document.getElementById('chain-divider');
  const root = document.documentElement;
  const KEY = 'review-chain-h';
  const headerH = () => document.querySelector('header')?.getBoundingClientRect().height ?? 40;
  // Both ends keep something usable: at least 120 px of stages, and at least 160 px of 3D view.
  const clamp = (h) => Math.round(Math.min(Math.max(h, 120), window.innerHeight - headerH() - 160));
  const set = (h) => {
    if (h === null) { root.style.removeProperty('--chain-h'); try { localStorage.removeItem(KEY); } catch { /* per-viewer only */ } return; }
    const px = clamp(h);
    root.style.setProperty('--chain-h', `${px}px`);
    try { localStorage.setItem(KEY, String(px)); } catch { /* per-viewer only */ }
  };
  let saved = null;
  try { saved = Number(localStorage.getItem(KEY)) || null; } catch { saved = null; }
  if (saved) set(saved);
  const current = () => document.getElementById('chain').getBoundingClientRect().height;
  bar.addEventListener('pointerdown', (e) => {
    bar.setPointerCapture(e.pointerId);
    bar.classList.add('dragging');
    const move = (ev) => set(window.innerHeight - ev.clientY);
    const up = () => { bar.classList.remove('dragging'); bar.removeEventListener('pointermove', move); bar.removeEventListener('pointerup', up); window.dispatchEvent(new Event('resize')); };
    bar.addEventListener('pointermove', move);
    bar.addEventListener('pointerup', up);
    e.preventDefault();
  });
  bar.addEventListener('dblclick', () => { set(null); window.dispatchEvent(new Event('resize')); });
  bar.addEventListener('keydown', (e) => {
    const step = e.shiftKey ? 80 : 24;
    if (e.key === 'ArrowUp') { set(current() + step); e.preventDefault(); }
    if (e.key === 'ArrowDown') { set(current() - step); e.preventDefault(); }
  });
  window.addEventListener('resize', () => { const v = root.style.getPropertyValue('--chain-h'); if (v) root.style.setProperty('--chain-h', `${clamp(parseFloat(v))}px`); });
})();
