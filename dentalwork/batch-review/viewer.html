// ---- Hover picking ----------------------------------------------------------------------------------
// The scene is picked with a THREE.Raycaster from the pointer. The first visible hit (a line hit wins over a surface it
// lies on) is described by describeHit(): the layer's plain name, key facts that are cheap to read from the picked
// geometry (ray length, tip reason, pillar height, face count) and the layer's explanation.
const raycaster = new THREE.Raycaster();
const ndc = new THREE.Vector2();
const worldPoint = (position, index, object) => new THREE.Vector3().fromBufferAttribute(position, index).applyMatrix4(object.matrixWorld);
const mm = (value) => `${value.toFixed(value < 10 ? 2 : 1)} mm`;
const visibleDeep = (object) => { for (let o = object; o; o = o.parent) if (!o.visible) return false; return true; };

// Connected parts of a welded mesh (union-find over the index), with each part's world-space height; built on first hover, cached on the object.
function partsOf(object) {
  if (object.userData.parts) return object.userData.parts;
  const geometry = object.geometry;
  const count = geometry.attributes.position.count;
  const parent = Int32Array.from({ length: count }, (_, i) => i);
  const find = (i) => { while (parent[i] !== i) { parent[i] = parent[parent[i]]; i = parent[i]; } return i; };
  const index = geometry.index.array;
  for (let i = 0; i < index.length; i += 3) { const a = find(index[i]); parent[find(index[i + 1])] = a; parent[find(index[i + 2])] = a; }
  const low = new Map(), high = new Map();
  object.updateMatrixWorld(true);
  for (let i = 0; i < count; i++) {
    const root = find(i), y = worldPoint(geometry.attributes.position, i, object).y;
    low.set(root, Math.min(low.get(root) ?? Infinity, y));
    high.set(root, Math.max(high.get(root) ?? -Infinity, y));
  }
  object.userData.parts = { find, height: (vertex) => high.get(find(vertex)) - low.get(find(vertex)), count: new Set(Array.from({ length: count }, (_, i) => find(i))).size };
  return object.userData.parts;
}

function describeHit(hit) {
  const object = hit.object;
  const key = keyOf(object.name) ?? keyOf(object.parent?.name);
  const entry = key && entryOf(key);
  if (!entry) return { title: plain(object.name || object.parent?.name) || 'Object' };
  const [, label, legend] = entry;
  const geometry = object.geometry;
  const facts = [];
  let title = label;
  if (/^R\d/.test(key)) {
    // Each arrow is 6 vertices (shaft + two head strokes; R1b 2 * dashes + 4, from the layer's extras): the first is its start, the shaft's last its end.
    const position = geometry.attributes.position;
    const per = object.userData.verticesPerArrow ?? 6, endAt = object.userData.shaftEndVertex ?? 1;
    const arrow = Math.floor(hit.index / per);
    const from = worldPoint(position, arrow * per, object), to = worldPoint(position, arrow * per + endAt, object);
    facts.push(`Length ${mm(from.distanceTo(to))}`, `Arrow ${arrow + 1} of ${position.count / per}`);
  } else if (key === 'Tips left out') {
    const tip = Math.floor(hit.faceIndex / (object.userData.trianglesPerItem ?? 24));
    const reasons = object.userData.reasons ?? [];
    const reason = reasons[tip];
    title = 'Tip left out';
    if (reason !== undefined) facts.push(`Reason: ${REASONS.find(([prefix]) => reason.startsWith(prefix))?.[1] ?? reason}`, `Code: ${reason}`);
    facts.push(`Tip ${tip + 1} of ${reasons.length || '?'}`);
  } else if (key.startsWith('Tips:')) {
    title = `Tip (${key.slice(6)})`;
    const per = object.userData.trianglesPerItem ?? 24, item = Math.floor(hit.faceIndex / per);
    const reason = (object.userData.reasons ?? [])[item];
    if (reason !== undefined) {
      // The cone's axis in world space (the print pose, +Y up): apex = the vertex repeated most, axis = vertex mean minus apex.
      const pos = geometry.attributes.position, pts = [];
      for (let i = item * per * 3; i < (item + 1) * per * 3 && i < pos.count; i++) pts.push(worldPoint(pos, i, object));
      const key = (v) => `${v.x.toFixed(4)},${v.y.toFixed(4)},${v.z.toFixed(4)}`, count = new Map();
      for (const v of pts) count.set(key(v), (count.get(key(v)) ?? 0) + 1);
      const apexKey = [...count.entries()].sort((a, b) => b[1] - a[1])[0]?.[0];
      const apex = pts.find((v) => key(v) === apexKey);
      if (apex) {
        const axis = pts.reduce((a, v) => a.add(v), new THREE.Vector3()).divideScalar(pts.length).sub(apex).normalize();
        facts.push(`Tip face slope ${THREE.MathUtils.radToDeg(Math.acos(Math.max(-1, Math.min(1, -axis.y)))).toFixed(1)}° slope from horizontal (print pose; 0 = flat ceiling, 90 = vertical wall)`);
      }
      facts.push(reason);
    }
    else facts.push(`Tip ${Math.floor(hit.faceIndex / 24) + 1} of ${geometry.index ? Math.round(geometry.index.count / 72) : '?'}`);
  } else if (key === 'Tips that cannot reach') {
    title = 'Tip that cannot reach the plate';
  } else if (['SUPPORT PILLARS', 'GOLD', 'YOUR SUPPORTS'].includes(key) && geometry.index) {
    const parts = partsOf(object);
    title = key === 'GOLD' ? 'Support (aligner)' : key === 'YOUR SUPPORTS' ? 'Your support (-sup)' : 'Support pillar';
    facts.push(`Height ${mm(parts.height(geometry.index.array[hit.faceIndex * 3]))}`, `${parts.count} parts in this layer`);
  } else if (['DENTURE', 'NEUTRAL', 'TEAL'].includes(key)) {
    facts.push(`${Math.round((geometry.index ? geometry.index.count : geometry.attributes.position.count) / 3).toLocaleString()} triangles`);
  } else if (!geometry.index && geometry.attributes.position.count % 3 === 0 && !object.isLine) {
    facts.push(`${Math.round(geometry.attributes.position.count / 3).toLocaleString()} faces in this layer`);
  }
  const shownName = ['Dental rim (continuous', 'Hole outlines'].includes(key) ? plain(object.name).replace('(continuous hard edge)', '') : '';
  return { title: shownName || title, facts, note: ruleText(legend) };
}

function pick(clientX, clientY) {
  if (!model) return;
  const rect = renderer.domElement.getBoundingClientRect();
  ndc.set(((clientX - rect.left) / rect.width) * 2 - 1, -((clientY - rect.top) / rect.height) * 2 + 1);
  raycaster.setFromCamera(ndc, camera);
  const threshold = Math.max(0.15, camera.position.distanceTo(controls.target) * 0.004);
  raycaster.params.Line.threshold = threshold;
  const hits = raycaster.intersectObject(model, true).filter((h) => (h.object.isMesh || h.object.isLine) && visibleDeep(h.object));
  const first = hits[0];
  if (!first) { hideTip(); return; }
  // A thin line lying on a surface would always lose to it: a line hit close behind the first hit wins.
  const line = first.object.isLine ? first : hits.find((h) => h.object.isLine && h.distance <= first.distance + threshold * 4);
  showTip(describeHit(line ?? first), clientX, clientY);
}

let pickTimer = 0;
const canvas = renderer.domElement;
canvas.addEventListener('pointermove', (event) => {
  if (event.buttons || event.pointerType === 'touch') { hideTip(); return; }
  const { clientX, clientY } = event;
  clearTimeout(pickTimer);
  pickTimer = setTimeout(() => pick(clientX, clientY), 50);
});
canvas.addEventListener('pointerleave', () => { clearTimeout(pickTimer); hideTip(); });
// Touch has no hover: a tap (no drag) shows the tooltip.
let tapAt = null;
canvas.addEventListener('pointerdown', (event) => { hideTip(); tapAt = event.pointerType === 'touch' ? [event.clientX, event.clientY] : null; });
canvas.addEventListener('pointerup', (event) => {
  if (tapAt && Math.hypot(event.clientX - tapAt[0], event.clientY - tapAt[1]) < 6) pick(event.clientX, event.clientY);
  tapAt = null;
});

// Plain words for the reason codes (reasons.json beside this page, first matching prefix wins), so
// runs made before summary.json carried `explanation` read the same.
const REASONS = await fetch('/reasons.json').then((r) => (r.ok ? r.json() : { reasons: [] })).then((j) => j.reasons ?? []).catch(() => []);
const explain = (c) => c.explanation || REASONS.find(([prefix]) => (c.reason ?? '').startsWith(prefix))?.[1] || c.reason || '';
// "case-003 · scan name" — the file name (no folder, no .stl) from summary.json's source path.
const fileName = (c) => (c.source ?? '').split(/[\\/]/).pop().replace(/\.stl$/i, '');
const caseLabel = (c) => (fileName(c) ? `${c.case} · ${fileName(c)}` : c.case);
const RESULT_WORDS = { inconclusive: 'Not built: the review could not decide', error: 'Not built: the file could not be read' };

const loader = new GLTFLoader();
let showing = 0;
async function show(row) {
  const ticket = ++showing;
  kindNow = row.kind === 'denture' ? 'denture' : 'aligner';
  caseNow = row;
  // Step-by-step belongs to denture cases only; an aligner always shows its checkboxes.
  if (kindNow !== 'denture') stepAt = null;
  if (model) { scene.remove(model); model.traverse((o) => { o.geometry?.dispose(); o.material?.dispose?.(); }); model = null; floorY = null; boxAnchor = null; }
  const url = row.glb ? urlOf(row.glb) : '';
  // The Step 1 evidence GLB (trim chains, U ends, plane, back arrow) loads into the same scene; a
  // case that was not built may still have one, so the owner sees what orientation detected.
  const evidenceUrl = row.orientationGlb ? urlOf(row.orientationGlb) : '';
  // No GLB (the case was not built): a card with the case, its result and the reason in plain words.
  const card = document.getElementById('nocase');
  card.hidden = Boolean(row.glb);
  if (!row.glb) {
    document.getElementById('nocase-name').textContent = caseLabel(row);
    document.getElementById('nocase-result').textContent = RESULT_WORDS[row.result] ?? `Result: ${row.result}`;
    document.getElementById('nocase-text').textContent = explain(row) || 'No reason was recorded.';
    document.getElementById('nocase-code').textContent = row.reason ? `Why it needs a look: ${row.reason}` : '';
  }
  document.getElementById('note').textContent = url || evidenceUrl ? 'Loading...'
    : row.glb ? `${row.glb} was not in what was dropped. Drop the whole batch-... folder.` : '';
  if (url || evidenceUrl) {
    const loaded = await Promise.all([url, evidenceUrl].filter(Boolean).map((at) => loader.loadAsync(at)));
    // A newer selection started while this one loaded: drop this result.
    if (ticket !== showing) return;
    model = new THREE.Group();
    for (const gltf of loaded) model.add(gltf.scene);
    model.traverse((object) => {
      // Markers draw over everything, so a crossing inside a support body still shows.
      if (object.isMesh && plain(object.parent?.name).startsWith('MARK') || plain(object.parent?.name).startsWith('ISLAND')) {
        object.material.depthTest = false;
        object.renderOrder = 10;
      }
      // Shade the surfaces so the shape reads; markers and tubes keep their flat colour.
      const key = object.isMesh && keyOf(object.name);
      if (key && SUPPORT_KEYS.includes(key)) {
        // Weld the duplicated corners first so the normals are smooth across each part, not faceted.
        const old = object.geometry;
        object.geometry = mergeVertices(old);
        old.dispose();
        object.geometry.computeVertexNormals();
        const tint = object.material.color.clone();
        const colours = new Float32Array(object.geometry.attributes.position.count * 3);
        for (let i = 0; i < colours.length; i += 3) tint.toArray(colours, i);
        object.geometry.setAttribute('color', new THREE.BufferAttribute(colours, 3));
        object.userData.colour = tint;
        object.material = PLASTIC;
      } else if (key && ['DENTURE', 'TEAL', 'NEUTRAL'].includes(key)) {
        if (!object.geometry.attributes.normal) object.geometry.computeVertexNormals();
        // ACES plus the new lights washed the model to white, so its colour is dimmed (0.6) and it takes a light room reflection: neutral, matte, shaded.
        object.material = new THREE.MeshStandardMaterial({ color: key === 'DENTURE' ? DENTURE_COLOUR : object.material.color.clone().multiplyScalar(0.6), roughness: 0.85, envMapIntensity: 0.25, side: THREE.DoubleSide });
      }
    });
    // ONE COLOUR PER PLANE, the same on its chip and in 3D (docs/ORIENT-NODES.md section 10): a plane takes its token
    // whatever colour its GLB was written with - the engine writes the trim plane, the host the others.
    model.traverse((object) => {
      const key = keyOf(object.name || '') ?? keyOf(object.parent?.name || '');
      if (!object.material || !PLANE_KEYS.includes(key)) return;
      object.material.vertexColors = false;
      object.material.color.set(cssToken(SWATCH_VAR[key]));
      object.material.needsUpdate = true;
    });
    scene.add(model);
    const supports = new THREE.Box3();
    model.traverse((object) => {
      const key = object.isMesh && keyOf(object.name);
      if (key && PILLAR_KEYS.includes(key)) supports.expandByObject(object);
    });
    // The ray origin's sphere: its world-space centre (the label's anchor).
    model.updateMatrixWorld(true);
    model.traverse((object) => {
      if (object.isMesh && keyOf(object.name) === 'Oral cavity ray') boxAnchor = new THREE.Box3().setFromObject(object).getCenter(new THREE.Vector3());
    });
    floorY = supports.isEmpty() ? null : supports.min.y;
    underside = false;
    // The open tab's 3D cut, also on load: it was set only by a tab CLICK, so a reload on 1 Orient showed every layer,
    // supports included, until a tab was pressed (Fable's review).
    if (kindNow === 'denture' && stepAt === null) stepAt = STAGES.find((s) => s.id === stageNow)?.cut ?? null;
    applyVisibility();
    look(VIEWS.fit());
    document.getElementById('note').textContent = '';
    // The zone overlay belongs to THIS model: the zone file can land before the GLB, and the overlay it built then was
    // hung on the previous case's model (Fable's review).
    if (zoneSelected) showZonePreview();
    // A new model stands as its run put it; the live turn (if the canvas still differs from that run) is re-applied.
    relabelSides();
  }
  drawLayers();
}

// A run comes from the server (/out/) or from files dropped on the page; urlOf maps a GLB name to where it loads from.
let cases = [];
let urlOf = (name) => `/out/${name}`;
let blobs = [];
let onlyLook = false;
let current = 0;

function openRun(summary, glbUrl, csvUrl) {
  cases = summary.cases;
  RULES = summary.ruleDefaults ?? {};
  // Which zone graph produced THIS run: "default", or the digest of the edited graph the node editor
  // sent. Without it an edited run and a default run look identical on screen.
  // A folder that does not record it (older than engine 69, or a writer that dropped it) is UNKNOWN,
  // not "default": the same label on a good day and a bad day is no label at all (cia F7).
  ranZoneGraph = summary.zoneGraph ?? 'unknown';
  // "default", not "unknown" as for the zone graph: every folder written before the Orient graph existed (U5) ran the
  // standard Step 1, so its missing key is a fact, not a gap.
  ranOrientGraph = summary.orientGraph ?? 'default';
  ranZoneGraphJson = summary.zoneGraphRan ?? null;
  ranOrientGraphJson = summary.orientGraphRan ?? null;
  ranPlacement = summary.placementRan ?? null;
  urlOf = glbUrl;
  const needing = cases.filter((c) => c.needsLook);
  const built = cases.filter((c) => c.result === 'built').length;
  const made = summary.created ? `, made ${new Date(summary.created).toLocaleString()}` : '';
  document.getElementById('totals').textContent = `${built} built, ${needing.length} need a look (${cases.length} file(s))${made}`;
  const csv = document.getElementById('csv');
  csv.hidden = !csvUrl;
  if (csvUrl) csv.href = csvUrl;
  // Open on All with the first BUILT case shown in 3D: starting on "Needs a look" showed only the
  // unbuilt cases (no model), which read as an empty review.
  onlyLook = false;
  select(Math.max(0, cases.findIndex((c) => c.result === 'built')));
}

function empty(message) {
  document.getElementById('nocase').hidden = true;
  document.getElementById('totals').textContent = '';
  document.getElementById('csv').hidden = true;
  document.getElementById('note').textContent = message;
}

// Dropped or chosen files: a batch-... folder (summary.json + case GLBs), or GLB files alone.
// When several runs are in the drop, the newest summary.json wins and only GLBs beside it are used.
async function openFiles(entries) {
  blobs.forEach((url) => URL.revokeObjectURL(url));
  blobs = [];
  const dirOf = (path) => path.slice(0, path.lastIndexOf('/') + 1);
  const nameOf = (path) => path.slice(path.lastIndexOf('/') + 1);
  const blob = (file) => { const url = URL.createObjectURL(file); blobs.push(url); return url; };
  let run = null;
  for (const { path, file } of entries.filter(({ path }) => nameOf(path) === 'summary.json')) {
    try {
      const summary = JSON.parse(await file.text());
      if (Array.isArray(summary.cases) && (!run || (summary.created ?? '') > (run.summary.created ?? ''))) run = { summary, dir: dirOf(path) };
    } catch { /* not a review summary */ }
  }
  const glbs = entries.filter(({ path }) => /\.glb$/i.test(path) && (!run || dirOf(path) === run.dir));
  if (!run && glbs.length === 0) { empty('No summary.json or .glb file in what was dropped. Drop a batch-... folder from dentalwork/output.'); return; }
  const byName = new Map(glbs.map(({ path, file }) => [nameOf(path), file]));
  const summary = run?.summary ?? {
    cases: glbs.map(({ path }) => ({ case: nameOf(path).replace(/\.glb$/i, ''), source: path, result: 'built', glb: nameOf(path), needsLook: false })),
  };
  const missing = summary.cases.filter((c) => c.glb && !byName.has(c.glb));

async function readEntry(entry) {
  if (entry.isFile) return [{ path: entry.fullPath, file: await new Promise((ok, fail) => entry.file(ok, fail)) }];
  const reader = entry.createReader();
  const children = [];
  for (let batch; (batch = await new Promise((ok, fail) => reader.readEntries(ok, fail))).length;) children.push(...batch);
  return (await Promise.all(children.map(readEntry))).flat();
}

  );

/*
 * THE ZONES TAB'S CASE FILE (plan D2, written by reviewCase.ts): every zone-graph node's value per face, for the
 * per-node preview. Loaded per case; the overlay is rebuilt for the node still selected.
 */
async function loadZonesFile(c) {
  zonesRead = null;
  // A live preview belongs to one case's scan: a new case (or a run's result) drops it and asks again if still edited.
  livePreview = null;
  livePending = false;
  if (c.kind === 'denture' && c.zonesFile) {
    const meta = await fetch(urlOf(c.zonesFile)).then((r) => (r.ok ? r.json() : null)).catch(() => null);
    const bin = meta ? await fetch(urlOf(meta.bin)).then((r) => (r.ok ? r.arrayBuffer() : null)).catch(() => null) : null;
    if (caseNow !== c && caseNow?.case !== c.case) return;
    if (meta && bin && bin.byteLength === meta.ids.length * meta.faces) zonesRead = { ids: meta.ids, faces: meta.faces, values: new Uint8Array(bin) };
  }
  scheduleZonePreview();
}

/** The overlay for the selected node, or none: the zone layers come back when nothing is selected or off the Zones tab. */
/**
 * After a Zones edit, ask the server for a live preview of the canvas (plan D3) - debounced, so a burst of edits asks
 * once. Only for a served denture review, only for a graph that differs from the run and validates; an answer for an
 * older canvas, or another case, is dropped.
 */
async function scheduleZonePreview() {
  clearTimeout(livePreviewTimer);
  previewLib ??= await import('./zonePreview.mjs');
  if (!reviewServed || kindNow !== 'denture' || !caseNow?.source || !graphLib) { showZonePreview(); return; }
  const ran = ranZoneGraphJson ? graphLib.upgradeGraph(ranZoneGraphJson) : graphLib.defaultGraph();
  if (previewLib.sameGraph(ran, zoneGraph) || graphLib.validate(zoneGraph).problems.length > 0) { livePending = false; showZonePreview(); return; }
  livePending = true;
  showZonePreview();
  livePreviewTimer = setTimeout(async () => {
    const seq = ++livePreviewSeq;
    const graph = zoneGraph;
    const c = caseNow;
    const fail = (why) => { if (seq !== livePreviewSeq) return; livePending = false; zonePreviewNote.hidden = false; zonePreviewNote.textContent = `The live preview did not run: ${why}. Apply and run to see the edit.`; };
    try {
      const reply = await fetch('/zone-preview', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ source: c.source, zoneGraph: graph }) });
      const answer = await reply.json().catch(() => ({}));
      if (seq !== livePreviewSeq || caseNow !== c) return;
      if (!reply.ok || !answer.ok) { if (reply.status !== 409) fail(refusalReason(answer.log) ?? answer.error ?? reply.status); return; }
      const bin = await fetch(answer.bin).then((r) => (r.ok ? r.arrayBuffer() : null)).catch(() => null);
      if (seq !== livePreviewSeq || caseNow !== c) return;
      if (!bin || bin.byteLength !== answer.ids.length * answer.faces) { fail('its values did not arrive whole'); return; }
      livePending = false;
      livePreview = { graph, read: { ids: answer.ids, faces: answer.faces, values: new Uint8Array(bin) }, seconds: answer.seconds };
      showZonePreview();
    } catch (error) {
      fail(error.message);
    }
  }, 800);
}

/*
 * THE TABS 4 AND 5 LIVE PREVIEW (plan D3, serve.mjs POST /tilt-preview, tiltPreviewRun.ts, words in tiltPreview.mjs).
 * A setting changed on tab 4 or a search number on tab 5 (or the strip widths, or a canvas) asks the engine for the
 * print-angle search with the page's settings and the tips at the angle it picks - no build, about 7 s. Tab 4 draws
 * those tips on the model, coloured by their path to the plate, with the run's own tips and pillars hidden; tab 5 shows
 * the pick and every angle tried. Only while the page differs from what the run on screen used (`ranTiltKey`, reset by
 * Apply): a preview of what already ran would hide the built supports for nothing.
 */
/** What a preview is asked with - the same edits Apply sends - and its key; the key alone when nothing is edited. */
function tiltAsk() {
  const rules = benchRulesNow();
  const pose = kindNow === 'denture' ? poseEdits : {};
  const placement = kindNow === 'denture' ? placementEdits : {};
  const zone = graphLib && zoneGraph && !graphLib.isDefault(zoneGraph) ? zoneGraph : null;
  const orient = kindNow === 'denture' && orientLib && orientGraph && !orientLib.isDefault(orientGraph) ? orientGraph : null;
  const key = JSON.stringify({ rules, pose, placement, zone, orient });
  return { key, ask: { rules, pose, placement, zoneGraph: zone, orientGraph: orient } };
}

/** Ask for a preview of the page's settings, debounced; drop it when the page matches the run or cannot preview. */
async function scheduleTiltPreview() {
  clearTimeout(tiltTimer);
  tiltLib ??= await import('./tiltPreview.mjs');
  const { key, ask } = tiltAsk();
  ranTiltKey ??= JSON.stringify({ rules: {}, pose: {}, placement: {}, zone: null, orient: null });
  const wanted = reviewServed && kindNow === 'denture' && caseNow?.source && (stageNow === 'support' || stageNow === 'angle') && key !== ranTiltKey;
  // The search cannot run on numbers tab 5 already refuses; its own note says why.
  if (!wanted || searchProblem(searchNow())) {
    tiltPending = false;
    if (key === ranTiltKey) { tiltLive = null; tiltError = null; }
    showTiltPreview();
    return;
  }
  if (tiltLive?.key === key && tiltLive.case === caseNow) { showTiltPreview(); return; }
  tiltPending = true;
  showTiltPreview();
  tiltTimer = setTimeout(async () => {
    const seq = ++tiltSeq;
    const c = caseNow;
    try {
      const reply = await fetch('/tilt-preview', { method: 'POST', headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ source: c.source, ...ask, frame: orientRead?.frame ?? null }) });
      const answer = await reply.json().catch(() => ({}));
      if (seq !== tiltSeq || caseNow !== c) return;
      if (reply.status === 409) return;
      tiltPending = false;
      if (!reply.ok || !answer.ok) { tiltError = answer.error ?? `answer ${reply.status}`; tiltLive = null; }
      else { tiltError = null; tiltLive = { key, case: c, result: answer }; }
    } catch (error) {
      if (seq !== tiltSeq) return;
      tiltPending = false;
      tiltError = error.message;
    }
    showTiltPreview();
  }, 800);
}

/** The preview, if it is of the page as it is now and of this case. A declaration, so searchCard may call it early. */
function tiltNow() {
  return tiltLive && tiltLive.case === caseNow && tiltLive.key === tiltAsk().key ? tiltLive.result : null;
}

/** Draws the preview's tips (tab 4) and writes the note (tabs 4 and 5); the search card reads `tiltNow()` itself. */
function showTiltPreview() {
  if (tiltOverlay) { tiltOverlay.parent?.remove(tiltOverlay); tiltOverlay.traverse((o) => { o.geometry?.dispose(); o.material?.dispose?.(); }); tiltOverlay = null; }
  const onTab = kindNow === 'denture' && (stageNow === 'support' || stageNow === 'angle');
  const result = tiltNow();
  tiltPreviewNote.hidden = !onTab || !(result || tiltPending || tiltError);
  if (!tiltPreviewNote.hidden && tiltLib) {
    tiltPreviewNote.textContent = tiltError && !tiltPending
      ? `The live preview did not run: ${tiltError}. Apply and run to see the settings.`
      : `${tiltLib.tiltPreviewNote(result, { tab: stageNow, ranDeg: caseNow?.printAngleDeg ?? null, pending: tiltPending })}${result ? ` (${result.seconds} s)` : ''}`;
  }
  if (stageNow === 'angle' && lastChain && !tiltRedrawing) { tiltRedrawing = true; drawChain(...lastChain); tiltRedrawing = false; }
  if (onTab && stageNow === 'support' && result?.kind === 'scan' && result.tips && model && tiltLib) {
    tiltOverlay = new THREE.Group();
    tiltOverlay.name = 'tilt-preview-tips';
    const ball = new THREE.SphereGeometry(0.45, 10, 8);
    for (const [state, { token }] of Object.entries(tiltLib.TIP_STATES)) {
      const tips = result.tips.filter((t) => (state === 'unknown' ? !(t.state in tiltLib.TIP_STATES) || t.state === 'unknown' : t.state === state));
      if (tips.length === 0) continue;
      const mesh = new THREE.InstancedMesh(ball, new THREE.MeshBasicMaterial({ color: cssToken(token) }), tips.length);
      const at = new THREE.Matrix4();
      tips.forEach((t, k) => mesh.setMatrixAt(k, at.makeTranslation(t.position[0], t.position[1], t.position[2])));
      tiltOverlay.add(mesh);
    }
    // In the GLB's own space, like the side labels: the model's matrix carries the tips with it.
    model.add(tiltOverlay);
  }
  applyVisibility();
}

let previewTicket = 0;
async function showZonePreview() {
  // A ticket, as show() uses: two calls racing across the first import (or a case change) must not both build an
  // overlay, or one is orphaned on the model (Fable's review).
  const ticket = ++previewTicket;
  if (zoneOverlay) { zoneOverlay.parent?.remove(zoneOverlay); zoneOverlay.traverse((o) => { o.geometry?.dispose(); o.material?.dispose?.(); }); zoneOverlay = null; }
  previewLib ??= await import('./zonePreview.mjs');

  const ran = graphLib ? (ranZoneGraphJson ? graphLib.upgradeGraph(ranZoneGraphJson) : graphLib.defaultGraph()) : null;
  const canvasChanged = Boolean(graphLib && !previewLib.sameGraph(ran, zoneGraph));
  // THE LIVE PREVIEW (plan D3): when the canvas differs from the run and a preview of THIS canvas has come back, the
  // values are the preview's; and with nothing selected the final Zone is shown, so an edit shows its effect at once.
  const live = canvasChanged && livePreview && previewLib.sameGraph(livePreview.graph, zoneGraph) ? livePreview : null;
  const read = live ? live.read : zonesRead;
  const shownId = zoneSelected ?? (live ? zoneGraph.outputs?.zone : null);
  const active = shownId && stageNow === 'zones' && kindNow === 'denture' && graphLib;
  zonePreviewNote.hidden = !active && !(canvasChanged && livePending && stageNow === 'zones');
  if (!active) {
    if (!zonePreviewNote.hidden) zonePreviewNote.textContent = 'Previewing your edit on the model (zones only, nothing is built)…';
    applyVisibility();
    return;
  }
  const node = zoneGraph?.nodes.find((n) => n.id === shownId);
  const title = node ? (graphLib.KIND_WORDS[node.kind]?.title ?? node.kind) : shownId;
  const gives = graphLib.KINDS[node?.kind]?.out;
  const values = previewLib.nodeValues(read, shownId);
  const groups = values && (gives === 'mask' || gives === 'zone') ? previewLib.previewGroups(values, gives === 'zone') : null;
  // The model: the GLB's denture mesh, written with the engine's own face order (reviewCase.ts), so face k is face k.
  let base = null;
  model?.traverse((o) => { if (!base && o.isMesh && keyOf(o.name) === 'DENTURE') base = o; });
  const index = base?.geometry.index;
  const drawn = Boolean(groups && index && index.count / 3 === read.faces);
  const note = previewLib.previewNote({ title, groups, hasRead: Boolean(read), canvasChanged: canvasChanged && !live, gives, drawn, final: !zoneSelected });
  zonePreviewNote.textContent = live
    ? `Live preview of your edit (zones only - nothing is built until Apply; the standard profile's strip widths; ${live.seconds} s). ${note}`
    : canvasChanged && livePending ? `${note} Previewing your edit…` : note;
  if (!drawn) { applyVisibility(); return; }
  zoneOverlay = new THREE.Group();
  for (const group of groups) {
    if (group.faces.length === 0) continue;
    const ix = new Uint32Array(group.faces.length * 3);
    group.faces.forEach((f, k) => { ix[k * 3] = index.getX(f * 3); ix[k * 3 + 1] = index.getX(f * 3 + 1); ix[k * 3 + 2] = index.getX(f * 3 + 2); });
    const geometry = new THREE.BufferGeometry();
    geometry.setAttribute('position', base.geometry.getAttribute('position'));
    geometry.setIndex(new THREE.BufferAttribute(ix, 1));
    // Drawn just in front of the model (polygon offset), so the tint sits on the surface it describes.
    const material = new THREE.MeshBasicMaterial({ color: cssToken(group.token), side: THREE.DoubleSide, polygonOffset: true, polygonOffsetFactor: -2, polygonOffsetUnits: -2 });
    zoneOverlay.add(new THREE.Mesh(geometry, material));
  }
  base.add(zoneOverlay);
  applyVisibility();
}

/*
 * THE ORIENT TAB'S CASE FILE (WORKBENCH-TABS-PLAN B3, written by reviewCase.ts): each Orient node's readout lines
 * ("how sure was it") and the six named sides of the FINAL orientation. The side names are drawn on the 3D view on
 * every tab - Front, Back, Teeth side, Tissue side, Left, Right - so every later tab can refer to them. Positions are in
 * the review file's own space; the model's world matrix carries them wherever the view puts the model.
 */
async function loadOrientFile(c) {
  const data = c.kind === 'denture' && c.orientFile ? await fetch(urlOf(c.orientFile)).then((r) => (r.ok ? r.json() : null)).catch(() => null) : null;
  if (caseNow !== c && caseNow?.case !== c.case) return;
  orientRead = data;
  for (const label of sideLabels) label.el.remove();
  sideLabels = (data?.sides ?? []).map((side) => {
    const el = Object.assign(document.createElement('div'), { className: 'marker-label side-label', textContent: side.name });
    el.dataset.ui = `side-label-${side.name.toLowerCase().replace(/\s+/g, '-')}`;
    el.title = side.name === 'Left' || side.name === 'Right' ? `${side.name}: as seen from the Front with the Teeth side up` : `${side.name} side of the part, in its final orientation`;
    boxLabel.parentElement.append(el);
    return { el, at: new THREE.Vector3(...side.position), name: side.name };
  });
  relabelSides();
  if (lastChain && stageNow === 'orient') drawChain(...lastChain);
  // The tips preview needs this file's frame (where the GLB puts the scan), and belongs to one case: ask again.
  tiltLive = null;
  scheduleTiltPreview();
}

/*
 * THE LIVE SIDE NAMES (sidePreview.mjs; owner 2026-11-23: choosing a side "is clueless to human not seeing"). The labels
 * stay where the run put the sides; their TEXT follows the Orient canvas at once - a flip renames, Plate side marks
 * the side on the plate and the side that rises. The part itself turns only after Apply, and the note says so.
 */
function relabelSides() {
  const ran = sidePreviewLib?.sideChoices(ranOrientGraphJson ?? orientLib?.defaultGraph());
  const now = sidePreviewLib?.sideChoices(orientGraph);
  for (const label of sideLabels) {
    label.el.textContent = sidePreviewLib ? sidePreviewLib.previewLabel(label.name, ran, now) : label.name;
  }
  const changed = Boolean(sidePreviewLib?.choicesChanged(ran, now));
  // THE LIVE TURN (sidePreview.mjs turnFor): the part turns at once to stand on the chosen plate side, from the axes the
  // run's own labels give. Its supports belong to the run's pose, so they hide while it is turned; the run that follows
  // (Orient edits run on their own) builds them for the new pose and puts the model back square.
  orientTurn = changed ? sidePreviewLib?.turnFor(orientRead?.sides, ran, now) ?? null : null;
  turnModel();
  orientSideNote.hidden = !changed || sideLabels.length === 0;
  orientSideNote.textContent = orientTurn
    ? 'Preview: the part is turned to stand on the side you chose, and the side names follow. Its supports are hidden until the run builds them for this pose. The lean angle is the print-angle search\'s, so it shows after the run.'
    : 'The side names in 3D already follow your choices. The part itself turns only after Apply and run.';
}

/** Puts the model in the live-turn pose (`orientTurn`), or back square; the side labels ride on the model's matrix. */
function turnModel() {
  if (!model) return;
  const m = orientTurn?.rotation;
  const q = m ? new THREE.Quaternion().setFromRotationMatrix(new THREE.Matrix4().set(m[0], m[1], m[2], 0, m[3], m[4], m[5], 0, m[6], m[7], m[8], 0, 0, 0, 0, 1)) : new THREE.Quaternion();
  const centre = new THREE.Vector3(...(orientTurn?.centre ?? [0, 0, 0]));
  model.quaternion.copy(q);
  // Turn about the part's centre: p' = q (p - c) + c, so the model's position is c - q c.
  model.position.copy(centre.clone().sub(centre.clone().applyQuaternion(q)));
  model.updateMatrixWorld(true);
  applyVisibility();
}
function placeSideLabels() {
  for (const { el, at } of sideLabels) {
    if (!model) { el.style.display = 'none'; continue; }
    const p = at.clone().applyMatrix4(model.matrixWorld).project(camera);
    el.style.display = p.z > 1 ? 'none' : '';
    el.style.left = `${(p.x * 0.5 + 0.5) * stage.clientWidth}px`;
    el.style.top = `${(-p.y * 0.5 + 0.5) * stage.clientHeight}px`;
  }
}

// The peel chart: layer area of our print (red) and the owner's (ink) by height, from the case's -peel.json.
async function drawPeel(c) {
  const box = document.getElementById('peel');
  const holder = document.getElementById('peel-chart');
  const data = c.kind === 'denture' && c.peelFile ? await fetch(urlOf(c.peelFile)).then((r) => (r.ok ? r.json() : null)).catch(() => null) : null;
  if (caseNow !== c && caseNow?.case !== c.case) return;
  box.hidden = !data;
  holder.replaceChildren();
  if (!data) return;
  const W = 300, H = 120, L = 30, B = 16, T = 4, R = 4;
  const { heightMm: xs, ours, owner } = data.chart;
  const xmax = Math.max(...xs, 1e-6), ymax = Math.max(...ours, ...(owner ?? []), 1e-6);
  const px = (x) => L + (x / xmax) * (W - L - R), py = (y) => H - B - (y / ymax) * (H - B - T);
  const line = (ys, cls) => `<polyline class="${cls}" fill="none" stroke-width="1.5" points="${xs.map((x, k) => `${px(x).toFixed(1)},${py(ys[k]).toFixed(1)}`).join(' ')}"/>`;
  holder.innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Layer area by height" data-ui="review-peel-svg">
    <line x1="${L}" y1="${H - B}" x2="${W - R}" y2="${H - B}" stroke="currentColor" opacity=".4"/><line x1="${L}" y1="${T}" x2="${L}" y2="${H - B}" stroke="currentColor" opacity=".4"/>
    <text x="${L - 3}" y="${T + 8}" text-anchor="end" font-size="9" fill="currentColor">${ymax.toFixed(0)}</text><text x="${L - 3}" y="${H - B}" text-anchor="end" font-size="9" fill="currentColor">0</text>
    <text x="${W - R}" y="${H - 3}" text-anchor="end" font-size="9" fill="currentColor">${xmax.toFixed(0)} mm</text>
    ${owner ? line(owner, 'peel-line-owner').replace('<polyline', '<polyline stroke="var(--ink)" data-ui="review-peel-line-owner"') : ''}
    ${line(ours, 'peel-line-ours').replace('<polyline', '<polyline stroke="var(--danger)" data-ui="review-peel-line-ours"')}</svg>`;
}

function drawList() {
  const list = shown();
  document.getElementById('cases').replaceChildren(...list.map((c, k) => {
    const li = document.createElement('li');
    li.className = `${c.needsLook ? 'look' : ''} ${k === current ? 'selected current' : ''}`;
    const badge = document.createElement('span'); badge.className = 'badge'; badge.textContent = c.needsLook ? '!' : '✓';
    // Case id plus the scan's file name, so a row is recognisable without opening it.
    const name = document.createElement('span'); name.textContent = caseLabel(c); name.title = c.source ?? '';
    // A case that was not built says why, in plain words (full text on hover); a built one says its safety verdict.
    const small = document.createElement('small');
    small.textContent = c.result !== 'built' ? `Not built: ${explain(c)}` : status(c);
    if (c.result !== 'built') { small.title = explain(c); small.className = 'why'; }
    const kindLabel = document.createElement('small'); kindLabel.className = 'kind'; kindLabel.textContent = c.kind || 'aligner';
    li.append(badge, name, kindLabel, small);
    li.addEventListener('click', () => select(k));
    return li;
  }));
  document.getElementById('show-look').setAttribute('aria-pressed', String(onlyLook));
  document.getElementById('show-all').setAttribute('aria-pressed', String(!onlyLook));
}

function select(k) {
  const list = shown();
  if (list.length === 0) { drawList(); document.getElementById('position').textContent = ''; document.getElementById('nocase').hidden = true; return; }
  current = Math.max(0, Math.min(list.length - 1, k));
  drawList();
  document.getElementById('position').textContent = `${current + 1} / ${list.length}`;
  facts(list[current]);
  show(list[current]);
}
document.getElementById('show-look').addEventListener('click', () => { onlyLook = true; select(0); });
document.getElementById('show-all').addEventListener('click', () => { onlyLook = false; select(0); });
document.getElementById('prev').addEventListener('click', () => select(current - 1));
document.getElementById('next').addEventListener('click', () => select(current + 1));
addEventListener('keydown', (event) => {
  if (event.key === 'ArrowDown' || event.key === 'PageDown') select(current + 1);
  if (event.key === 'ArrowUp' || event.key === 'PageUp') select(current - 1);
});
const served = await fetch('/out/summary.json').then((r) => (r.ok ? r.json() : null)).catch(() => null);
reviewServed = Boolean(served);
if (served) openRun(served, (name) => `/out/${name}`, '/out/summary.csv');
else empty('Drop a batch-... folder from dentalwork/output here, or its summary.json with the case GLBs. Open folder and Open files do the same.');

/*
 * BENCHWORK PANEL. The rule list comes from the SAME module the CLI uses (`benchwork/rules.mjs`,
 * served at /benchwork/), so the panel cannot offer a name the tool would refuse or miss one it
 * gained. A second copy of thirteen names in this file is exactly the drift this avoids.
 *
 * It needs the server's POST /rerun, so it stays hidden when the page was opened from a dropped
 * folder with no server behind it - an Apply button that cannot apply is worse than none.
 */
try {
  const { BENCH_RULES } = await import('/benchwork/rules.mjs');
  const box = document.getElementById('bench-rules');
  const status = document.getElementById('bench-status');
  const fields = new Map();
  benchFields = fields;
  for (const rule of BENCH_RULES) {
    const row = document.createElement('label');
    row.className = 'bench-row';
    row.dataset.ui = `bench-rule-${rule.name}`;
    row.dataset.tipTitle = rule.name;
    row.dataset.tip = rule.says;
    const input = document.createElement('input');
    if (rule.type === 'flag') input.type = 'checkbox';
    else { input.type = 'number'; input.step = 'any'; input.placeholder = 'engine default'; }
    if (rule.type === 'deg') { input.min = '0'; input.max = '90'; }
    if (rule.type !== 'flag') input.min ??= '0';
    input.dataset.ui = `bench-input-${rule.name}`;
    fields.set(rule.name, { input, rule });
    // A graph restored from the last visit carries its own R1b angle; mirror it now, or Apply would send
    // the graph's angle to the zones and an empty rule to the policy and report (cia F4).
    const steep = rule.name === 'noSupportSteepDeg' ? zoneGraph?.nodes?.find((n) => n.id === 'R1b')?.params.deg : undefined;
    if (Number(steep) > 0) input.value = String(steep);
    const name = document.createElement('span');
    name.className = 'bench-name';
    name.textContent = rule.name;
    const unit = document.createElement('span');
    unit.className = 'muted bench-unit';
    unit.textContent = rule.type === 'flag' ? '' : rule.type;
    // Restore = empty, which means "the engine's own value" - shown only while a value is set.
    const back = restoreMark('the engine default', () => {
      if (rule.type === 'flag') input.checked = false; else input.value = '';
      input.dispatchEvent(new Event('change', { bubbles: true }));
      sync();
    });
    const sync = () => { back.hidden = rule.type === 'flag' ? !input.checked : input.value === ''; };
    input.addEventListener('input', sync);
    input.addEventListener('change', sync);
    sync();
    row.append(input, name, unit, back);
    box.append(row);
  }

  /** Only the fields the operator actually set: an untouched number means "leave the engine's default". */
  const turned = () => {
    const rules = {};
    for (const [name, { input, rule }] of fields) {
      if (rule.type === 'flag') { if (input.checked) rules[name] = true; continue; }
      if (input.value.trim() !== '' && Number.isFinite(Number(input.value))) rules[name] = Number(input.value);
    }
    return rules;
  };
  // The tabs 4 and 5 live preview reads the same rules Apply sends, and asks again after each one changes (plan D3).
  benchRulesNow = turned;
  box.addEventListener('change', () => scheduleTiltPreview());

  // Discard my changes: every edit on the page, in every stage - the settings, the Orient search and the
  // zone setup - back to standard. The review on screen is not touched; it is in its own folder.
  document.getElementById('bench-reset').addEventListener('click', () => {
    for (const { input, rule } of fields.values()) { if (rule.type === 'flag') input.checked = false; else input.value = ''; }
    poseEdits = {};
    placementEdits = {};
    try { localStorage.removeItem('review-pose'); localStorage.removeItem('review-placement'); localStorage.removeItem('review-zone-layout-2'); } catch { /* per-viewer only */ }
    if (graphLib) {
      zoneGraph = graphLib.defaultGraph();
      try { localStorage.setItem('review-zone-graph', JSON.stringify(zoneGraph)); } catch { /* per-viewer only */ }
      zonePositions = editorLib ? editorLib.autoLayout(zoneGraph, graphLib.FIXED.outputs) : null;
    }
    if (lastChain) drawChain(...lastChain);
    scheduleTiltPreview();
    status.textContent = 'Changes discarded: the search, the zone setup and the settings are the standard ones again.';
  });

  // Save type: only what RAN is saved (the server copies the run's type.json), never unrun edits.
  document.getElementById('type-save').addEventListener('click', async () => {
    const save = async (replace) => {
      const reply = await fetch(replace ? '/save-type?replace=1' : '/save-type', { method: 'POST' }).catch(() => null);
      return reply ? await reply.json().catch(() => ({})) : { error: 'the server did not answer' };
    };
    let answer = await save(false);
    // Another type is already saved at that path: replacing it is the operator's call, asked here, never silent.
    if (answer.exists) {
      // "a saved type", not "a different type": a re-save of the same type differs too (the proof record's time). And it
      // says what replacing does to projects - they store only the id, so they reopen with the new numbers (A2 unbuilt).
      if (!window.confirm(`${answer.path} already holds a saved type. Replace it with the one this review ran? Projects that use it will open with the new numbers.`)) {
        status.textContent = `Not saved: ${answer.path} was kept. Give the new type another name to keep both.`;
        return;
      }
      answer = await save(true);
    }
    // The server's verdict first (it survives a page reload), else the one this page fetched after Apply.
    const load = answer.typeLoad ?? ranTypeLoad;
    const refusedByApp = answer.ok && load && !load.loads;
    status.textContent = !answer.ok ? `Not saved: ${answer.error ?? 'no answer'}`
      : refusedByApp ? `Saved ${answer.path}, but the app will not load it yet: ${load.reason}`
      : `Saved ${answer.path} - commit it to ship it. It holds what this review ran, with its proof.`;
    // The strip marks Save done only for the type that ran (`ranTypeId`) - that is what the server copied.
    if (answer.ok) { savedTypeId = ranTypeId; if (lastChain) drawChain(...lastChain); }
  });
  const run = document.getElementById('bench-run');
  const applyNow = async ({ auto = false } = {}) => {
    // A run is going: an Orient edit waits for it (the finally below), a second press does nothing.
    if (run.disabled) { autoRunWaiting ||= auto; return; }
    // An edit undone before its run started: the review on screen already is that graph.
    if (auto && orientLib && ranThis(orientLib, orientGraph, ranOrientGraphJson)) return;
    const row = caseNow;
    if (!row?.source) { status.textContent = 'Open a case first: the re-run needs the STL it came from.'; return; }
    const rules = turned();
    // An edited zone graph is a reason to run on its own: refusing until a RULE was turned made the
    // node editor's own Apply do nothing for a graph-only edit - found by pressing it.
    const graphEdited = Boolean(graphLib && zoneGraph && !graphLib.isDefault(zoneGraph));
    // The Orient canvas (U6): a denture's only, like the search - an aligner reads no Orient graph in this version.
    const orientEdited = Boolean(kindNow === 'denture' && orientLib && orientGraph && !orientLib.isDefault(orientGraph));
    // Back to the standard Step 1 after an edited run is a change too: refusing it as "nothing changed" left the edited
    // run on screen with no way back but a reload, and an auto-run of a choice set back to "auto" never ran.
    const orientBack = Boolean(kindNow === 'denture' && orientLib && !orientEdited && !ranThis(orientLib, orientGraph, ranOrientGraphJson));
    // The search edits are a DENTURE type's (the strip says an aligner type keeps the built-in aligner's numbers), and
    // they persist in localStorage - so a denture session's leftovers rode along with an aligner draft (Fable, 2026-11-23).
    const poseNow = kindNow === 'denture' ? poseEdits : {};
    const poseEdited = Object.keys(poseNow).length > 0;
    // The Rim tab's strip widths, a denture type's like the search.
    const placementNow = kindNow === 'denture' ? placementEdits : {};
    const placementEdited = Object.keys(placementNow).length > 0;
    // A newly named type is a reason to run on its own: it is how a type that keeps the built-in's numbers but has
    // its own name and badge gets made (the New-type strip).
    const newType = typeName !== '' && ranTypeId !== typeName;
    if (Object.keys(rules).length === 0 && !graphEdited && !orientEdited && !orientBack && !poseEdited && !placementEdited && !newType) { status.textContent = 'Nothing is changed yet. Name a new type, or edit the Orient graph (1 Orient), the rim (2 Rim), the zone graph (3 Zones), a setting (4) or the search (5 Print angle), then apply.'; return; }
    // Only a denture run carries the search (poseNow above): a denture session's bad leftovers refused an aligner run
    // with "Fix the search first", a tab the aligner strip does not link to (Fable, 2026-11-23).
    const poseProblem = kindNow === 'denture' ? searchProblem(searchNow()) : null;
    if (poseProblem) { status.textContent = `Fix the search first (5 Print angle): ${poseProblem}.`; return; }
    const widthProblem = Object.entries(placementNow).map(([key, value]) => graphLib?.widthProblem(key, value)).find(Boolean);
    if (widthProblem) { status.textContent = `Fix the rim first (2 Rim): ${widthProblem}.`; return; }
    if (!/^[a-z0-9][a-z0-9.-]*$/.test(typeName)) { status.textContent = 'The type id (the Type strip above the stages) is lower-case letters, digits, dots and dashes.'; return; }
    const graphProblems = graphEdited ? graphLib.validate(zoneGraph).problems : [];
    if (graphProblems.length) { status.textContent = `Fix the zone graph first (3 Zones): ${graphProblems[0]}`; return; }
    const orientProblems = orientEdited ? orientLib.validate(orientGraph).problems : [];
    if (orientProblems.length) { status.textContent = `Fix the Orient graph first (1 Orient): ${orientProblems[0]}`; return; }
    run.disabled = true;
    const sentTiltKey = tiltAsk().key;
    const names = [...Object.entries(rules).map(([name, value]) => `${name}=${value}`), ...(graphEdited ? ['the edited zone graph'] : []), ...(orientEdited ? ['the edited Orient graph'] : []), ...(orientBack ? ['the standard Step 1'] : []), ...(poseEdited ? ['the edited search'] : []), ...(placementEdited ? ['the edited strip widths'] : []), ...(newType ? [`the new type ${typeName}`] : [])].join(', ');
    status.textContent = `Running ${row.case ?? 'this case'} with ${names}… about 23 s.`;
    try {
      const reply = await fetch('/rerun', { method: 'POST', headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ kind: kindNow, rules, source: row.source, typeId: typeName, name: typeFullName, badge: typeBadge, pose: poseNow, placement: placementNow,
          // The node editor's graph, only when it has been edited: the default is sent as nothing, so a
          // run with no edit is exactly the run it always was.
          zoneGraph: graphLib && zoneGraph && !graphLib.isDefault(zoneGraph) ? zoneGraph : null,
          orientGraph: orientEdited ? orientGraph : null }) });
      const answer = await reply.json().catch(() => ({}));
      if (!reply.ok || !answer.ok) {
        // The reason is in the run's log; an exit code alone names nothing (cia F1; rerunReport.mjs).
        status.textContent = `It did not run: ${refusalReason(answer.log) ?? answer.error ?? reply.status}`;
        return;
      }
      /*
       * The server has re-pointed /out/ at the new folder, so re-fetching the summary shows the
       * re-run. A reload would lose which case was open, and the whole point is comparing one case
       * before and after.
       */
      const fresh = await fetch(`/out/summary.json?t=${Date.now()}`).then((response) => response.json());
      // What may be claimed comes from the run's OWN summary, never the request (cia F2; rerunReport.mjs).
      const outcome = rerunOutcome({ graphEdited, summaryGraph: fresh.zoneGraph, names, orientEdited, summaryOrient: fresh.orientGraph });
      // The run on screen is now this type: the strip marks Apply done, and Save becomes the next step.
      ranTypeId = typeName;
      savedTypeId = null;
      // The run on screen now used the page's settings as they were sent, so tabs 4 and 5 stop previewing them.
      ranTiltKey = sentTiltKey;
      tiltLive = null;
      ranTypeLoad = await fetch(`/out/type-load.json?t=${Date.now()}`).then((response) => (response.ok ? response.json() : null)).catch(() => null);
      openRun(fresh, (name) => `/out/${name}?t=${Date.now()}`, '/out/summary.csv');
      status.textContent = outcome.text;
    } catch (error) {
      status.textContent = `It did not run: ${error.message}`;
    } finally {
      run.disabled = false;
      if (autoRunWaiting) { autoRunWaiting = false; autoRunOrient(); }
    }
  };
  run.addEventListener('click', () => applyNow());
  applyRun = applyNow;

  // FOLDED INTO THE STAGES (owner, 2026-11-20: "wouldn't it be more organized if folded into nodes?").
  // Every rule this panel listed now sits on the node that reads it, so showing the list too was a
  // second copy of the same controls. The list stays in the DOM, hidden, because it is where the
  // values are HELD and Apply reads them - the nodes mirror it - and only the run button, the note and
  // the status move up beside the stage tabs.
  if (served) {
    const slot = document.getElementById('stage-run');
    slot.append(document.getElementById('bench-note'), document.querySelector('.bench-actions'), status);
    slot.hidden = false;
  }
} catch (error) {
  // No server, or the rules module is not served: leave the panel hidden rather than showing a dead button.
  console.info('benchwork panel not available:', error.message);
}
</script>
</body>
</html>
