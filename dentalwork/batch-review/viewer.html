<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Folder review</title>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="base.css">
<style>
  /* The page never grows: body is exactly the window, and only the side panels scroll. */
  html, body { height: 100%; }
  body { height: 100vh; overflow: hidden; display: grid; grid-template-rows: var(--header-h) minmax(0, 1fr); color: var(--ink); font-size: var(--fs-md); }
  header { display: flex; align-items: center; gap: 12px; padding: 0 var(--pad); border-bottom: 1px solid var(--line); background: var(--surface); }
  header h1 { margin: 0; font-size: var(--fs-lg); font-weight: 500; }
  header .muted, .muted { color: var(--muted); }
  header a { margin-left: auto; color: var(--ink); }
  header a[hidden] + .open { margin-left: auto; }
  main { display: grid; grid-template-columns: 260px minmax(0, 1fr) 260px; grid-template-rows: minmax(0, 1fr); min-height: 0; overflow: hidden; }
  /* Phone / narrow window: one column, the 3D view first, then the case list and the facts + layers; the page scrolls. */
  @media (max-width: 820px) {
    body { height: auto; min-height: 100dvh; overflow: auto; grid-template-rows: auto auto; }
    header { flex-wrap: wrap; row-gap: 4px; padding: 6px var(--pad); }
    header a { margin-left: 0; }
    main { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto; overflow: visible; }
    .stage { order: -1; height: 62dvh; touch-action: none; }
    .panel, .panel.right { border: 0; border-top: 1px solid var(--line); overflow: visible; max-height: none; }
    .panel:not(.right) { max-height: 30dvh; overflow: auto; }
    .views { flex-wrap: wrap; justify-content: flex-end; max-width: 70%; }
    .note { max-width: 45%; }
  }
  .panel { border-right: 1px solid var(--line); min-height: 0; }
  .panel.right { border-right: 0; border-left: 1px solid var(--line); }
  /* The stage is sized by the grid, never by its canvas: the canvas is absolutely placed, so its pixel size cannot push the page taller. */
  .stage { position: relative; min-width: 0; min-height: 0; overflow: hidden; background: var(--scene-bg); }
  .stage canvas { position: absolute; inset: 0; display: block; width: 100%; height: 100%; }
  .views { position: absolute; top: 8px; right: 8px; display: flex; gap: 4px; }
  .steps { position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%); display: flex; gap: 4px; align-items: center; }
  .note { position: absolute; top: 44px; left: 8px; max-width: 60%; color: var(--muted); font-size: var(--fs-sm); }
  .list li { cursor: pointer; }
  .list li .badge { font-size: var(--fs-xs); }
  .list li.look .badge { border-color: var(--danger); color: var(--danger); }
  /* A case that was not built: its reason sits under the name, two lines at most (full text on hover). */
  .list li:has(small.why) { height: auto; flex-wrap: wrap; row-gap: 2px; padding: 6px 4px; }
  .list li > span:not(.badge) { white-space: nowrap; }
  .list li small.why { flex: 1 1 100%; margin-left: 26px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; white-space: normal; line-height: 1.35; color: var(--danger); }
  /* Facts: compact collapsible groups (case result, tilt, islands, tips, ...), label left, value right. */
  .fact-list { display: grid; grid-template-columns: minmax(0, 46%) minmax(0, 1fr); gap: 1px 8px; margin: 0; line-height: 1.35; }
  .fact-list dt { color: var(--muted); }
  .fact-list dt[data-tip] { cursor: help; }
  .fact-list dd { margin: 0; text-align: right; font-variant-numeric: tabular-nums; overflow-wrap: break-word; min-width: 0; }
  .fact-list dd.bad { color: var(--danger); }
  .fact-group { margin-top: var(--gap); }
  .peel-report { margin-top: var(--gap); }
  .peel-chart svg { width: 100%; height: auto; display: block; }
  .peel-legend { margin: 2px 0 0; font-size: var(--fs-sm); }
  .peel-key.ours { color: var(--danger); } .peel-key.owner { color: var(--ink); }
  .source { color: var(--muted); font-size: var(--fs-sm); overflow-wrap: anywhere; margin: 0 0 6px; }
  .swatch { width: 10px; height: 10px; border-radius: 2px; flex: none; border: 1px solid var(--swatch-border); }
  /* Layer groups: the base.css collapsible band; the count (on / total) stays regular weight. */
  .layer-group > summary .count { margin-left: auto; font-weight: 400; color: var(--muted); font-variant-numeric: tabular-nums; }
  .layer-group .legend-row { min-height: calc(var(--row) - 2px); gap: 6px; padding-left: 4px; }
  .legend-row .legend-label { flex: 1; min-width: 0; overflow-wrap: anywhere; }
  .legend-row.later { opacity: .45; }
  .stepper { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; margin: 0 0 4px; }
  .stepper .step-where { flex-basis: 100%; font-size: var(--fs-sm); cursor: help; }
  /* The print tilt, prominent, top-left over the 3D view. */
  .tilt-chip { position: absolute; top: 8px; left: 8px; display: flex; align-items: baseline; gap: 6px; padding: 3px 8px; border: 1px solid var(--line-strong); border-radius: var(--radius); background: var(--surface); cursor: help; }
  .tilt-chip[hidden] { display: none; }
  .tilt-chip .tilt-angle { font-size: var(--fs-xl); font-weight: 700; letter-spacing: .02em; }
  .tilt-chip .tilt-band { font-size: var(--fs-sm); color: var(--muted); }
  .tilt-chip.unconfirmed { border-color: var(--danger); }
  .tilt-chip.unconfirmed .tilt-angle { color: var(--danger); }
  /* The box centre's label, pinned to its sphere each frame. */
  .marker-label { position: absolute; left: 0; top: 0; transform: translate(10px, -26px); padding: 1px 6px; border-radius: 3px; background: var(--surface); border: 1px solid var(--line-strong); font-size: var(--fs-sm); white-space: nowrap; pointer-events: none; }
  .marker-label[hidden] { display: none; }
  /* Hover tooltip (3D objects and panel labels): flat, hairline, never takes the pointer. */
  .hover-tip { position: fixed; z-index: 30; max-width: 280px; padding: 4px 8px; border: 1px solid var(--line-strong); border-radius: var(--radius); background: var(--surface); font-size: var(--fs-sm); line-height: 1.35; pointer-events: none; }
  .hover-tip[hidden] { display: none; }
  .hover-tip .hover-tip-title { font-weight: 700; }
  .hover-tip .hover-tip-title:empty { display: none; }
  .hover-tip .hover-tip-fact { font-variant-numeric: tabular-nums; }
  .hover-tip .hover-tip-note { margin-top: 2px; color: var(--muted); }
  .segmented { margin-bottom: 6px; }
  .open { display: flex; gap: 4px; }
  .open input { display: none; }
  body.dragging .stage { outline: 2px dashed var(--accent, var(--ink)); outline-offset: -6px; }
  /* A case with no 3D result: a card in the middle of the stage, never an empty view. */
  .nocase { position: absolute; inset: 0; display: grid; place-items: center; padding: 24px; pointer-events: none; }
  .nocase[hidden] { display: none; }
  .nocase div { max-width: 460px; max-height: 100%; overflow: auto; padding: 16px; border: 1px solid var(--line-strong); border-radius: var(--radius); background: var(--surface); pointer-events: auto; }
  .nocase h2 { margin: 0 0 4px; font-size: var(--fs-xl); font-weight: 500; }
  .nocase .result { margin: 0 0 10px; color: var(--danger); }
  .nocase p { margin: 0 0 8px; line-height: 1.45; }
  .nocase code { color: var(--muted); font-size: var(--fs-sm); overflow-wrap: anywhere; }
</style>
<script type="importmap">{ "imports": { "three": "/three/build/three.module.js", "three/addons/": "/three/examples/jsm/" } }</script>
</head>
<body>
<header>
  <h1>Folder review</h1>
  <span class="muted" id="totals"></span>
  <a href="/out/summary.csv" download id="csv">summary.csv</a>
  <span class="open">
    <input type="file" id="pick-folder" webkitdirectory><button data-pick="pick-folder">Open folder</button>
    <input type="file" id="pick-files" multiple accept=".json,.glb,.csv"><button data-pick="pick-files">Open files</button>
  </span>
</header>
<main>
  <div class="panel">
    <div class="segmented" role="group">
      <button id="show-look" aria-pressed="true">Needs a look</button>
      <button id="show-all" aria-pressed="false">All</button>
    </div>
    <ul class="list" id="cases"></ul>
  </div>
  <div class="stage" id="stage">
    <div class="note" id="note" data-ui="review-note"></div>
    <div class="tilt-chip" id="tilt-chip" data-ui="review-tilt-chip" hidden>
      <span class="tilt-angle" data-ui="review-tilt-angle"></span>
      <span class="tilt-band" data-ui="review-tilt-band"></span>
    </div>
    <div class="marker-label" id="box-label" hidden>Oral cavity ray</div>
    <div class="nocase" id="nocase" hidden><div>
      <h2 id="nocase-name"></h2>
      <p class="result" id="nocase-result"></p>
      <p id="nocase-text"></p>
      <code id="nocase-code"></code>
    </div></div>
    <div class="views">
      <button data-view="fit">Fit view</button>
      <button data-view="top">Top view</button>
      <button data-view="bottom">Bottom view</button>
      <button data-view="side">Side view</button>
    </div>
    <div class="steps">
      <button id="prev">Previous</button>
      <span class="muted" id="position"></span>
      <button id="next">Next</button>
    </div>
  </div>
  <div class="panel right" data-ui="review-panel-right">
    <section data-ui="review-case">
      <h3>Case</h3>
      <p class="source" id="source" data-ui="review-source"></p>
      <div id="facts" class="facts" data-ui="review-facts"></div>
      <details class="fact-group peel-report" data-ui="review-peel-report" id="peel" open hidden>
        <summary class="peel-title" data-ui="review-peel-title">Peel and strength</summary>
        <div class="peel-chart" data-ui="review-peel-chart" id="peel-chart"></div>
        <p class="peel-legend" data-ui="review-peel-legend"><span class="peel-key ours">ours</span> <span class="peel-key owner">owner (Chitubox)</span> <span class="muted">layer area (mm²) by height (mm)</span></p>
      </details>
    </section>
    <section data-ui="review-layers-section">
      <h3>Layers</h3>
      <div id="layers" data-ui="review-layers"></div>
    </section>
  </div>
</main>
<div class="hover-tip" id="hover-tip" data-ui="review-hover-tip" hidden>
  <div class="hover-tip-title" data-ui="review-hover-tip-title"></div>
  <div class="hover-tip-facts" data-ui="review-hover-tip-facts"></div>
  <div class="hover-tip-note" data-ui="review-hover-tip-note" hidden></div>
</div>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { mergeVertices } from 'three/addons/utils/BufferGeometryUtils.js';

// Every colour comes from a token in tokens.css; nothing in this file is a colour value.
const cssToken = (name) => getComputedStyle(document.documentElement).getPropertyValue(name).trim();

// Layers, in collapsible groups. Each entry: [GLB name prefix, short label, hover text (the long explanation), shown by default, group id].
// Only the layers a file actually has are listed (a group with none is not shown). GLTFLoader turns spaces
// in node names into underscores; `plain` puts them back before matching.
// Group definitions: [id, title, open by default].
const GROUP_DEFS = [
  ['model', 'Model', true],
  ['supports', 'Supports', true],
  ['zones', 'Zones', true],
  ['problems', 'Tips & problems', true],
  ['rays', 'Rays', false],
  ['reference', 'Reference', false],
  ['owner', 'Owner file (-sup)', false],
  ['diagnostic', 'Diagnostic', false],
];
const LAYER_TABLE = [
  ['DENTURE', 'Denture', 'The scan in the print pose shown.', true, 'model'],
  ['NEUTRAL', 'Rest of aligner', 'The aligner body outside the support area.', true, 'model'],

  // Only a denture's own mesh (named TEAL by the engine) maps to DENTURE: see keyOf. For an aligner TEAL is the support area.
  ['SUPPORT PILLARS', 'Pillars', 'The pillars and braces our build made for the placed tips (dull plastic yellow).', true, 'supports'],
  ['Tips: dental rim', 'Tips: dental rim', 'Tips generated along the dental rim.', true, 'supports'],
  ['Tips: hole', 'Tips: hole', 'Tips generated round a hole.', true, 'supports'],
  ['Tips: area', 'Tips: area', 'Tips from the down-facing area grid.', true, 'supports'],
  ['Tips: low', 'Tips: low', 'Tips at low points.', true, 'supports'],
  ['GOLD', 'Supports (aligner)', 'Aligner: pillars, braces and raft.', true, 'supports'],
  ['ORANGE', 'Support tips (aligner)', 'Aligner: the tip cones.', true, 'supports'],

  ['TEAL', 'Support area', 'Aligner: the faces where tips may go.', true, 'zones'],
  ['No-support zone', 'No-support zone', 'Faces the parallel 45-degree rays (R1, and R1b when on) from the front-top hit first. The allowed area overrides it.', true, 'zones'],
  ['Allowed area (seen', 'Allowed area', 'Tips may stand on these faces: the oral cavity ray (R2) reaches them first. Overrides the no-support zone.', true, 'zones'],
  ['Hole band', 'Hole band', 'Faces within 5 mm of a hole edge; tips may stand here if they overhang.', true, 'zones'],
  ['Down-facing area', 'Down-facing area', 'Faces whose slope from horizontal is under the overhang angle in the print pose (0 = flat ceiling, 90 = vertical wall; global {globalOverhang}, rim band {rimOverhang}): the support candidates.', false, 'zones'],
  ['Self-supporting overhangs', 'Self-supporting overhangs (no tips needed)', 'Overhang patches (faces joined by edges) that need no open-area tips: no island or lowest point inside, projected area under the minimum (4 mm2), flattest face not within 19 degrees of horizontal, and reach under 3 mm from where they join the model. Only with the rule overhangSelfSupport on. Rim, hole, island and low-point tips are never dropped.', true, 'zones'],

  ['Sockets (no support)', 'Sockets (no support)', 'Tooth sockets: blind hollows on the teeth side, found once before tilt by filling the teeth-side depth map like water (at least 1 mm deep, rule socketMinDepthMm). Faces the oral cavity ray (R2) sees are not sockets. With rule socketNoSupport on (default) no rim, hole or area tip stands here; islands still get support.', true, 'zones'],
  ['Fitting (basin)', 'Fitting (basin)', 'Cross-check only: the fitting surface found as the basin seen from the tissue side, inside the dental rim. Changes no tip.', false, 'zones'],
  ['Suction cups', 'Suction cups', 'At the chosen tilt: hollows whose opening faces the plate. Each lift pulls a vacuum in them. Risk by opening area (rule suctionAreaMm2) and trapped volume (suctionVolumeMm3); a small through-hole vents it. Report only, no tip moves.', true, 'problems'],
  ['Drain / clean', 'Drain / clean', 'At the chosen tilt: pockets that hold uncured resin (deep for their width, rule drainAspectRatio) and sockets deeper than 3 mm (drainSocketDepthMm) that are hard to wash. Report only, no tip moves.', true, 'problems'],

  ['Tips that cannot reach', 'Cannot reach plate', 'Overhang tips with no free path to the plate: not built (black cones).', true, 'problems'],
  ['Tips left out', 'Tips left out', 'Tips with no support built (any source). Empty = every tip is supported.', true, 'problems'],
  ['ISLAND NOT resolved', 'Islands not served', 'Engine island report: the lowest point of a region that starts mid-air and no built tip serves (tip left out, below min size, in the no-support zone or outside the allowed area). Reason in the facts.', true, 'problems'],
  ['ISLAND resolved', 'Islands served', 'Engine island report: the lowest point is served by a built tip, its own or one nearby.', false, 'problems'],
  ['MARK low point with', 'Low point: no tip', 'Older rule check: a low point in the allowed area with no tip within reach (aligner: the generate island check). Not the engine island report.', true, 'problems'],
  ['MARK low point outside', 'Low point: outside', 'Older rule check, for information: a low point outside the allowed area.', true, 'problems'],
  ['MARK support crosses', 'Support crosses', 'Aligner: a support cuts through the model.', true, 'problems'],
  ['MARK crossing that', 'Crossing not judged', 'Aligner: a crossing with no face to judge against.', true, 'problems'],

  ['R1 no-support', 'R1 no-support', 'R1 no-support ray: parallel rays from the front-top toward the back-bottom; the first face each hits is the no-support zone. Each starts well outside the model and ends at the hit.', true, 'rays'],
  ['R1b steep', 'R1b steep no-support', 'R1b steep no-support ray: only when rule noSupportSteepDeg is on; the same parallel rays turned steeper (dashed lines).', true, 'rays'],
  ['R2 oral', 'R2 oral cavity', 'R2 oral cavity ray: from the oral cavity ray origin to faces it reaches first (the allowed area).', true, 'rays'],
  ['R3 hole', 'R3 hole', 'R3 hole ray: along the teeth axis; through the holes (miss) and one through solid material (hit).', true, 'rays'],
  ['R4 up-check', 'R4 up-check', 'R4 up-check ray (diagnostic): its travel through the model along the teeth axis; reported only, decides nothing.', true, 'rays'],
  ['R5 thickness', 'R5 thickness', 'R5 thickness ray: at bar-underside tips, inward along the reversed normal to the far side.', true, 'rays'],
  ['R6 corridor', 'R6 corridor', 'R6 corridor rays: at each left-out tip, a centre ray and a ring straight down to the first hit or the plate.', true, 'rays'],
  ['R7 plate-drop', 'R7 plate-drop', 'R7 plate-drop ray (space map): one sample cell, plate up to the model underside and from above down to the top.', true, 'rays'],
  ['R8 landing', 'R8 landing', 'R8 landing ray: from a pillar top straight down to where it lands.', true, 'rays'],
  ['Oral cavity ray', 'R2 origin', 'The oral cavity ray origin: on the dental rim plane, at the back edge of the tight box, on the symmetry plane.', true, 'rays'],

  ['TIGHT BOX', 'Tight box', 'The oriented box the review works in; the oral cavity ray sits on its back edge.', true, 'reference'],
  ['Print tilt', 'Build plate', 'The build plate at the chosen print angle (its normal is up).', true, 'reference'],
  ['Dental rim (continuous', 'Dental rim', 'The dental rim as thick continuous line(s); the count and closed/open state are in the name.', true, 'reference'],
  ['Hole outlines', 'Hole outlines', 'A thick line round each hole.', true, 'reference'],
  ['RIM PLANE', 'Dental rim plane', 'The level plane fitted through the dental rim loop; the oral cavity ray sits on it.', true, 'reference'],
  ['SYMMETRY PLANE', 'Symmetry plane', 'The upright plane that splits the U into left and right; the oral cavity ray sits on it.', true, 'reference'],
  ['UPRIGHT PLANE', 'Arch plane', 'The upright plane; its teeth side is its normal.', false, 'reference'],
  ['DOWN-FACING', 'Down-facing edges', 'Hard edges of the bottom chains.', false, 'reference'],
  ['ALL hard', 'All hard edges', 'Every hard edge the review found (thin).', false, 'reference'],
  ['TRIM', 'Trim chains', 'Aligner step 1: the sharp trim edges the orientation fitted to.', true, 'reference'],
  ['UEND', 'U ends', 'Aligner step 1: the two distal ends of the U.', true, 'reference'],
  ['BACK', 'Back arrow', 'Aligner step 1: points out of the back of the arch (the open side of the U).', true, 'reference'],
  ['PLANE', 'Trim plane', 'Aligner step 1: the bottom plane fitted to the trim.', false, 'reference'],
  ['BLUE', 'Outer edge', 'Aligner: the detected outer rim.', true, 'reference'],
  ['GREEN', 'Joining paths', 'Aligner: the paths that join the outer rim.', true, 'reference'],
  ['RED', 'Opening edge', 'Aligner: the detected opening edge.', true, 'reference'],

  ['YOUR SUPPORTS', 'Supports', 'The -sup STL you sent, placed on this scan.', false, 'owner'],
  ['YOUR CONTACTS', 'Contacts', 'Contact points from the -sup file, on the displayed scan.', true, 'owner'],
  ['AREA both', 'Area: both', 'Faces near both your contacts and our tips (within 2 mm).', true, 'owner'],
  ['AREA owner only', 'Area: yours only', 'Faces near your contacts but not our tips: we do not cover them.', true, 'owner'],
  ['AREA ours only', 'Area: ours only', 'Faces near our tips but not your contacts.', true, 'owner'],

  ['VIOLET', 'Outer strip, opening side', 'Aligner: sample strip beside the outer edge.', false, 'diagnostic'],
  ['AMBER', 'Outer strip, other side', 'Aligner: sample strip beside the outer edge.', false, 'diagnostic'],
  ['CYAN', 'Inner strip, opening side', 'Aligner: sample strip beside the opening edge.', false, 'diagnostic'],
  ['MAGENTA', 'Inner strip, other side', 'Aligner: sample strip beside the opening edge.', false, 'diagnostic'],
  ['LIME', 'Outer sample points', 'Aligner: points used to find the outer edge.', false, 'diagnostic'],
  ['PINK', 'Inner sample points', 'Aligner: points used to find the opening edge.', false, 'diagnostic'],
];
const LAYERS = LAYER_TABLE;
// The overhang numbers in the texts below ({globalOverhang}, {rimOverhang}) are the rule defaults the run was made with
// (summary.json `ruleDefaults`, written by batch.ts from ruleDefaults.ts), so the words cannot drift from the engine.
let RULES = {};
const ruleText = (text) => text.replace(/\{globalOverhang\}/g, RULES.overhangAngleDeg ?? '?').replace(/\{rimOverhang\}/g, RULES.dentalRimOverhangAngleDeg ?? '?');
// GLTFLoader turns spaces in node names into underscores; compare with them put back.
const plain = (name) => (name ?? '').replace(/_/g, ' ');
// GLTFLoader also drops : . [ ] / from node names ("Tips: dental rim" arrives as "Tips dental rim"): compare without them.
const bare = (text) => text.replace(/[:.\[\]\/]/g, '');
// The kind of the case on screen. A denture's one mesh is named TEAL by the engine, and its support-
// permitted faces are nearly the whole denture: for a denture that mesh is the model, not a support area.
let kindNow = 'aligner';
const keyOf = (name) => {
  const key = LAYERS.find(([prefix]) => bare(plain(name)).startsWith(bare(prefix)))?.[0];
  return key === 'TEAL' && kindNow === 'denture' ? 'DENTURE' : key;
};
const entryOf = (key) => LAYERS.find(([prefix]) => prefix === key);
const DENTURE_COLOUR = new THREE.Color(cssToken('--layer-denture-model'));
// Layer prefix -> the shared colour token (tokens.css; the GLB writers read the same file through layerColours.ts). Rays take the colour of the area they decide.
const SWATCH_VAR = {
  'No-support zone': '--layer-no-support', 'Allowed area (seen': '--layer-allowed', 'Down-facing area': '--layer-down-facing', 'Self-supporting overhangs': '--layer-self-supporting', 'Sockets (no support)': '--layer-sockets', 'Fitting (basin)': '--layer-fitting', 'Suction cups': '--layer-suction', 'Drain / clean': '--layer-drain',
  'DOWN-FACING': '--layer-down-edges', 'TIGHT BOX': '--layer-tight-box', 'RIM PLANE': '--layer-middle-plane', 'SYMMETRY PLANE': '--layer-symmetry-plane', 'Oral cavity ray': '--layer-ray-origin',
  'MARK low point outside': '--layer-low-outside', 'MARK low point with': '--layer-low-unsupported',
  'ISLAND NOT resolved': '--layer-island-unresolved', 'ISLAND resolved': '--layer-island-resolved',
  'Dental rim (continuous': '--layer-rim-edge', 'Hole outlines': '--layer-hole-edge', 'Hole band': '--layer-hole-band',
  'Tips: dental rim': '--layer-source-rim', 'Tips: hole': '--layer-source-hole', 'Tips: area': '--layer-source-area', 'Tips: low': '--layer-source-low',
  'Tips that cannot reach': '--layer-unsupportable-tips', 'Tips left out': '--layer-tips-left-out', 'SUPPORT PILLARS': '--layer-pillars', 'YOUR SUPPORTS': '--layer-owner',
  'YOUR CONTACTS': '--layer-owner', 'AREA both': '--layer-compare-both', 'AREA owner only': '--layer-compare-owner-only', 'AREA ours only': '--layer-compare-ours-only',
  'Print tilt': '--layer-ray-r7',
  'R1 no-support': '--layer-ray-r1', 'R1b steep': '--layer-ray-r1b', 'R2 oral': '--layer-ray-r2', 'R3 hole': '--layer-ray-r3', 'R4 up-check': '--layer-ray-r4',
  'R5 thickness': '--layer-ray-r5', 'R6 corridor': '--layer-ray-r6', 'R7 plate-drop': '--layer-ray-r7', 'R8 landing': '--layer-ray-r8',
};
const visible = new Map(LAYERS.map(([prefix, , , on]) => [prefix, on]));

// Denture only: the layers in the order the review ran its steps. Each step: heading, one-line note, the layer
// prefixes it draws (the print tilt has no layer: its line comes from the case facts). Other layers come after step 10.
const DENTURE_STEPS = [
  ['1. Orient', 'Up decision first (back-face rays: the side whose rays reach farther is the teeth top), then the tight box, dental rim plane and symmetry plane, before the print tilt.', ['TIGHT BOX', 'RIM PLANE', 'SYMMETRY PLANE']],
  ['2. Dental rim', 'The dental rim as thick continuous line(s), each closed or open (the count is in the name). Holes: a thick outline round each, and a 5 mm band.', ['Dental rim (continuous', 'Hole outlines', 'Hole band']],
  ['3. No-support zone', 'Faces the parallel 45-degree rays from the front-top hit first, (the R1 arrows are in the Rays group).', ['No-support zone']],
  ['4. Oral cavity ray', 'On the dental rim plane at the back edge of the box, on the symmetry plane: the allowed-area rays start here (not the 45-degree rays).', ['Oral cavity ray']],
  ['5. Allowed area', 'What the oral cavity ray sees. This overrides step 3: a face in both is allowed.', ['Allowed area (seen']],
  ['6. Print tilt', 'The build plate at the print angle the build chose.', ['Print tilt']],
  ['7. Overhangs and low points', 'Faces whose slope from horizontal is under the overhang angle (global {globalOverhang}, rim {rimOverhang}; 0 = flat ceiling, 90 = vertical wall), the self-supporting patches that need no tips (rule on), the down-facing edges, and the engine island report: amber marks an island no built tip serves (the list with height, size and reason is in the facts), green one that is served. Orange and purple are the older rule checks.', ['Down-facing area', 'Self-supporting overhangs', 'Sockets (no support)', 'Fitting (basin)', 'Suction cups', 'Drain / clean', 'DOWN-FACING', 'ISLAND NOT resolved', 'ISLAND resolved', 'MARK low point outside', 'MARK low point with']],
  ['8. Tips', 'Tips by source: dental rim, hole, area, low. Black cones: overhang tips with no free path to the plate (not built). Red cones: tips left out, any source; if that layer is empty and there are no purple marks, every tip is supported.', ['Tips: rim', 'Tips: hole', 'Tips: area', 'Tips: low', 'Tips that cannot reach', 'Tips left out']],
  ['9. Supports', 'Our pillars (plastic), the braces and the base.', ['SUPPORT PILLARS']],
  ['10. Compare with owner', 'Your -sup supports (off by default) and contacts, and the area each covers against ours.', ['YOUR SUPPORTS', 'YOUR CONTACTS', 'AREA both', 'AREA owner only', 'AREA ours only']],
];
const MODEL_KEYS = ['DENTURE', 'NEUTRAL'];
// Step-by-step (denture): the last step shown (0 = model only), null = off. caseNow is the case on screen.
let stepAt = null;
let caseNow = null;
// The step a layer key belongs to: model 0, its numbered step, or the last step for Other.
const stepOf = (key) => {
  if (MODEL_KEYS.includes(key)) return 0;
  const at = DENTURE_STEPS.findIndex(([, , keys]) => keys.includes(key));
  return at < 0 ? DENTURE_STEPS.length : at + 1;
};
const stepShows = (key) => stepAt === null || stepOf(key) <= stepAt;
// Shown = the checkbox is on and the step-by-step position allows it.
const isShown = (key) => Boolean(visible.get(key)) && stepShows(key);

const stage = document.getElementById('stage');
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(devicePixelRatio);
renderer.toneMapping = THREE.ACESFilmicToneMapping;

stage.prepend(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(cssToken('--scene-bg'));
// A soft room environment gives the PBR materials something to reflect; the lights below stay as they were.
const pmrem = new THREE.PMREMGenerator(renderer);

pmrem.dispose();
// One plastic for every support layer: the aligner's GOLD (pillars, braces, raft) and ORANGE (tips), and the
// denture's own pillars, our tip cones and the owner's supports. Each keeps its colour through a vertex colour

const SUPPORT_KEYS = ['GOLD', 'ORANGE', 'SUPPORT PILLARS', 'Tips: dental rim', 'Tips: hole', 'Tips: area', 'Tips: low', 'Tips that cannot reach', 'Tips left out', 'YOUR SUPPORTS'];
// The pillar layers: they hide below the floor (under the raft); tips stay.

// The denture box centre's label, pinned to the sphere (set in show()).
const boxLabel = document.getElementById('box-label');
let boxAnchor = null;
// Matte, low specular: resin/ABS supports, not glossy.
const PLASTIC = new THREE.MeshPhysicalMaterial({ color: cssToken('--layer-vertex-base'), vertexColors: true, metalness: 0, roughness: 0.85,
  clearcoat: 0, specularIntensity: 0.15, envMapIntensity: 0.3, side: THREE.DoubleSide });
const camera = new THREE.PerspectiveCamera(35, 1, 0.1, 5000);
scene.add(camera, new THREE.HemisphereLight(cssToken('--scene-light-sky'), cssToken('--scene-light-ground'), 1.6));
const light = new THREE.DirectionalLight(cssToken('--scene-light-sky'), 1.4);
light.position.set(1, 2, 3);
camera.add(light);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
let model = null;
// Below the floor (the bottom of the supports and raft) only the aligner and its tips show.
let floorY = null;
let underside = false;

function resize() {
  const { clientWidth: w, clientHeight: h } = stage;
  renderer.setSize(w, h, false);
  camera.aspect = w / Math.max(h, 1);
  camera.updateProjectionMatrix();
}
new ResizeObserver(resize).observe(stage);
renderer.setAnimationLoop(() => {
  controls.update();
  const below = floorY !== null && camera.position.y < floorY;

// The box centre's label sits over its sphere, and hides when the sphere is behind the camera or the layer is off.
function placeBoxLabel() {
  boxLabel.hidden = !(boxAnchor && isShown('Oral cavity ray'));
  if (boxLabel.hidden) return;
  const p = boxAnchor.clone().project(camera);
  boxLabel.style.display = p.z > 1 ? 'none' : '';
  boxLabel.style.left = `${(p.x * 0.5 + 0.5) * stage.clientWidth}px`;
  boxLabel.style.top = `${(-p.y * 0.5 + 0.5) * stage.clientHeight}px`;
}

function look(direction) {
  if (!model) return;
  const sphere = new THREE.Box3().setFromObject(model).getBoundingSphere(new THREE.Sphere());
  const fov = THREE.MathUtils.degToRad(camera.fov) / 2;
  const distance = sphere.radius / Math.sin(Math.min(fov, Math.atan(Math.tan(fov) * camera.aspect))) * 1.05;
  controls.target.copy(sphere.center);
  camera.position.copy(sphere.center).addScaledVector(direction.normalize(), distance);
  camera.up.set(0, 1, 0);
  camera.near = distance / 100; camera.far = distance * 10;
  camera.updateProjectionMatrix();
}
const VIEWS = { fit: () => new THREE.Vector3(0.6, 0.7, 1), top: () => new THREE.Vector3(0.001, 1, 0.001), bottom: () => new THREE.Vector3(0.001, -1, 0.001), side: () => new THREE.Vector3(0, 0.15, 1) };
document.querySelectorAll('[data-view]').forEach((button) => button.addEventListener('click', () => look(VIEWS[button.dataset.view]())));

function applyVisibility() {
  model?.traverse((object) => {

// Hover tooltip: one small box for the 3D view and for panel labels (data-tip). Text only (textContent), never HTML.

}

// Panel labels: any element with data-tip (and optional data-tip-title) shows its text here.
document.addEventListener('pointerover', (event) => {

document.addEventListener('pointermove', (event) => {

// One layer's checkbox row: its colour and short label; the long explanation is the hover text of the label.
function layerRow([prefix, label, legend]) {
  const row = document.createElement('label');
  row.className = 'check legend-row';
  row.dataset.ui = `review-legend-${label.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '')}`;
  row.dataset.layer = prefix;
  row.dataset.tipTitle = label;
  row.dataset.tip = ruleText(legend);
  if (stepAt !== null && stepOf(prefix) > stepAt) row.classList.add('later');
  const input = Object.assign(document.createElement('input'), { type: 'checkbox', checked: visible.get(prefix) });
  input.addEventListener('change', () => { visible.set(prefix, input.checked); applyVisibility(); placeBoxLabel(); refreshGroupCounts(); });
  const swatch = document.createElement('i');
  swatch.className = 'swatch';
  let colour = cssToken('--swatch-fallback');
  const token = SWATCH_VAR[prefix];
  model.traverse((object) => { if (object.material && (keyOf(object.name) === prefix || keyOf(object.parent?.name) === prefix)) colour = '#' + (object.userData.colour ?? object.material.color).getHexString(); });
  swatch.style.background = token ? `var(${token})` : colour;
  const name = document.createElement('span');
  name.className = 'legend-label';
  // Dental rim and hole layers name their own counts in the GLB (lines closed or open, holes): show that name, shortened.
  let shown = label;
  if (['Dental rim (continuous', 'Hole outlines'].includes(prefix)) model.traverse((object) => { if (object.name && keyOf(object.name) === prefix) shown = plain(object.name).replace('(continuous hard edge)', '').replace(/\s+:/, ':'); });
  name.textContent = shown;

// Group headers show "on / total" for the layers a case has; refreshed when a checkbox flips.

// Which groups are open survives a redraw (new case, step buttons).
const openState = new Map(GROUP_DEFS.map(([id, , open]) => [id, open]));

// Denture step-by-step: move to a step (0 = model only); null turns it off, and the checkboxes rule again.
function setStep(at) {
  stepAt = at;

// The layer panel: collapsible groups, each with the layers the file has (a checkbox, its colour, a short label).
// A denture also gets the step-by-step controls on top.
function drawLayers() {
  const present = new Set();
  model?.traverse((object) => { const key = object.name && keyOf(object.name); if (key) present.add(key); });
  const box = document.getElementById('layers');
  box.className = 'layers';
  const groups = GROUP_DEFS.flatMap(([id, title]) => {
    const here = LAYER_TABLE.filter(([prefix, , , , group]) => group === id && present.has(prefix));
    if (here.length === 0) return [];
    return [collapsible(id, title, here.map(([prefix]) => prefix), here.map(layerRow), `review-group-${id}`)];
  });
  const parts = [];
  if (kindNow === 'denture') {
    const last = DENTURE_STEPS.length;
    const stepper = document.createElement('div');
    stepper.className = 'stepper';
    stepper.dataset.ui = 'review-stepper';
    const toggle = document.createElement('button');
    toggle.textContent = 'Step-by-step';
    toggle.dataset.ui = 'review-step-toggle';
    toggle.dataset.tipTitle = 'Step-by-step';
    toggle.dataset.tip = 'Show the layers in the order the review ran its ten steps: model first, then one step at a time.';
    toggle.setAttribute('aria-pressed', String(stepAt !== null));
    toggle.addEventListener('click', () => setStep(stepAt === null ? 0 : null));
    stepper.append(toggle);
    if (stepAt !== null) {
      const prev = Object.assign(document.createElement('button'), { textContent: 'Prev', disabled: stepAt === 0 });
      prev.dataset.ui = 'review-step-prev';
      prev.addEventListener('click', () => setStep(stepAt - 1));
      const next = Object.assign(document.createElement('button'), { textContent: 'Next', disabled: stepAt === last });
      next.dataset.ui = 'review-step-next';
      next.addEventListener('click', () => setStep(stepAt + 1));
      const where = document.createElement('span');
      where.className = 'muted step-where';
      where.dataset.ui = 'review-step-where';
      where.textContent = stepAt === 0 ? 'Model only' : `${stepAt}/${last} ${DENTURE_STEPS[stepAt - 1][0].replace(/^\d+\.\s*/, '')}`;
      if (stepAt > 0) { where.dataset.tipTitle = DENTURE_STEPS[stepAt - 1][0]; where.dataset.tip = ruleText(DENTURE_STEPS[stepAt - 1][1]); }

// ---- Hover picking ----------------------------------------------------------------------------------
// The scene is picked with a THREE.Raycaster from the pointer. The first visible hit (a line hit wins over a surface it
// lies on) is described by describeHit(): the layer's plain name, key facts that are cheap to read from the picked
// geometry (ray length, tip reason, pillar height, face count) and the layer's explanation.
const raycaster = new THREE.Raycaster();
const ndc = new THREE.Vector2();
const worldPoint = (position, index, object) => new THREE.Vector3().fromBufferAttribute(position, index).applyMatrix4(object.matrixWorld);
const mm = (value) => `${value.toFixed(value < 10 ? 2 : 1)} mm`;
const visibleDeep = (object) => { for (let o = object; o; o = o.parent) if (!o.visible) return false; return true; };

// Connected parts of a welded mesh (union-find over the index), with each part's world-space height; built on first hover, cached on the object.
function partsOf(object) {
  if (object.userData.parts) return object.userData.parts;
  const geometry = object.geometry;
  const count = geometry.attributes.position.count;
  const parent = Int32Array.from({ length: count }, (_, i) => i);
  const find = (i) => { while (parent[i] !== i) { parent[i] = parent[parent[i]]; i = parent[i]; } return i; };
  const index = geometry.index.array;
  for (let i = 0; i < index.length; i += 3) { const a = find(index[i]); parent[find(index[i + 1])] = a; parent[find(index[i + 2])] = a; }
  const low = new Map(), high = new Map();
  object.updateMatrixWorld(true);
  for (let i = 0; i < count; i++) {
    const root = find(i), y = worldPoint(geometry.attributes.position, i, object).y;
    low.set(root, Math.min(low.get(root) ?? Infinity, y));
    high.set(root, Math.max(high.get(root) ?? -Infinity, y));
  }
  object.userData.parts = { find, height: (vertex) => high.get(find(vertex)) - low.get(find(vertex)), count: new Set(Array.from({ length: count }, (_, i) => find(i))).size };
  return object.userData.parts;
}

function describeHit(hit) {
  const object = hit.object;
  const key = keyOf(object.name) ?? keyOf(object.parent?.name);
  const entry = key && entryOf(key);
  if (!entry) return { title: plain(object.name || object.parent?.name) || 'Object' };
  const [, label, legend] = entry;
  const geometry = object.geometry;
  const facts = [];
  let title = label;
  if (/^R\d/.test(key)) {
    // Each arrow is 6 vertices (shaft + two head strokes; R1b 2 * dashes + 4, from the layer's extras): the first is its start, the shaft's last its end.
    const position = geometry.attributes.position;
    const per = object.userData.verticesPerArrow ?? 6, endAt = object.userData.shaftEndVertex ?? 1;
    const arrow = Math.floor(hit.index / per);
    const from = worldPoint(position, arrow * per, object), to = worldPoint(position, arrow * per + endAt, object);
    facts.push(`Length ${mm(from.distanceTo(to))}`, `Arrow ${arrow + 1} of ${position.count / per}`);
  } else if (key === 'Tips left out') {
    const tip = Math.floor(hit.faceIndex / (object.userData.trianglesPerItem ?? 24));
    const reasons = object.userData.reasons ?? [];
    const reason = reasons[tip];
    title = 'Tip left out';
    if (reason !== undefined) facts.push(`Reason: ${REASONS.find(([prefix]) => reason.startsWith(prefix))?.[1] ?? reason}`, `Code: ${reason}`);
    facts.push(`Tip ${tip + 1} of ${reasons.length || '?'}`);
  } else if (key.startsWith('Tips:')) {
    title = `Tip (${key.slice(6)})`;
    const per = object.userData.trianglesPerItem ?? 24, item = Math.floor(hit.faceIndex / per);
    const reason = (object.userData.reasons ?? [])[item];
    if (reason !== undefined) {
      // The cone's axis in world space (the print pose, +Y up): apex = the vertex repeated most, axis = vertex mean minus apex.
      const pos = geometry.attributes.position, pts = [];
      for (let i = item * per * 3; i < (item + 1) * per * 3 && i < pos.count; i++) pts.push(worldPoint(pos, i, object));
      const key = (v) => `${v.x.toFixed(4)},${v.y.toFixed(4)},${v.z.toFixed(4)}`, count = new Map();
      for (const v of pts) count.set(key(v), (count.get(key(v)) ?? 0) + 1);
      const apexKey = [...count.entries()].sort((a, b) => b[1] - a[1])[0]?.[0];
      const apex = pts.find((v) => key(v) === apexKey);
      if (apex) {
        const axis = pts.reduce((a, v) => a.add(v), new THREE.Vector3()).divideScalar(pts.length).sub(apex).normalize();
        facts.push(`Tip face slope ${THREE.MathUtils.radToDeg(Math.acos(Math.max(-1, Math.min(1, -axis.y)))).toFixed(1)}° slope from horizontal (print pose; 0 = flat ceiling, 90 = vertical wall)`);
      }
      facts.push(reason);
    }
    else facts.push(`Tip ${Math.floor(hit.faceIndex / 24) + 1} of ${geometry.index ? Math.round(geometry.index.count / 72) : '?'}`);
  } else if (key === 'Tips that cannot reach') {
    title = 'Tip that cannot reach the plate';
  } else if (['SUPPORT PILLARS', 'GOLD', 'YOUR SUPPORTS'].includes(key) && geometry.index) {
    const parts = partsOf(object);
    title = key === 'GOLD' ? 'Support (aligner)' : key === 'YOUR SUPPORTS' ? 'Your support (-sup)' : 'Support pillar';
    facts.push(`Height ${mm(parts.height(geometry.index.array[hit.faceIndex * 3]))}`, `${parts.count} parts in this layer`);
  } else if (['DENTURE', 'NEUTRAL', 'TEAL'].includes(key)) {
    facts.push(`${Math.round((geometry.index ? geometry.index.count : geometry.attributes.position.count) / 3).toLocaleString()} triangles`);
  } else if (!geometry.index && geometry.attributes.position.count % 3 === 0 && !object.isLine) {
    facts.push(`${Math.round(geometry.attributes.position.count / 3).toLocaleString()} faces in this layer`);
  }
  const shownName = ['Dental rim (continuous', 'Hole outlines'].includes(key) ? plain(object.name).replace('(continuous hard edge)', '') : '';
  return { title: shownName || title, facts, note: ruleText(legend) };
}

function pick(clientX, clientY) {
  if (!model) return;
  const rect = renderer.domElement.getBoundingClientRect();
  ndc.set(((clientX - rect.left) / rect.width) * 2 - 1, -((clientY - rect.top) / rect.height) * 2 + 1);
  raycaster.setFromCamera(ndc, camera);
  const threshold = Math.max(0.15, camera.position.distanceTo(controls.target) * 0.004);
  raycaster.params.Line.threshold = threshold;
  const hits = raycaster.intersectObject(model, true).filter((h) => (h.object.isMesh || h.object.isLine) && visibleDeep(h.object));
  const first = hits[0];
  if (!first) { hideTip(); return; }
  // A thin line lying on a surface would always lose to it: a line hit close behind the first hit wins.
  const line = first.object.isLine ? first : hits.find((h) => h.object.isLine && h.distance <= first.distance + threshold * 4);
  showTip(describeHit(line ?? first), clientX, clientY);
}

let pickTimer = 0;
const canvas = renderer.domElement;
canvas.addEventListener('pointermove', (event) => {
  if (event.buttons || event.pointerType === 'touch') { hideTip(); return; }
  const { clientX, clientY } = event;
  clearTimeout(pickTimer);
  pickTimer = setTimeout(() => pick(clientX, clientY), 50);
});
canvas.addEventListener('pointerleave', () => { clearTimeout(pickTimer); hideTip(); });
// Touch has no hover: a tap (no drag) shows the tooltip.
let tapAt = null;
canvas.addEventListener('pointerdown', (event) => { hideTip(); tapAt = event.pointerType === 'touch' ? [event.clientX, event.clientY] : null; });
canvas.addEventListener('pointerup', (event) => {
  if (tapAt && Math.hypot(event.clientX - tapAt[0], event.clientY - tapAt[1]) < 6) pick(event.clientX, event.clientY);
  tapAt = null;
});

// Plain words for the reason codes (reasons.json beside this page, first matching prefix wins), so
// runs made before summary.json carried `explanation` read the same.
const REASONS = await fetch('/reasons.json').then((r) => (r.ok ? r.json() : { reasons: [] })).then((j) => j.reasons ?? []).catch(() => []);
const explain = (c) => c.explanation || REASONS.find(([prefix]) => (c.reason ?? '').startsWith(prefix))?.[1] || c.reason || '';
// "case-003 · scan name" — the file name (no folder, no .stl) from summary.json's source path.
const fileName = (c) => (c.source ?? '').split(/[\\/]/).pop().replace(/\.stl$/i, '');
const caseLabel = (c) => (fileName(c) ? `${c.case} · ${fileName(c)}` : c.case);
const RESULT_WORDS = { inconclusive: 'Not built: the review could not decide', error: 'Not built: the file could not be read' };

const loader = new GLTFLoader();
let showing = 0;
async function show(row) {
  const ticket = ++showing;
  kindNow = row.kind === 'denture' ? 'denture' : 'aligner';
  caseNow = row;
  // Step-by-step belongs to denture cases only; an aligner always shows its checkboxes.
  if (kindNow !== 'denture') stepAt = null;
  if (model) { scene.remove(model); model.traverse((o) => { o.geometry?.dispose(); o.material?.dispose?.(); }); model = null; floorY = null; boxAnchor = null; }
  const url = row.glb ? urlOf(row.glb) : '';
  // The Step 1 evidence GLB (trim chains, U ends, plane, back arrow) loads into the same scene; a
  // case that was not built may still have one, so the owner sees what orientation detected.
  const evidenceUrl = row.orientationGlb ? urlOf(row.orientationGlb) : '';
  // No GLB (the case was not built): a card with the case, its result and the reason in plain words.
  const card = document.getElementById('nocase');
  card.hidden = Boolean(row.glb);
  if (!row.glb) {
    document.getElementById('nocase-name').textContent = caseLabel(row);
    document.getElementById('nocase-result').textContent = RESULT_WORDS[row.result] ?? `Result: ${row.result}`;
    document.getElementById('nocase-text').textContent = explain(row) || 'No reason was recorded.';
    document.getElementById('nocase-code').textContent = row.reason ? `Reason code: ${row.reason}` : '';
  }
  document.getElementById('note').textContent = url || evidenceUrl ? 'Loading...'
    : row.glb ? `${row.glb} was not in what was dropped. Drop the whole batch-... folder.` : '';
  if (url || evidenceUrl) {
    const loaded = await Promise.all([url, evidenceUrl].filter(Boolean).map((at) => loader.loadAsync(at)));
    // A newer selection started while this one loaded: drop this result.
    if (ticket !== showing) return;
    model = new THREE.Group();
    for (const gltf of loaded) model.add(gltf.scene);
    model.traverse((object) => {
      // Markers draw over everything, so a crossing inside a support body still shows.
      if (object.isMesh && plain(object.parent?.name).startsWith('MARK') || plain(object.parent?.name).startsWith('ISLAND')) {
        object.material.depthTest = false;
        object.renderOrder = 10;
      }
      // Shade the surfaces so the shape reads; markers and tubes keep their flat colour.
      const key = object.isMesh && keyOf(object.name);
      if (key && SUPPORT_KEYS.includes(key)) {
        // Weld the duplicated corners first so the normals are smooth across each part, not faceted.
        const old = object.geometry;
        object.geometry = mergeVertices(old);
        old.dispose();
        object.geometry.computeVertexNormals();
        const tint = object.material.color.clone();
        const colours = new Float32Array(object.geometry.attributes.position.count * 3);
        for (let i = 0; i < colours.length; i += 3) tint.toArray(colours, i);
        object.geometry.setAttribute('color', new THREE.BufferAttribute(colours, 3));
        object.userData.colour = tint;
        object.material = PLASTIC;
      } else if (key && ['DENTURE', 'TEAL', 'NEUTRAL'].includes(key)) {
        if (!object.geometry.attributes.normal) object.geometry.computeVertexNormals();
        // ACES plus the new lights washed the model to white, so its colour is dimmed (0.6) and it takes a light room reflection: neutral, matte, shaded.
        object.material = new THREE.MeshStandardMaterial({ color: key === 'DENTURE' ? DENTURE_COLOUR : object.material.color.clone().multiplyScalar(0.6), roughness: 0.85, envMapIntensity: 0.25, side: THREE.DoubleSide });
      }
    });
    scene.add(model);
    const supports = new THREE.Box3();
    model.traverse((object) => {
      const key = object.isMesh && keyOf(object.name);
      if (key && PILLAR_KEYS.includes(key)) supports.expandByObject(object);
    });
    // The ray origin's sphere: its world-space centre (the label's anchor).
    model.updateMatrixWorld(true);
    model.traverse((object) => {
      if (object.isMesh && keyOf(object.name) === 'Oral cavity ray') boxAnchor = new THREE.Box3().setFromObject(object).getCenter(new THREE.Vector3());
    });
    floorY = supports.isEmpty() ? null : supports.min.y;
    underside = false;
    applyVisibility();
    look(VIEWS.fit());
    document.getElementById('note').textContent = '';
  }
  drawLayers();
}

// A run comes from the server (/out/) or from files dropped on the page; urlOf maps a GLB name to where it loads from.
let cases = [];
let urlOf = (name) => `/out/${name}`;
let blobs = [];
let onlyLook = false;
let current = 0;

function openRun(summary, glbUrl, csvUrl) {
  cases = summary.cases;
  RULES = summary.ruleDefaults ?? {};
  urlOf = glbUrl;
  const needing = cases.filter((c) => c.needsLook);
  const built = cases.filter((c) => c.result === 'built').length;
  const made = summary.created ? `, made ${new Date(summary.created).toLocaleString()}` : '';
  document.getElementById('totals').textContent = `${built} built, ${needing.length} need a look (${cases.length} file(s))${made}`;
  const csv = document.getElementById('csv');
  csv.hidden = !csvUrl;
  if (csvUrl) csv.href = csvUrl;
  // Open on All with the first BUILT case shown in 3D: starting on "Needs a look" showed only the
  // unbuilt cases (no model), which read as an empty review.
  onlyLook = false;
  select(Math.max(0, cases.findIndex((c) => c.result === 'built')));
}

function empty(message) {
  document.getElementById('nocase').hidden = true;
  document.getElementById('totals').textContent = '';
  document.getElementById('csv').hidden = true;
  document.getElementById('note').textContent = message;
}

// Dropped or chosen files: a batch-... folder (summary.json + case GLBs), or GLB files alone.
// When several runs are in the drop, the newest summary.json wins and only GLBs beside it are used.
async function openFiles(entries) {
  blobs.forEach((url) => URL.revokeObjectURL(url));
  blobs = [];
  const dirOf = (path) => path.slice(0, path.lastIndexOf('/') + 1);
  const nameOf = (path) => path.slice(path.lastIndexOf('/') + 1);
  const blob = (file) => { const url = URL.createObjectURL(file); blobs.push(url); return url; };
  let run = null;
  for (const { path, file } of entries.filter(({ path }) => nameOf(path) === 'summary.json')) {
    try {
      const summary = JSON.parse(await file.text());
      if (Array.isArray(summary.cases) && (!run || (summary.created ?? '') > (run.summary.created ?? ''))) run = { summary, dir: dirOf(path) };
    } catch { /* not a review summary */ }
  }
  const glbs = entries.filter(({ path }) => /\.glb$/i.test(path) && (!run || dirOf(path) === run.dir));
  if (!run && glbs.length === 0) { empty('No summary.json or .glb file in what was dropped. Drop a batch-... folder from dentalwork/output.'); return; }
  const byName = new Map(glbs.map(({ path, file }) => [nameOf(path), file]));
  const summary = run?.summary ?? {
    cases: glbs.map(({ path }) => ({ case: nameOf(path).replace(/\.glb$/i, ''), source: path, result: 'built', glb: nameOf(path), needsLook: false })),
  };
  const missing = summary.cases.filter((c) => c.glb && !byName.has(c.glb));
  const csv = run && entries.find(({ path }) => path === `${run.dir}summary.csv`);
  openRun(summary, (name) => (byName.has(name) ? blob(byName.get(name)) : ''), csv ? blob(csv.file) : '');
  if (missing.length) document.getElementById('totals').textContent += `, ${missing.length} GLB(s) not in the drop`;
}

async function readEntry(entry) {
  if (entry.isFile) return [{ path: entry.fullPath, file: await new Promise((ok, fail) => entry.file(ok, fail)) }];
  const reader = entry.createReader();
  const children = [];
  for (let batch; (batch = await new Promise((ok, fail) => reader.readEntries(ok, fail))).length;) children.push(...batch);
  return (await Promise.all(children.map(readEntry))).flat();
}

addEventListener('dragover', (event) => { event.preventDefault(); document.body.classList.add('dragging'); });
addEventListener('dragleave', (event) => { if (!event.relatedTarget) document.body.classList.remove('dragging'); });
addEventListener('drop', async (event) => {
  event.preventDefault();
  document.body.classList.remove('dragging');
  const roots = [...event.dataTransfer.items].map((item) => item.webkitGetAsEntry?.()).filter(Boolean);
  openFiles((await Promise.all(roots.map(readEntry))).flat());
});
document.querySelectorAll('[data-pick]').forEach((button) => button.addEventListener('click', () => document.getElementById(button.dataset.pick).click()));
for (const id of ['pick-folder', 'pick-files']) {
  const input = document.getElementById(id);
  input.addEventListener('change', () => {
    openFiles([...input.files].map((file) => ({ path: `/${file.webkitRelativePath || file.name}`, file })));
    input.value = '';
  });
}
const shown = () => (onlyLook ? cases.filter((c) => c.needsLook) : cases);

const status = (c) => (c.result !== 'built' ? c.result : c.verdict);
// The print angle in words, from the case facts (the facts row and the tilt chip share it).
function printAngleText(c) {
  if (c.printAngleDeg == null) return '-';
  return `${c.printAngleDeg}° (stable ${c.stableBand || 'none'})${c.angleConfirmed ? ', confirm build passed' : ', confirm build did not pass'}`;
}
// "0-44" -> "0–44°"; 'none' or '' -> 'no stable band'.
const bandText = (band) => {
  const m = /^(-?[\d.]+)-(-?[\d.]+)$/.exec(band ?? '');
  return m ? `stable ${m[1]}–${m[2]}°` : 'no stable band';
};
// The tilt chip over the 3D view: "Tilt 8° (stable 0–44°)".
function drawTilt(c) {
  const chip = document.getElementById('tilt-chip');
  chip.hidden = c.printAngleDeg == null;
  if (chip.hidden) return;
  chip.querySelector('[data-ui="review-tilt-angle"]').textContent = `Tilt ${c.printAngleDeg}°`;
  chip.querySelector('[data-ui="review-tilt-band"]').textContent = `(${bandText(c.stableBand)})`;
  chip.classList.toggle('unconfirmed', !c.angleConfirmed);
  chip.dataset.tipTitle = 'Print tilt';
  chip.dataset.tip = [`Print angle ${c.printAngleDeg}° from upright. ${c.stableBand && c.stableBand !== 'none' ? `Every angle from ${c.stableBand.replace(/^(-?[\d.]+)-(-?[\d.]+)$/, '$1° to $2°')} gives the same decision (the stable band).` : 'No stable band was found.'}`,
    c.angleConfirmed ? 'The confirm build passed.' : 'The confirm build did not pass.', c.angleReason || ''].filter(Boolean).join(' ');
}

// Fact groups of the right panel: [id, title, open by default, the row names in it]. A row not listed lands in "More".
const FACT_GROUPS = [
  ['result', 'Case result', true, ['Kind', 'Shape check', 'Result', 'Safety check', 'Reason code', 'Supports crossing the aligner', 'Crossings not judged']],
  ['tilt', 'Tilt and orientation', true, ['Print angle', 'Up decision', 'Dental rim plane', 'Arch', 'Up/down cross-check', 'Floor offset ratio']],
  ['islands', 'Islands', true, ['Islands not resolved', 'Unresolved islands', 'Islands resolved', 'Islands outside the allowed area', 'Low points with no support', 'Low points outside the area']],
  ['tips', 'Tips', true, ['Tips by source', 'Tips placed', 'Tips left out', 'Left-out reasons', 'Unsupportable tips', 'Structures left out', 'Largest gap, outer edge (mm)', 'Largest gap, opening (mm)', 'Edge coverage needs review']],
  ['peelfacts', 'Peel and supports', false, ['Peel: largest layer, ours (mm²)', 'Peel: largest layer, owner (mm²)', 'Peel: layers where ours is >10% above owner', 'Most tips on one support tree', 'Trunk area / neck area']],
  ['ownerfacts', 'Owner file', false, ['Owner contacts', 'Owner contacts, median distance to displayed model (mm)', 'Owner area covered %', 'Our area outside owner %']],
  ['timing', 'Timing and clean-up', false, ['Time (s)', 'Scan clean-up']],
];
const factOpen = new Map(FACT_GROUPS.map(([id, , open]) => [id, open]).concat([['more', false]]));
// Short row labels (the full wording is the hover text of the label).
const FACT_SHORT = {
  'Supports crossing the aligner': 'Crossings', 'Crossings not judged': 'Not judged', 'Islands not resolved': 'Not served', 'Unresolved islands': 'Not served list',
  'Islands resolved': 'Served', 'Islands outside the allowed area': 'Outside area', 'Low points with no support': 'Low, no support', 'Low points outside the area': 'Low, outside',
  'Peel: largest layer, ours (mm²)': 'Peak layer, ours', 'Peel: largest layer, owner (mm²)': 'Peak layer, owner', 'Peel: layers where ours is >10% above owner': 'Layers over owner',
  'Most tips on one support tree': 'Max tips / tree', 'Trunk area / neck area': 'Trunk / neck', 'Owner contacts, median distance to displayed model (mm)': 'Contacts distance (mm)',
  'Owner area covered %': 'Owner area covered %', 'Our area outside owner %': 'Ours outside owner %', 'Largest gap, outer edge (mm)': 'Gap, outer (mm)', 'Largest gap, opening (mm)': 'Gap, opening (mm)',
  'Edge coverage needs review': 'Edge review', 'Unsupportable tips': 'Cannot reach', 'Left-out reasons': 'Left-out reasons', 'Tips by source': 'By source',
};
function facts(c) {
  // A denture reads only the rows that apply to it; the aligner-only rows (arch, cross-checks, gaps, edge
  // coverage, support crossings) would show "not oriented" and similar in red for a case that has none.
  const DENTURE_ROWS = ['Kind', 'Shape check', 'Result', 'Safety check', 'Islands not resolved', 'Unresolved islands', 'Islands resolved', 'Islands outside the allowed area', 'Print angle', 'Up decision', 'Tips by source', 'Unsupportable tips', 'Tips placed', 'Tips left out', 'Left-out reasons', 'Scan clean-up', 'Time (s)',
    'Dental rim plane', 'Peel: largest layer, ours (mm²)', 'Peel: largest layer, owner (mm²)', 'Peel: layers where ours is >10% above owner', 'Most tips on one support tree', 'Trunk area / neck area', 'Owner contacts', 'Owner contacts, median distance to displayed model (mm)', 'Owner area covered %', 'Our area outside owner %'];
  const rows = [
    ['Kind', c.kind || 'aligner', !!c.shapeNote],
    ['Shape check', c.shapeNote || 'ok', !!c.shapeNote],
    ['Result', c.result, c.result !== 'built'],
    ['Safety check', c.verdict || '-', c.verdict && c.verdict !== 'clear'],
    ['Supports crossing the aligner', c.crossings, c.crossings > 0],
    ['Crossings not judged', c.uncertain, c.uncertain > 0],
    // Denture: the engine island report (the amber marks and these rows are the same list). Aligner: the generate island check.
    ...(c.kind === 'denture' ? [
      ['Islands not resolved', c.islandsUnresolved, c.islandsUnresolved > 0],
      ['Unresolved islands', c.unresolvedIslands || '-', c.islandsUnresolved > 0],
      ['Islands resolved', c.islandsResolved ?? '-', false],
      ['Islands outside the allowed area', c.islandsOutsideArea, false],
    ] : [
      ['Low points with no support', c.islandsUnresolved, c.islandsUnresolved > 0],
      ['Low points outside the area', c.islandsOutsideArea, false],
    ]),
    ['Print angle', printAngleText(c), false],
    // Step 1 (orientation by the trim): how the arch was read and whether the floor rule agrees on up/down.
    ['Arch', c.archKind === 'open' ? 'open arch (trim decided)' : c.archKind === 'ring' ? 'ring (floor rule decided)' : c.archKind == null ? '-' : 'not oriented', c.archKind === ''],
    ['Up/down cross-check', c.upCrossCheck || (c.upCrossCheck == null ? '-' : 'none'), c.upCrossCheck === 'disagrees'],
    ['Floor offset ratio', c.floorOffsetRatio ?? '-', false],
    ['Scan clean-up', c.cleanedDegenerateTriangles ? `${c.cleanedDegenerateTriangles} collapsed triangle${c.cleanedDegenerateTriangles === 1 ? '' : 's'} removed` : 'none needed', false],
    ['Structures left out', c.structuresLeftOut || 'none', false],
    ['Tips placed', c.tipsPlaced, false],
    ['Tips left out', c.tipsLeftOut, false],
    ['Largest gap, outer edge (mm)', c.outerGapMm ?? '-', false],
    ['Largest gap, opening (mm)', c.openingGapMm ?? '-', false],
    ['Edge coverage needs review', c.rimNeedsReview ? 'yes' : 'no', c.rimNeedsReview],
    ['Time (s)', c.seconds, false],
  ];
  // Denture only: the owner's contacts (with the mapping check) and the area comparison; '-' when the scan has no contacts file.
  if (c.kind === 'denture') rows.push(
    ['Up decision', c.upDecision || '-', false],
    ['Tips by source', c.tipsBySource || '-', false],
    ['Suction and drain', c.traps || 'none found', false],
    ['Unsupportable tips', c.unsupportableTips ?? '-', false],
    ['Left-out reasons', c.tipsLeftOutReasons || '-', false],
    ['Peel: largest layer, ours (mm²)', c.peelMaxOurs == null ? (c.peelNote || '-') : `${c.peelMaxOurs} at ${c.peelMaxOursAtMm} mm (above the raft${c.peelRaftTopMm ? `, top ${c.peelRaftTopMm} mm` : ''})`, false],
    ['Peel: largest layer, owner (mm²)', c.peelMaxOwner == null ? '-' : `${c.peelMaxOwner} at ${c.peelMaxOwnerAtMm} mm`, false],
    ['Peel: layers where ours is >10% above owner', c.peelLayersOver ?? '-', c.peelLayersOver > 0],
    ['Most tips on one support tree', c.maxTipsPerTrunk ?? 'n/a', false],
    ['Trunk area / neck area', c.trunkToNeckArea ?? 'n/a', false],
    ['Owner contacts', c.ownerContacts ?? '-', false],
    ['Dental rim plane', c.middlePlane || '-', false],
    ['Owner contacts, median distance to displayed model (mm)', c.ownerContactsMedianMm ?? '-', c.ownerContactsMedianMm != null && c.ownerContactsMedianMm > 1],
    ['Owner area covered %', c.ownerAreaCoveredPct ?? '-', false],
    ['Our area outside owner %', c.outsideOwnerAreaPct ?? '-', false],
  );
  if (c.reason) rows.push(['Reason code', c.reason, true]);
  // The long explanation (plain-words reason, orientation note) is the hover text of the Result and Reason rows.
  const explanation = [c.reason ? explain(c) : '', c.orientationNote ?? ''].filter(Boolean).join(' ');
  const FACT_HELP = {
    'Result': explanation, 'Reason code': explanation, 'Print angle': c.angleReason || 'The print tilt the build chose.',
    'Unresolved islands': 'Lowest points of regions that start mid-air that no built tip serves, with height, size and reason.',
    'Left-out reasons': 'Why tips were not built, with counts.', 'Up decision': 'How the teeth-top side was decided.',
  };
  const factRows = c.kind === 'denture' ? rows.filter(([k]) => DENTURE_ROWS.includes(k) || k === 'Reason code') : rows;
  const byName = new Map(factRows.map((row) => [row[0], row]));
  const used = new Set();
  const line = ([k, v, bad]) => {
    used.add(k);
    const dt = document.createElement('dt'); dt.textContent = FACT_SHORT[k] ?? k;
    dt.dataset.tipTitle = k;
    if (FACT_HELP[k] || FACT_SHORT[k]) dt.dataset.tip = FACT_HELP[k] || k;
    else delete dt.dataset.tipTitle;
    const dd = document.createElement('dd'); dd.textContent = String(v ?? '-'); if (bad) dd.className = 'bad';
    dd.dataset.ui = `review-fact-${k.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '')}`;
    if (k === 'Left-out reasons') dd.dataset.ui = 'review-fact-left-out-reasons';
    if (k === 'Unresolved islands') dd.dataset.ui = 'review-fact-unresolved-islands';
    return [dt, dd];
  };
  const groupBlock = (id, title, names) => {
    const mine = names.filter((n) => byName.has(n)).map((n) => byName.get(n));
    if (mine.length === 0) return [];
    const list = document.createElement('dl');
    list.className = 'fact-list';
    list.dataset.ui = `review-facts-list-${id}`;
    list.append(...mine.flatMap(line));
    const group = collapsible(id, title, [], [list], `review-facts-${id}`, factOpen);
    group.classList.add('fact-group');
    // Counts belong to the layer groups only.
    group.querySelector('.count').remove();
    return [group];
  };
  const groups = FACT_GROUPS.flatMap(([id, title, , names]) => groupBlock(id, title, names));
  const rest = factRows.map(([k]) => k).filter((k) => !used.has(k));
  document.getElementById('facts').replaceChildren(...groups, ...groupBlock('more', 'More', rest));
  document.getElementById('source').textContent = c.source ?? '';
  drawTilt(c);
  drawPeel(c);
}

// The peel chart: layer area of our print (red) and the owner's (ink) by height, from the case's -peel.json.
async function drawPeel(c) {
  const box = document.getElementById('peel');
  const holder = document.getElementById('peel-chart');
  const data = c.kind === 'denture' && c.peelFile ? await fetch(urlOf(c.peelFile)).then((r) => (r.ok ? r.json() : null)).catch(() => null) : null;
  if (caseNow !== c && caseNow?.case !== c.case) return;
  box.hidden = !data;
  holder.replaceChildren();
  if (!data) return;
  const W = 300, H = 120, L = 30, B = 16, T = 4, R = 4;
  const { heightMm: xs, ours, owner } = data.chart;
  const xmax = Math.max(...xs, 1e-6), ymax = Math.max(...ours, ...(owner ?? []), 1e-6);
  const px = (x) => L + (x / xmax) * (W - L - R), py = (y) => H - B - (y / ymax) * (H - B - T);
  const line = (ys, cls) => `<polyline class="${cls}" fill="none" stroke-width="1.5" points="${xs.map((x, k) => `${px(x).toFixed(1)},${py(ys[k]).toFixed(1)}`).join(' ')}"/>`;
  holder.innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Layer area by height" data-ui="review-peel-svg">
    <line x1="${L}" y1="${H - B}" x2="${W - R}" y2="${H - B}" stroke="currentColor" opacity=".4"/><line x1="${L}" y1="${T}" x2="${L}" y2="${H - B}" stroke="currentColor" opacity=".4"/>
    <text x="${L - 3}" y="${T + 8}" text-anchor="end" font-size="9" fill="currentColor">${ymax.toFixed(0)}</text><text x="${L - 3}" y="${H - B}" text-anchor="end" font-size="9" fill="currentColor">0</text>
    <text x="${W - R}" y="${H - 3}" text-anchor="end" font-size="9" fill="currentColor">${xmax.toFixed(0)} mm</text>
    ${owner ? line(owner, 'peel-line-owner').replace('<polyline', '<polyline stroke="var(--ink)" data-ui="review-peel-line-owner"') : ''}
    ${line(ours, 'peel-line-ours').replace('<polyline', '<polyline stroke="var(--danger)" data-ui="review-peel-line-ours"')}</svg>`;
}

function drawList() {
  const list = shown();
  document.getElementById('cases').replaceChildren(...list.map((c, k) => {
    const li = document.createElement('li');
    li.className = `${c.needsLook ? 'look' : ''} ${k === current ? 'selected current' : ''}`;
    const badge = document.createElement('span'); badge.className = 'badge'; badge.textContent = c.needsLook ? '!' : '✓';
    // Case id plus the scan's file name, so a row is recognisable without opening it.
    const name = document.createElement('span'); name.textContent = caseLabel(c); name.title = c.source ?? '';
    // A case that was not built says why, in plain words (full text on hover); a built one says its safety verdict.
    const small = document.createElement('small');
    small.textContent = c.result !== 'built' ? `Not built: ${explain(c)}` : status(c);
    if (c.result !== 'built') { small.title = explain(c); small.className = 'why'; }
    const kindLabel = document.createElement('small'); kindLabel.className = 'kind'; kindLabel.textContent = c.kind || 'aligner';
    li.append(badge, name, kindLabel, small);
    li.addEventListener('click', () => select(k));
    return li;
  }));
  document.getElementById('show-look').setAttribute('aria-pressed', String(onlyLook));
  document.getElementById('show-all').setAttribute('aria-pressed', String(!onlyLook));
}

function select(k) {
  const list = shown();
  if (list.length === 0) { drawList(); document.getElementById('position').textContent = ''; document.getElementById('nocase').hidden = true; return; }
  current = Math.max(0, Math.min(list.length - 1, k));
  drawList();
  document.getElementById('position').textContent = `${current + 1} / ${list.length}`;
  facts(list[current]);
  show(list[current]);
}
document.getElementById('show-look').addEventListener('click', () => { onlyLook = true; select(0); });
document.getElementById('show-all').addEventListener('click', () => { onlyLook = false; select(0); });
document.getElementById('prev').addEventListener('click', () => select(current - 1));
document.getElementById('next').addEventListener('click', () => select(current + 1));
addEventListener('keydown', (event) => {
  if (event.key === 'ArrowDown' || event.key === 'PageDown') select(current + 1);
  if (event.key === 'ArrowUp' || event.key === 'PageUp') select(current - 1);
});
const served = await fetch('/out/summary.json').then((r) => (r.ok ? r.json() : null)).catch(() => null);
if (served) openRun(served, (name) => `/out/${name}`, '/out/summary.csv');
else empty('Drop a batch-... folder from dentalwork/output here, or its summary.json with the case GLBs. Open folder and Open files do the same.');
</script>
