# One pipeline per MILESTONE: app tests plus the production build, the browser walk, and the
# GitHub Pages deploy, which waits for both checks to pass. Day-to-day pushes are checked locally.
name: CI

on:
  # Milestones only (owner 2026-11-02): push a tag milestone-<name>, or run it by hand (Actions > CI > Run workflow).
  # Every day-to-day push is checked locally with the full test set instead.
  push:
    tags:
      - 'milestone-*'
  workflow_dispatch:


permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # A newer push to a pull request replaces the older run; runs on main always finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Tests and build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The engine is vendored (vendor/mixo-geocore, built and tested in mixo-geocore): no Rust toolchain here.
      - run: npm run vendor:check
      - run: npm test
      - run: npm run build
      # The SECOND copy of the dead condition below, and the one that actually starved the deploy:
      # with no artifact uploaded there is nothing to publish, so `deploy` had nothing to do even
      # once its own `if` was corrected. One defect, two copies, and fixing one of them proved only
      # that the run went green while the site stayed eight days old.
      - if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/milestone-')
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  walk:
    # SHARDED, BECAUSE THE WHOLE WALK NO LONGER FITS IN ONE RUNNER'S PATIENCE. It took 8m50s here on
    # 2026-11-01 and overran 30 minutes on 2026-11-09, having reached only section `a`'s export - a
    # shared runner rendering through SwiftShader is several times slower than the dev machine, and
    # the walk has grown two fault-injection sections since.
    #
    # The sections are already independent (each opens its own page and fixture), so they shard
    # cleanly and the three run side by side. COVERAGE IS NOT REDUCED: every section letter appears
    # exactly once below, each shard exits non-zero on its own failures, and `deploy` needs the whole
    # matrix. A shard says SOME PASS rather than ALL PASS, which is the walk's own rule for a
    # filtered run and is why that rule exists.
    name: Browser walk (${{ matrix.sections }})
    strategy:
      fail-fast: false
      matrix:
        sections: ['a', 'm,q', 'r,u,x,l,s']
    runs-on: ubuntu-24.04
    # Section `a` is the long one and earns its own budget: it carries the brush work, a deliberate
    # 2x CPU THROTTLE (section `g`, on a runner that is already slow), and `e`'s brute-force search
    # for a spot on the model - up to 49 click/undo cycles, each a support rebuild. The other two
    # shards finish in about ten minutes.
    timeout-minutes: ${{ matrix.sections == 'a' && 90 || 45 }}
    env:
      WALK_OUT: walk-out
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright-core install --with-deps chromium
      # PIPEFAIL, OR THE GATE IS DECORATION. `npm run walk | tee` returns TEE's status, so a failing
      # walk reported green here - the walk itself exits 1 correctly. Found after making the same
      # mistake by hand: reading `$?` after a `grep` on the same line.
      - run: |
          set -o pipefail
          mkdir -p walk-out && npm run walk -- --only=${{ matrix.sections }} 2>&1 | tee walk-out/walk.log
      # The locale pass is a SEPARATE run: `walkLocale` replaces the English walk rather than adding
      # to it, so it needs its own invocation. Nothing ran it until now.
      # One shard only: the locale pass replaces the English walk rather than adding to it, so
      # running it in all three would be the same work three times.
      - if: matrix.sections == 'a'
        run: |
          set -o pipefail
          npm run walk:locales 2>&1 | tee walk-out/walk-locales.log
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: walk-failure-${{ strategy.job-index }}
          path: walk-out
          if-no-files-found: warn
          retention-days: 7

  deploy:
    name: Deploy GitHub Pages
    # THIS CONDITION COULD NOT FIRE, AND NOTHING SAID SO. It read
    # `github.event_name == 'push' && github.ref == 'refs/heads/main'`, which was right while CI ran
    # on every push to main - and the owner narrowed the triggers to milestones on 2026-11-02 without
    # it. A milestone TAG push has `refs/tags/...`, and `workflow_dispatch` is not a `push`, so from
    # that day no run could deploy: the site stayed on 2026-11-01 and the only sign was its age.
    # A deploy that cannot run is the same defect class as a guard that cannot fire - it just hides
    # for longer, because nobody checks a gate that has nothing to say.
    # It now matches the triggers, and still refuses to publish from a branch that is not main.
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/milestone-')
    needs: [test, walk]
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
