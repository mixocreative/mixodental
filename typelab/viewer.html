<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Type Lab</title>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="base.css">
<style>
  /* The page never grows: body is exactly the window, and only the side panels scroll. */
  html, body { height: 100%; }
  body { height: 100vh; overflow: hidden; display: grid; grid-template-rows: var(--header-h) minmax(0, 1fr) var(--chain-h, auto); color: var(--ink); font-size: var(--fs-md); }
  header { display: flex; align-items: center; gap: 12px; padding: 0 var(--pad); border-bottom: 1px solid var(--line); background: var(--surface); }
  header h1 { margin: 0; font-size: var(--fs-lg); font-weight: 500; }
  header .muted, .muted { color: var(--muted); }
  header a { margin-left: auto; color: var(--ink); }
  header a[hidden] + .open { margin-left: auto; }
  main { display: grid; grid-template-columns: 260px minmax(0, 1fr) 260px; grid-template-rows: minmax(0, 1fr); min-height: 0; overflow: hidden; }
  /* Phone / narrow window: one column, the 3D view first, then the case list and the facts + layers; the page scrolls. */
  @media (max-width: 820px) {
    body { height: auto; min-height: 100dvh; overflow: auto; grid-template-rows: auto auto auto; }
    header { flex-wrap: wrap; row-gap: 4px; padding: 6px var(--pad); }
    header a { margin-left: 0; }
    main { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto; overflow: visible; }
    .stage { order: -1; height: 62dvh; touch-action: none; }
    .panel, .panel.right { border: 0; border-top: 1px solid var(--line); overflow: visible; max-height: none; }
    .panel:not(.right) { max-height: 30dvh; overflow: auto; }
    .views { flex-wrap: wrap; justify-content: flex-end; max-width: 70%; }
    .note { max-width: 45%; }
  }
  .panel { border-right: 1px solid var(--line); min-height: 0; overflow-y: auto; }
  .list li > span:not(.badge) { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .panel.right { border-right: 0; border-left: 1px solid var(--line); }
  /* The stage is sized by the grid, never by its canvas: the canvas is absolutely placed, so its pixel size cannot push the page taller. */
  .stage { position: relative; min-width: 0; min-height: 0; overflow: hidden; background: var(--scene-bg); }
  .stage canvas { position: absolute; inset: 0; display: block; width: 100%; height: 100%; }
  .views { position: absolute; top: 8px; right: 8px; display: flex; gap: 4px; }
  .steps { position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%); display: flex; gap: 4px; align-items: center; }
  .note { position: absolute; top: 44px; left: 8px; max-width: 60%; color: var(--muted); font-size: var(--fs-sm); }
  /* The scan session's bar and the stage banner (reviewer overhaul step 7): which scan, which type, current or not. */
  header .session { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  header .session[hidden] { display: none; }
  header .session input { width: 16em; }
  header .session [hidden] { display: none; }
  .stage-state { position: absolute; bottom: 44px; left: 50%; transform: translateX(-50%); max-width: 70%; padding: 3px 10px; border: 1px solid var(--line-strong); border-radius: var(--radius); background: var(--surface); font-size: var(--fs-sm); text-align: left; z-index: 2; }
  .stage-state[hidden] { display: none; }
  .stage-state.busy { border-color: var(--ink); }
  .stage-state.bad { border-color: var(--danger); color: var(--danger); }
  .list li { cursor: pointer; }
  .list li .badge { font-size: var(--fs-xs); }
  .list li.look .badge { border-color: var(--danger); color: var(--danger); }
  /* A case that was not built: its reason sits under the name, two lines at most (full text on hover). */
  .list li:has(small.why) { height: auto; flex-wrap: wrap; row-gap: 2px; padding: 6px 4px; }
  .list li > span:not(.badge) { white-space: nowrap; }
  .list li small.why { flex: 1 1 100%; margin-left: 26px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; white-space: normal; line-height: 1.35; color: var(--danger); }
  /* Facts: compact collapsible groups (case result, tilt, islands, tips, ...), label left, value right. */
  .fact-list { display: grid; grid-template-columns: minmax(0, 46%) minmax(0, 1fr); gap: 1px 8px; margin: 0; line-height: 1.35; }
  .fact-list dt { color: var(--muted); }
  .fact-list dt[data-tip] { cursor: help; }
  .fact-list dd { margin: 0; text-align: right; font-variant-numeric: tabular-nums; overflow-wrap: break-word; min-width: 0; }
  .fact-list dd.bad { color: var(--danger); }
  .fact-group { margin-top: var(--gap); }
  .compare-facts { padding: 6px 8px; border: 1px solid var(--line-strong); border-radius: var(--radius); }
  .compare-facts ul { margin: 4px 0 0; padding-left: 16px; }
  .compare-facts p { margin: 4px 0 0; color: var(--muted); }
  .peel-report { margin-top: var(--gap); }
  .peel-chart svg { width: 100%; height: auto; display: block; }
  .peel-legend { margin: 2px 0 0; font-size: var(--fs-sm); }
  .peel-key.ours { color: var(--danger); } .peel-key.owner { color: var(--ink); }
  .source { color: var(--muted); font-size: var(--fs-sm); overflow-wrap: anywhere; margin: 0 0 6px; }
  .swatch { width: 10px; height: 10px; border-radius: 2px; flex: none; border: 1px solid var(--swatch-border); }
  /* Layer groups: the base.css collapsible band; the count (on / total) stays regular weight. */
  .layer-group > summary .count { margin-left: auto; font-weight: 400; color: var(--muted); font-variant-numeric: tabular-nums; }
  .layer-group .legend-row { min-height: calc(var(--row) - 2px); gap: 6px; padding-left: 4px; }
  .legend-row .legend-label { flex: 1; min-width: 0; overflow-wrap: anywhere; }
  .legend-row.later { opacity: .45; }
  /* typelab rows: the same height and rhythm as a legend row, with the input first so the eye runs
     down the column that is actually being set. Tokens only - this surface uses the house values. */
  .bench-row { display: flex; align-items: center; gap: 6px; min-height: calc(var(--row) - 2px); padding-left: 4px; cursor: help; }
  .bench-row input[type=number] { width: 72px; flex: none; }
  .bench-row .bench-name { flex: 1; min-width: 0; overflow-wrap: anywhere; font-variant-numeric: tabular-nums; }
  .bench-row .bench-unit { flex: none; font-size: var(--fs-sm); }
  .bench-actions { display: flex; gap: 6px; margin: 6px 0 2px; }
  #bench-status:empty { display: none; }
  .stepper { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; margin: 0 0 4px; }
  .stepper .step-where { flex-basis: 100%; font-size: var(--fs-sm); cursor: help; }
  /* The print tilt, prominent, top-left over the 3D view. */
  .tilt-chip { position: absolute; top: 8px; left: 8px; display: flex; align-items: baseline; gap: 6px; padding: 3px 8px; border: 1px solid var(--line-strong); border-radius: var(--radius); background: var(--surface); cursor: help; }
  .tilt-chip[hidden] { display: none; }
  .tilt-chip .tilt-angle { font-size: var(--fs-xl); font-weight: 700; letter-spacing: .02em; }
  .tilt-chip .tilt-band { font-size: var(--fs-sm); color: var(--muted); }
  .tilt-chip.unconfirmed { border-color: var(--danger); }
  .tilt-chip.unconfirmed .tilt-angle { color: var(--danger); }
  /* The box centre's label, pinned to its sphere each frame. */
  .marker-label { position: absolute; left: 0; top: 0; transform: translate(10px, -26px); padding: 1px 6px; border-radius: 3px; background: var(--surface); border: 1px solid var(--line-strong); font-size: var(--fs-sm); white-space: nowrap; pointer-events: none; }
  .marker-label[hidden] { display: none; }
  .side-label { transform: translate(-50%, -50%); background: var(--paper); font-weight: 600; }
  /* Hover tooltip (3D objects and panel labels): flat, hairline, never takes the pointer. */
  .hover-tip { position: fixed; z-index: 30; max-width: 280px; padding: 4px 8px; border: 1px solid var(--line-strong); border-radius: var(--radius); background: var(--surface); font-size: var(--fs-sm); line-height: 1.35; pointer-events: none; }
  .hover-tip[hidden] { display: none; }
  .hover-tip .hover-tip-title { font-weight: 700; }
  .hover-tip .hover-tip-title:empty { display: none; }
  .hover-tip .hover-tip-fact { font-variant-numeric: tabular-nums; }
  .hover-tip .hover-tip-note { margin-top: 2px; color: var(--muted); }
  .segmented { margin-bottom: 6px; }
  .open { display: flex; gap: 4px; }
  .open input { display: none; }
  body.dragging .stage { outline: 2px dashed var(--accent, var(--ink)); outline-offset: -6px; }
  /* A case with no 3D result: a card in the middle of the stage, never an empty view. */
  .nocase { position: absolute; inset: 0; display: grid; place-items: center; padding: 24px; pointer-events: none; }
  .nocase[hidden] { display: none; }
  .nocase div { max-width: 460px; max-height: 100%; overflow: auto; padding: 16px; border: 1px solid var(--line-strong); border-radius: var(--radius); background: var(--surface); pointer-events: auto; }
  .nocase h2 { margin: 0 0 4px; font-size: var(--fs-xl); font-weight: 500; }
  .nocase .result { margin: 0 0 10px; color: var(--danger); }
  .nocase p { margin: 0 0 8px; line-height: 1.45; }
  .nocase code { color: var(--muted); font-size: var(--fs-sm); overflow-wrap: anywhere; }

/* THE CHAIN: the engine's steps as nodes, left to right, in the order they actually run.
   It is generated from DENTURE_STEPS - the same list the step-by-step buttons walk - so it cannot
   describe a chain the engine does not run. No drag handles, deliberately: see the note it prints. */
.chain { position: relative; border-top: 1px solid var(--line); margin-top: 10px; padding: 10px 12px 14px; min-width: 0; min-height: 0; overflow-y: auto; }
/* The divider between the 3D view and the stages (owner, 2026-11-20: "allow push up the divider in case
   we need more space to show the editor"). Drag it; double-click puts it back to fit the content. */
.chain-divider { position: sticky; top: -10px; z-index: 5; height: 10px; margin: -10px -12px 0; cursor: row-resize; touch-action: none; }
.chain-divider::after { content: ""; display: block; width: 48px; height: 4px; margin: 3px auto 0; border-radius: 2px; background: var(--line-strong); }
.chain-divider:hover::after, .chain-divider.dragging::after { background: var(--red); }
@media (max-width: 820px) { .chain-divider { display: none; } }
.chain-head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.chain-head h3 { margin: 0; }
.chain-rail { display: flex; gap: 0; overflow-x: auto; padding: 10px 0 4px; align-items: flex-start; min-width: 0; }
.chain-node { flex: 0 0 auto; width: 186px; border: 1px solid var(--line); border-radius: 6px;
  padding: 7px 8px; background: var(--surface); display: flex; flex-direction: column; gap: 5px; }
/* The card is a DIV, not a button: a button may not contain the inputs the settings rows need, and
   a card that cannot hold a field can never become an editor. The title is the button instead. */
.chain-node:has(.n[aria-pressed="true"]) { border-color: var(--red); box-shadow: 0 0 0 1px var(--red); }
.chain-node .n { height: auto; padding: 0; background: none; border: 0; text-align: left; cursor: pointer; }
/* base.css paints a pressed button's TEXT in --paper for its dark fill; the card drops the fill, so the
   selected card's title went paper-on-paper and vanished (owner, 2026-11-20). The card border shows selection. */
.chain-node .n[aria-pressed="true"] { background: none; border: 0; color: var(--ink); }
.chain-node.absent { opacity: 0.5; }
/* A locked aligner node: readable, plainly not a control (no pointer, a muted tag instead of a button). */
.chain-node.locked { cursor: default; }
.chain-node.locked .n { cursor: default; }
.chain-node .lock { align-self: flex-start; font-size: 10px; color: var(--muted); border: 1px solid var(--line); border-radius: 8px; padding: 0 6px; }
.chain-node .n { font-weight: 600; font-size: 12px; line-height: 1.25; }
/* Capped, because the rail is as tall as its TALLEST card and step 7 owns nine rules: without this
   the chain ate the page and squeezed the 3D view to a sliver, while the card responsible was
   scrolled out of sight to the right. A card scrolls its own settings instead. */
.chain-sets { display: flex; flex-direction: column; gap: 3px; border-top: 1px dashed var(--line); padding-top: 4px; }
.chain-set { display: flex; align-items: center; gap: 5px; font-size: 11px; }
.chain-set .k { color: var(--muted); }
.chain-set .v { margin-left: auto; font-variant-numeric: tabular-nums; }
.chain-set select { max-width: 150px; margin-left: auto; font-size: 11px; height: 20px; min-width: 0; }
.chain-set:has(select) { flex-wrap: wrap; row-gap: 2px; }
.chain-set:has(select) select { flex: 1 1 100%; max-width: 100%; margin-left: 0; }
.chain-set input { width: 84px; min-width: 0; max-width: 100%; box-sizing: border-box; height: 20px; margin-left: auto; font-size: 11px; padding: 0 4px; }
.chain-none { font-size: 11px; color: var(--muted); border-top: 1px dashed var(--line); padding-top: 4px; }
.chain-node .outs { display: flex; flex-direction: column; gap: 2px; }
.chain-node .out { display: flex; align-items: center; gap: 5px; font-size: 11px; color: var(--muted); }
.chain-node .swatch { width: 9px; height: 9px; border-radius: 2px; flex: 0 0 auto; }
.chain-node .count { margin-left: auto; font-variant-numeric: tabular-nums; }
.chain-link { flex: 0 0 auto; align-self: flex-start; margin-top: 28px; width: 14px; text-align: center; color: var(--muted); }
.chain-note { font-size: 11px; color: var(--muted); margin: 2px 0 0; max-width: 92ch; }
.chain-key { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 14px; font-size: 11px; color: var(--muted); margin: 8px 0 2px; }
.chain-key .out { display: inline-flex; align-items: center; gap: 5px; color: var(--ink); }
.chain-key .k { font-weight: 600; }

/* The New-type strip: the type being made, and its steps, above the stage tabs. Text left-aligned (house rule). */
.type-strip { display: flex; flex-direction: column; gap: 6px; padding: 6px 0 8px; border-bottom: 1px solid var(--line); margin-bottom: 6px; text-align: left; }
.type-fields { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; }
.type-title { font-size: 12px; }
.type-field { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; }
.type-field .k { color: var(--muted); }
.type-field input, .type-field select { height: 22px; font-size: 11px; padding: 0 5px; min-width: 0; box-sizing: border-box; }
.type-field input { width: 160px; }
.type-field input.type-id { width: 130px; font-family: var(--font-mono, monospace); }
.type-field input.type-badge-input { width: 56px; }
.type-based { color: var(--muted); font-size: 11px; }
.type-new { height: 22px; padding: 0 10px; font-size: 11px; }
.type-steps { display: flex; flex-wrap: wrap; gap: 4px 6px; margin: 0; padding: 0; list-style: none; font-size: 11px; color: var(--muted); }
.type-steps li { padding: 1px 8px; border: 1px solid var(--line); border-radius: 10px; }
.type-steps li.done { color: var(--ink); border-color: var(--ink); }
.type-steps li.now { color: var(--ink); border-color: var(--red); box-shadow: 0 0 0 1px var(--red); }
.type-step-link { height: auto; padding: 0; border: 0; background: none; color: inherit; font-size: 11px; cursor: pointer; text-decoration: underline; }
.type-note { margin: 0; font-size: 11px; color: var(--muted); }
.type-note.type-warn { color: var(--warning); }

/* The three stages: one tab per stage, one stage on screen, so the 3D view keeps its height. */
.stage-tabs { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.stage-tab { height: auto; padding: 4px 12px; border: 1px solid var(--line); border-radius: 14px; background: var(--surface); cursor: pointer; font-weight: 600; }
.stage-tab[aria-pressed="true"] { border-color: var(--red); box-shadow: 0 0 0 1px var(--red); }
/* A PRESSED button keeps its dark fill under the mouse. base.css turns every hovered button white
   (`button:hover`) while the pressed state paints its text paper-white, so the tab just clicked went
   blank exactly while the pointer was on it (UX check, 2026-11-20). Same trap in the segmented switch. */
.stage-tab[aria-pressed="true"]:hover:not(:disabled), .segmented button[aria-pressed='true']:hover:not(:disabled) { background: var(--ink); color: var(--paper); }
.chain-node .n[aria-pressed="true"]:hover:not(:disabled) { background: none; color: var(--ink); }
.stage-arrow { color: var(--muted); }
.stage-body { min-width: 0; }
.chain-node.search { width: 300px; }
.deg-figure svg { width: 100%; height: auto; max-width: 280px; display: block; }
.deg-figure .picked { fill: var(--red); }
.chain-node.search input.type-name { width: 150px; }
.chain-node.search input.type-badge { width: 72px; }
.chain-none.bad { color: var(--danger); }
.deg-how { margin: 4px 0 6px; font-size: 11px; color: var(--muted); line-height: 1.35; }
.deg-figure .plate { stroke: var(--muted); stroke-width: 2; }
.deg-figure .up { stroke: var(--muted); stroke-dasharray: 3 2; }
.deg-figure .lean, .deg-figure .arc { stroke: var(--red); fill: none; stroke-width: 1.5; }
.deg-figure text { font-size: 11px; fill: var(--muted); }
.deg-figure text.side { fill: var(--ink); font-weight: 600; }
/* The zone editor. */
.zone-status { font-size: 12px; padding: 5px 8px; border-radius: 4px; margin: 8px 0 6px; }
.zone-status.default { background: var(--surface); border: 1px solid var(--line); }
.zone-status.edited { border: 1px solid var(--warning); }
.zone-bar { display: flex; gap: 6px; align-items: center; margin-bottom: 6px; }
.zone-bar select, .zone-bar button { height: auto; padding: 3px 8px; }
.zone-report { font-size: 11px; display: flex; flex-direction: column; gap: 2px; margin-bottom: 6px; }
.zone-report .ok { color: var(--success); }
.zone-report .bad { color: var(--danger); }
.zone-report .warn { color: var(--warning); }
.zone-outs { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 11px; margin-bottom: 4px; }
.zone-out { display: flex; gap: 4px; align-items: center; }
.zone-out .k { color: var(--muted); font-family: var(--font-mono, monospace); }
.zone-out select, .zone-node select { height: 20px; font-size: 11px; max-width: 120px; }
.zone-node { width: 200px; }
.zone-node.idle { opacity: 0.6; border-style: dashed; }
.zone-node.fixed { background: transparent; }
.zone-head { display: flex; align-items: center; gap: 4px; }
.zone-tools { margin-left: auto; display: flex; gap: 2px; }
.zone-tools button { height: 18px; width: 20px; padding: 0; font-size: 11px; }
.zone-node input { width: 64px; height: 18px; margin-left: auto; font-size: 11px; padding: 0 3px; }
.zone-node .chain-set select { margin-left: auto; }

/* The React Flow canvas and its nodes. Colours are tokens: the bundle's own stylesheet supplies the
   canvas chrome, and nothing here may hold a literal. */
.zone-canvas { min-height: 220px; resize: vertical; overflow: hidden; border: 1px solid var(--line); border-radius: 6px; background: var(--sunken); }
.zone-canvas .zn, .zone-canvas .zo { font-size: 11px; background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px; width: 220px; color: var(--ink); }
.zone-canvas .zn.idle { opacity: 0.6; border-style: dashed; }
.zone-canvas .zn.fixed { background: transparent; }
.zone-canvas .zn-head { display: flex; align-items: baseline; gap: 6px; font-size: 12px; }
.zone-canvas .zn-id { margin-left: auto; color: var(--muted); font-size: 10px; }
.zone-canvas .zn-says { color: var(--muted); font-size: 10px; line-height: 1.35; margin: 2px 0 6px; }
.zone-canvas .zn-readout { font-size: 10px; line-height: 1.35; margin: 0 0 6px; padding: 3px 5px; background: var(--paper); border-radius: 3px; color: var(--ink); }
.zone-canvas .zn-takes { font-size: 10px; line-height: 1.35; margin: 0 0 6px; color: var(--ink); }
.restore-mark { margin-left: 4px; padding: 0 5px; font-size: 11px; line-height: 16px; border: 1px solid var(--line); border-radius: 3px; background: var(--paper); cursor: pointer; }
.restore-mark[hidden] { display: none; }
.zone-canvas .zn-restore { margin-left: 4px; padding: 0 5px; font-size: 11px; line-height: 16px; border: 1px solid var(--line); border-radius: 3px; background: var(--paper); cursor: pointer; }
/* position: relative so each Handle sits on ITS row, not at a fraction of the node's height. */
.zone-canvas .zn-row { position: relative; display: flex; align-items: center; gap: 6px; min-height: 22px; }
.zone-canvas .zn-in { color: var(--muted); }
.zone-canvas .zn-type, .zone-canvas .zn-outtype { margin-left: auto; color: var(--muted); font-size: 10px; }
.zone-canvas .zn-out-row { border-top: 1px solid var(--line); margin-top: 4px; }
.zone-canvas .zn input, .zone-canvas .zn select { margin-left: auto; font-size: 11px; height: 20px; padding: 0 3px; }
.zone-canvas .zn input { width: 64px; }
/* A dropdown gets its own line under its label, so a described choice is read whole, not cut off. */
.zone-canvas .zn-row:has(select) { flex-wrap: wrap; row-gap: 2px; padding-bottom: 2px; }
/* A dropdown is as wide as the node and no wider: the chosen words end in "..." and the whole choice
   shows on hover (owner screenshot, 2026-11-20: "tissue side - the side that rests on the gums" ran
   past the node's edge). */
.zone-canvas .zn select { flex: 1 1 100%; width: 100%; min-width: 0; max-width: 100%; margin-left: 0; box-sizing: border-box; text-overflow: ellipsis; }
.zone-canvas .zn input { box-sizing: border-box; }
/* The node's group: a coloured stripe and a small label, so a kind is found at a glance. */
.zone-canvas .zn { border-left: 4px solid var(--zn-group, var(--line)); }
.zone-canvas .zn-group { font-size: 9px; letter-spacing: 0.04em; text-transform: uppercase; color: var(--zn-group, var(--muted)); margin-bottom: 1px; }
.zone-canvas .zn-live { color: var(--red); }
.zone-canvas .zn-note { color: var(--muted); font-size: 10px; margin-top: 4px; }
.zone-canvas .zo { width: 280px; border-color: var(--ink); }
.zone-canvas .zo-row { align-items: flex-start; padding: 4px 0; border-top: 1px solid var(--line); }
.zone-canvas .zo-row .react-flow__handle { top: 12px; }
.zone-canvas .zo-row.empty b { color: var(--danger); }
.zone-canvas .zn.has-issue { border-color: var(--danger); }
.zone-canvas .zn-issue { color: var(--danger); font-size: 10px; line-height: 1.35; margin: 2px 0; }
.zone-canvas .zn-warn { color: var(--warning); font-size: 10px; line-height: 1.35; margin: 2px 0; }
.zone-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; margin: 4px 0 6px; font-size: 12px; }
.zone-bar .chain-key { margin: 0; }
.zone-bar .chain-note { flex: 1 1 420px; margin: 0; }
.zone-summary.ok { color: var(--success); }
.zone-summary.bad { color: var(--danger); }
.zone-legend { display: flex; flex-wrap: wrap; gap: 4px 10px; color: var(--muted); font-size: 11px; }
.zone-legend span { border-left: 4px solid var(--zn-group); padding-left: 4px; }
.zone-tools-row { display: flex; gap: 6px; margin-left: auto; }
/* With the divider dragged, the stage area is a fixed height: the canvas takes what the chrome leaves,
   so its zoom controls stay inside the pane (UX review 2026-11-20). Without it, a generous fixed height. */
.zone-canvas { height: 480px; }
:root[style*="--chain-h"] .chain { display: flex; flex-direction: column; }
:root[style*="--chain-h"] #stage-body { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; }
:root[style*="--chain-h"] .zone-canvas { flex: 1 1 auto; height: auto; min-height: 260px; }
.zone-canvas .react-flow__minimap { width: 120px; height: 80px; }
.zone-canvas .react-flow__minimap svg { width: 120px; height: 80px; }
@media (max-width: 1100px) { .zone-canvas .react-flow__minimap { display: none; } }
/* The rim tab (docs/ORIENT-NODES.md section 10): read-only, below the Orient cards, so shorter than the zone editor.
   A rim-derived node is greyed and plainly not a control; its reason is the line under its title. */
.rim-canvas { height: 420px; resize: vertical; }
:root[style*="--chain-h"] .rim-canvas { min-height: 220px; }
.zone-canvas .zn.derived { opacity: 0.55; border-style: dashed; cursor: not-allowed; }
.zone-canvas .zn-reason { font-size: 10px; color: var(--muted); margin: 1px 0 2px; }
.zone-canvas .zn-remove { margin-left: 4px; border: 0; background: none; color: var(--danger); font-size: 14px; line-height: 1; padding: 0 2px; cursor: pointer; }
/* Two lines of explanation; the whole sentence on hover or when the node is selected. */
.zone-canvas .zn-says { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.zone-canvas .react-flow__node:hover .zn-says, .zone-canvas .react-flow__node.selected .zn-says { display: block; overflow: visible; }
/* THE SELECTED CARD (owner 2026-11-25: "the selected nodes also get a highlight on the node's border ... so i know what
   node(s) is selected"): the chain card's red ring (.chain-node above), so the page has one sign for selected. A ring,
   not border-color: border-color would repaint the left stripe, which is the node's GROUP, not its state. */
.zone-canvas .react-flow__node.selected :is(.zn, .zo) { box-shadow: 0 0 0 2px var(--red); }
.zone-canvas .zn-fixed { margin-left: auto; color: var(--muted); font-size: 10px; text-align: right; }
.zone-canvas .zo-set { width: 14px; color: var(--success); font-size: 11px; text-align: center; }
.zone-canvas .zo-from { color: var(--muted); font-size: 10px; }
.zone-canvas .zo-says { color: var(--muted); font-size: 10px; line-height: 1.35; }
.zone-canvas .h-mask { background: var(--layer-allowed); }
.zone-canvas .h-depthMap { background: var(--warning); }
.zone-canvas .h-position { background: var(--red); }
.zone-canvas .h-rim { background: var(--layer-no-support-steep); }
.zone-canvas .h-zone { background: var(--node-marks); }

/* The run button, folded up from the old typelab panel to sit beside the stages it runs. */
.stage-run { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin: 6px 0; font-size: 11px; }
.stage-run .bench-actions { display: flex; gap: 6px; }
.stage-run #bench-note, .stage-run #bench-status { margin: 0; color: var(--muted); }

<body>
<header>
  <h1>Type Lab</h1>
  <span class="muted" id="totals"></span>
  <a href="/out/summary.csv" download id="csv">summary.csv</a>
  <!--
    THE SCAN SESSION (docs/REVIEWER-OVERHAUL-PLAN.md, build step 7): import scans here and run them with any type -
    no batch run first. Shown only when the review server answers (it reads the folders and runs the builds).
  -->
  <span class="session" id="session-bar" data-ui="session-bar" hidden>
    <select id="category-pick" data-ui="category-pick" title="What the scans are. Asked once per import, never guessed from a scan.">
      <option value="denture">Denture</option><option value="aligner">Aligner</option>
    </select>
    <button id="import-files" data-ui="import-files" title="Choose one or more scan files (STL, GLB or glTF) in the system's dialog. Scans are read where they are, never copied.">Import files</button>
    <button id="import-folder" data-ui="import-folder" title="Choose a folder of scans (STL, GLB or glTF) in the system's dialog (subfolders are included). Scans are read where they are, never copied.">Import folder</button>
    <input id="import-path" data-ui="import-path" placeholder="or paste a folder or scan file path, Enter" spellcheck="false">
    <select id="type-pick" data-ui="type-pick" hidden title="The type the scans run with. Switch to compare: the same scans, another type."></select>
    <button id="type-duplicate" data-ui="type-duplicate" hidden title="Start a new type from this one: the Type strip gets a new id and name; this type is not touched. Edit, Apply, Save. Renaming a type's id is this too - projects store the id, so the old one keeps loading.">Duplicate</button>
    <select id="compare-pick" data-ui="compare-pick" hidden title="Pin a second type to compare with: the scan on screen runs with it too, and the flip shows one then the other at the same camera."></select>
    <button id="compare-flip" data-ui="compare-flip" hidden title="Show the other type's result for this scan, at the same camera (key C).">Flip (C)</button>
    <button id="run-all" data-ui="run-all" hidden title="Run every scan with this type, two at a time. Each scan runs on its own when you open it.">Run all</button>
    <button id="run-stop" data-ui="run-stop" hidden title="Stop every run of this session that is waiting or going.">Stop</button>
    <span class="muted" id="cache-size" data-ui="cache-size" title="Every scan run with every type is kept, so switching back is instant. About 90 MB each."></span>
    <button id="cache-clear" data-ui="cache-clear" hidden title="Delete every kept run. Scans and types are not touched.">Clear</button>
  </span>
  <span class="open">
    <input type="file" id="pick-folder" webkitdirectory><button data-pick="pick-folder" title="Open a review folder an earlier batch run made (summary.json and its GLBs).">Open review folder</button>
    <input type="file" id="pick-files" multiple accept=".json,.glb,.csv"><button data-pick="pick-files" title="Open a review's summary.json and GLB files.">Open review files</button>
  </span>
</header>
<main>
  <div class="panel">
    <div class="segmented" role="group">
      <button id="show-look" aria-pressed="true">Needs a look</button>
      <button id="show-all" aria-pressed="false">All</button>
    </div>
    <ul class="list" id="cases"></ul>
  </div>
  <div class="stage" id="stage">
    <div class="stage-state" id="stage-state" data-ui="stage-state" hidden></div>
    <div class="note" id="note" data-ui="review-note"></div>
    <div class="tilt-chip" id="tilt-chip" data-ui="review-tilt-chip" hidden>
      <span class="tilt-angle" data-ui="review-tilt-angle"></span>
      <span class="tilt-band" data-ui="review-tilt-band"></span>
    </div>
    <div class="marker-label" id="box-label" hidden>Oral cavity ray</div>
    <div class="nocase" id="nocase" hidden><div>
      <h2 id="nocase-name"></h2>
      <p class="result" id="nocase-result"></p>
      <p id="nocase-text"></p>
      <code id="nocase-code"></code>
      <button type="button" id="nocase-action" data-ui="nocase-action" hidden></button>
    </div></div>
    <div class="views">
      <button data-view="fit">Fit view</button>
      <button data-view="top">Top view</button>
      <button data-view="bottom">Bottom view</button>
      <button data-view="side">Side view</button>
    </div>
    <div class="steps">
      <button id="prev">Previous</button>
      <span class="muted" id="position"></span>
      <button id="next">Next</button>
    </div>
  </div>
  <div class="panel right" data-ui="review-panel-right">
    <section data-ui="review-case">
      <h3>Case</h3>
      <p class="source" id="source" data-ui="review-source"></p>
      <div id="facts" class="facts" data-ui="review-facts"></div>
      <details class="fact-group peel-report" data-ui="review-peel-report" id="peel" open hidden>
        <summary class="peel-title" data-ui="review-peel-title">Peel and strength</summary>
        <div class="peel-chart" data-ui="review-peel-chart" id="peel-chart"></div>
        <p class="peel-legend" data-ui="review-peel-legend"><span class="peel-key ours">ours</span> <span class="peel-key owner">owner's slicer</span> <span class="muted">layer area (mm²) by height (mm)</span></p>
      </details>
    </section>
    <section data-ui="review-layers-section">
      <h3>Layers</h3>
      <div id="layers" data-ui="review-layers"></div>
    </section>
    <!--
      TYPE LAB: turn a rule and run this case again. Hidden until the rules module loads, because a
      panel whose controls do not match the engine's rule names is worse than no panel - it would
      pass names `packRules` ignores and the run would look like an answer having tested nothing.
    -->
    <section data-ui="bench-section" id="bench-section" hidden>
      <h3>Turn a rule</h3>
      <p class="muted" id="bench-note">A re-run takes about 23 seconds per case and writes a new folder; this review is never overwritten.</p>
      <div id="bench-rules" data-ui="bench-rules"></div>
      <div class="bench-actions">
        <button id="bench-run" data-ui="bench-run">Apply and run again</button>
        <button id="bench-reset" data-ui="bench-reset" title="Put the search, the zone setup and every setting back to the standard ones. The review on screen is not touched.">Discard my changes</button>
        <button id="type-save" data-ui="type-save" title="Save the draft the scans ran as a NEW dated file, types/&lt;category&gt;/&lt;id&gt;.&lt;date-time&gt;.type.json, with its proof - commit it to ship it. On a review folder, opens its scans as a session first.">Save type</button>
      </div>
      <p class="muted" id="bench-status" data-ui="bench-status"></p>
    </section>
  </div>
</main>
<section class="chain" id="chain" data-ui="review-node-chain" hidden>
  <div class="chain-divider" id="chain-divider" data-ui="chain-divider" role="separator" aria-orientation="horizontal" aria-label="Resize the stage area" tabindex="0" title="Drag to give the stages more or less height. Double-click to fit. Arrow keys work too."></div>
  <div class="type-strip" id="type-strip" data-ui="type-strip"></div>
  <div class="stage-tabs" id="stage-tabs" data-ui="review-stage-tabs"></div>
  <div class="stage-run" id="stage-run" data-ui="stage-run" hidden></div>
  <div class="stage-body" id="stage-body" data-ui="review-stage-body"></div>
</section>

<div class="hover-tip" id="hover-tip" data-ui="review-hover-tip" hidden>
  <div class="hover-tip-title" data-ui="review-hover-tip-title"></div>
  <div class="hover-tip-facts" data-ui="review-hover-tip-facts"></div>
  <div class="hover-tip-note" data-ui="review-hover-tip-note" hidden></div>
</div>

import * as THREE from 'three';

// Layers, in collapsible groups. Each entry: [GLB name prefix, short label, hover text (the long explanation), shown by default, group id].

  ['YOUR SUPPORTS', 'Supports', 'The -sup STL you sent, placed on this scan.', false, 'owner'],
  ['YOUR CONTACTS', 'Contacts', 'Contact points from the -sup file, on the displayed scan.', true, 'owner'],
  ['AREA both', 'Area: both', 'Faces near both your contacts and our tips (within 2 mm).', true, 'owner'],

const LAYERS = LAYER_TABLE;
// The overhang numbers in the texts below ({globalOverhang}, {rimOverhang}) are the rule defaults the run was made with

/* The typelab panel's fields, once it has built them: the chain mirrors these rather than keeping a

let benchFields = null;

   default"). Null = a built-in (or a review folder) is open, and restore goes to the built-in as before. */
let savedBaseline = null;

  ['tiltStartDeg', 'start', 'startDeg', 'Where the search starts, degrees from upright. 0 is upright; a type may start later (owner ruling 5).'],
  ['tiltRangeDeg', 'end', 'endDeg', 'The furthest lean the search tries. Each degree leans the denture back so the teeth side faces further up.'],
  ['tiltStepDeg', 'step', 'stepDeg', 'The search tries every step from start to end.'],
  ['tiltMarginDeg', 'tie margin', 'marginDeg', 'How far either side of a chosen angle must also pass for it to count as stable.'],
];
let poseEdits = {};
try { poseEdits = JSON.parse(localStorage.getItem('review-pose') || '{}') ?? {}; } catch { poseEdits = {}; }

 * 4 Support settings, 5 Print angle - Print angle LAST, because the angle is picked USING the zones and the support
 * rules (denture/tilt.rs row_with). One tab on screen at a time, so the 3D view keeps its height, and choosing a tab
 * cuts the 3D layers to what that tab and the earlier ones produce (`cut`, through the step walk's setStep).
 *
 * Stage 2 is a real graph editor over `nodeGraph.mjs`: add a node, remove one, rewire any input,
 * rebind any output, edit parameters. Order is the WIRING - which input feeds which side of a
 * Subtract - so "rearranging" a zone means rewiring it; moving a card left or right only changes
 * where it is drawn, and the tooltip says so rather than letting a drag pretend to mean something.
 *

 * the node named, and the run's summary.json records which graph made it. The status line says two

function colourKey(stage, present) {
  const line = document.createElement('div');

function chainCard(at, present, names) {
  const [label, , keys] = DENTURE_STEPS[at];
  const here = keys.filter((key) => present.has(key));
  const node = document.createElement('div');
  node.className = here.length > 0 ? 'chain-node' : 'chain-node absent';
  node.dataset.ui = `chain-node-${at + 1}`;
  const title = document.createElement('button');
  title.type = 'button';
  title.className = 'n';
  // The tabs are the one numbering (1 Orient ... 5 Print angle); a card's own step
  // number beside them read as a fourth and fifth stage (UX review 2026-11-20).
  title.textContent = label.replace(/^\d+\.\s*/, '');
  title.setAttribute('aria-pressed', String(stepAt === at + 1));
  title.dataset.ui = `chain-step-${at + 1}`;
  title.dataset.tipTitle = label;
  title.dataset.tip = ruleText(DENTURE_STEPS[at][1]);
  title.addEventListener('click', () => setStep(stepAt === at + 1 ? null : at + 1));
  const outs = document.createElement('span');
  outs.className = 'outs';
  const SHOWN = 4;
  for (const key of keys.slice(0, SHOWN)) {
    const row = document.createElement('span');
    row.className = 'out';
    const swatch = document.createElement('span');
    swatch.className = 'swatch';
    swatch.style.background = present.has(key) ? colourOf(key) : 'transparent';
    swatch.style.border = present.has(key) ? 'none' : '1px dashed var(--line)';
    const text = document.createElement('span');
    text.textContent = shortLabel(key);
    row.append(swatch, text);
    const full = names.find((name) => bare(plain(name)).startsWith(bare(key)));
    const count = full && /(\d+) faces$/.exec(plain(full));
    if (count) {
      const n = document.createElement('span');
      n.className = 'count';
      n.textContent = Number(count[1]).toLocaleString();
      row.append(n);
    }
    outs.append(row);
  }
  if (keys.length > SHOWN) {
    const more = document.createElement('span');
    more.className = 'out';
    more.textContent = `+${keys.length - SHOWN} more (${here.length} of ${keys.length} in this case)`;
    outs.append(more);
  }
  node.append(title, outs);
  const settings = NODE_SETTINGS[at];
  if (settings) node.append(settingsBox(settings, names));
  return node;
}

/** The settings rows of a card. Live rules mirror the typelab panel's field: one place holds what is turned. */
function settingsBox(settings, names) {
  const box = document.createElement('div');
  box.className = 'chain-sets';
  for (const setting of settings) {
    const row = document.createElement('label');
    row.className = 'chain-set';
    row.dataset.ui = `chain-set-${setting.rule ?? setting.key}`;
    const k = document.createElement('span');
    k.className = 'k';
    const field = setting.rule && benchFields?.get(setting.rule);
    k.textContent = field?.rule.label ?? setting.key;
    row.append(k);
    // After the field's own handler has copied the value into the rule list (a bubbling listener runs after the
    // target's): tabs 4 and 5 preview the new setting (plan D3).
    if (field) row.addEventListener('change', () => scheduleTiltPreview());
    if (field && field.rule.choices) {
      // A mode is a dropdown of its described choices; empty means the engine's own default.
      const input = document.createElement('select');
      input.append(new Option('default', ''));
      for (const [value, label] of field.rule.choices) input.append(new Option(label, value));
      input.value = field.input.value;
      input.addEventListener('change', () => { field.input.value = input.value; });
      input.dataset.ui = `chain-input-${setting.rule}`;
      row.append(input);
      row.dataset.tipTitle = field.rule.label;
      row.dataset.tip = `${field.rule.says} Press Apply and run again to use it.`;
    } else if (field && field.rule.type === 'flag') {
      // A yes/no rule is a dropdown that says what it means, not a bare checkbox (owner: "anything that is
      // not a number should be a dropdown"). It mirrors the panel's checkbox, which Apply reads.
      const input = document.createElement('select');
      input.append(new Option('no (standard)', 'no'), new Option('yes', 'yes'));
      input.value = field.input.checked ? 'yes' : 'no';
      input.addEventListener('change', () => { field.input.checked = input.value === 'yes'; });
      input.dataset.ui = `chain-input-${setting.rule}`;
      row.append(input);
      row.dataset.tipTitle = field.rule.label;
      row.dataset.tip = `${field.rule.says} Press Apply and run again to use it. Read in: ${setting.why}`;
    } else if (field) {
      const input = document.createElement('input');
      input.type = 'number';
      input.step = 'any';
      input.min = '0';
      // Empty means the engine's own value, said as a value: "auto (45)", never a word that looks typed.
      const fallback = RULES[setting.rule];
      input.placeholder = fallback === undefined ? 'auto' : `auto (${fallback})`;
      input.value = field.input.value;
      input.addEventListener('input', () => { field.input.value = input.value; });
      input.dataset.ui = `chain-input-${setting.rule}`;
      row.append(input);
      row.dataset.tipTitle = field.rule.label;
      row.dataset.tip = `${field.rule.says} Empty uses the engine's own value. Press Apply and run again to use it. Read in: ${setting.why}`;
    } else {
      const v = document.createElement('span');
      v.className = 'v';
      v.textContent = setting.read ? String(setting.read(names, RULES))
        : (RULES[setting.rule] === undefined ? 'engine default' : String(RULES[setting.rule]));
      row.append(v);
      row.dataset.tipTitle = setting.key;
      row.dataset.tip = setting.why ?? 'An engine constant: no rule reaches it.';
    }
    box.append(row);
  }
  return box;
}

/** The print-angle search: the range auto-detection searches, and how its degrees are measured. */
/** An id from a full name: lower-case letters, digits and dashes; '' when the name has none (a Japanese name, say). */
function idOfName(name) {
  return name.normalize('NFKD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 40);
}

/**
 * THE NEW-TYPE STRIP (owner, 2026-11-22: "badge set by user, with full name in drop down; category set by app to choose
 * from"). One place, above the stage tabs, that says which type is being made and how far it has got: category (the
 * app's list; the folder decides which one runs), full name, id, badge, and the steps in order with each one marked
 * from what actually happened - named, run, saved - never guessed. Stages 2-4 are optional edits, so they are links.
 */
function drawTypeStrip() {
  const strip = document.getElementById('type-strip');
  if (!strip) return;
  strip.textContent = '';
  const save = (key, value) => { try { localStorage.setItem(key, value); } catch { /* per-viewer only */ } };
  const field = (label, ui, input, tip) => {
    const row = Object.assign(document.createElement('label'), { className: 'type-field' });
    row.dataset.tipTitle = label;
    row.dataset.tip = tip;
    input.dataset.ui = ui;
    row.append(Object.assign(document.createElement('span'), { className: 'k', textContent: label }), input);
    return row;
  };
  const category = document.createElement('select');
  for (const [value, label] of TYPE_CATEGORIES) {
    // The folder on screen was run as one category; a type of another needs a folder of those scans.
    const option = Object.assign(document.createElement('option'), { value, textContent: label, selected: value === kindNow, disabled: value !== kindNow });
    if (value !== kindNow) option.title = `This folder was run as ${kindNow === 'denture' ? 'dentures' : 'aligners'}: open a folder of ${label.toLowerCase()} scans to make a ${label.toLowerCase()} type.`;
    category.append(option);
  }
  const fullName = Object.assign(document.createElement('input'), { type: 'text', value: typeFullName, maxLength: 60, placeholder: 'Soft denture', spellcheck: false });
  const id = Object.assign(document.createElement('input'), { type: 'text', value: typeName, spellcheck: false, className: 'type-id' });
  const badge = Object.assign(document.createElement('input'), { type: 'text', value: typeBadge, maxLength: 5, placeholder: 'G', spellcheck: false, className: 'type-badge-input' });
  fullName.addEventListener('input', () => {
    typeFullName = fullName.value;
    save('review-type-full-name', typeFullName);
    // The id follows the name until it is typed by hand; a name with no Latin letters keeps the id there was.
    const derived = idOfName(typeFullName);
    if (!typeIdTyped && derived) { typeName = derived; id.value = derived; save('review-type-id', typeName); }
  });
  fullName.addEventListener('change', () => drawTypeStrip());
  id.addEventListener('change', () => { typeName = id.value.trim(); typeIdTyped = true; save('review-type-id', typeName); drawTypeStrip(); });
  badge.addEventListener('change', () => { typeBadge = badge.value.trim(); save('review-type-badge', typeBadge); drawTypeStrip(); });
  const newType = Object.assign(document.createElement('button'), { type: 'button', textContent: 'New type', className: 'type-new' });
  newType.dataset.ui = 'type-new';
  newType.title = 'Start a new type from the built-in one: opens the built-in as it is and clears the name, id and badge. The type you were editing keeps its unsaved edits.';
  newType.addEventListener('click', () => {
    // In a session: the built-in opens as it is (the type left keeps its unsaved edits as its draft). On a review
    // folder: Discard, as before. Either way the name, id and badge are then cleared for the new type.
    if (inSessionNow()) { if (!openBuiltInFresh()) return; } else document.getElementById('bench-reset')?.click();
    typeFullName = ''; typeName = ''; typeBadge = ''; typeIdTyped = false;
    for (const key of ['review-type-full-name', 'review-type-id', 'review-type-badge']) save(key, '');
    if (lastChain) drawChain(...lastChain);
    drawTypeStrip();
    document.querySelector('[data-ui="type-full-name"]')?.focus();
  });
  const fields = Object.assign(document.createElement('div'), { className: 'type-fields' });
  fields.append(
    Object.assign(document.createElement('b'), { className: 'type-title', textContent: 'Type' }),
    field('category', 'type-category', category, 'What the type is for - the app\'s list. The folder on screen decides which one runs.'),
    field('name', 'type-full-name', fullName, 'The full name the app shows in its type list, one line, up to 60 characters.'),
    field('id', 'type-name', id, 'The file name: lower-case letters, digits, dots and dashes. Follows the name until you type it yourself. Save type writes a new dated file, types/<category>/<id>.<date-time>.type.json.'),
    field('badge', 'type-badge', badge, 'Up to 5 characters, no spaces: shown beside the name in the app\'s type list. Empty = the app\'s default badge.'),
    // What the strip's type comes from: the opened type itself, or - with another id - a NEW type based on it.
    Object.assign(document.createElement('span'), { className: 'type-based', textContent: basedOnWords() }),
    newType,
  );
  // The steps, in order, each marked from what happened.
  // A valid id is enough: with no full name the type is named after its id (typeInForce typeNameOf), and asking for one
  // here left Apply and Save working but never ticked (Fable, 2026-11-23).
  const named = /^[a-z0-9][a-z0-9.-]*$/.test(typeName);
  const marks = stripMarks();
  const ran = named && marks.ran;
  const saved = ran && marks.saved;
  const steps = Object.assign(document.createElement('ol'), { className: 'type-steps' });
  steps.dataset.ui = 'type-steps';
  const current = !named ? 'name' : !ran ? 'apply' : !saved ? 'save' : null;
  for (const [key, label, done, stage] of [
    ['name', 'Name it', named, null], ['orient', '1 Orient', false, 'orient'], ['rim', '2 Rim', false, 'rim'], ['zones', '3 Zones', false, 'zones'],
    ['support', '4 Settings', false, 'support'], ['angle', '5 Print angle', false, 'angle'], ['apply', 'Apply and run', ran, null], ['save', 'Save type', saved, null],
  ]) {
    const step = document.createElement('li');
    step.dataset.ui = `type-step-${key}`;
    step.className = `${done ? 'done' : ''}${current === key ? ' now' : ''}`.trim();
    if (stage && kindNow === 'denture') {
      // Optional edits: a link to the stage, not a box to tick.
      const go = Object.assign(document.createElement('button'), { type: 'button', textContent: label, className: 'type-step-link' });
      go.addEventListener('click', () => { stageNow = stage; save('review-stage', stage); if (lastChain) drawChain(...lastChain); });
      step.append(go);
    } else if (!stage) {
      step.textContent = `${done ? '✓ ' : ''}${label}`;
    } else {
      continue; // an aligner run has no editable stages yet
    }
    steps.append(step);
  }
  strip.append(fields, steps);
  if (kindNow === 'aligner') {
    // An aligner run has no editable stages yet: say what an aligner type can change today, so the missing links read as
    // a fact rather than a fault. (The app loads aligner types since 2026-11-23, docs/TYPE-PIPELINE.md section 8a.)
    strip.append(Object.assign(document.createElement('p'), { className: 'type-note',
      textContent: 'An aligner type carries its own name and badge; its numbers are the built-in aligner\'s until the aligner stages become editable.' }));
  }
}

/**
 * The restore mark (docs/WORKBENCH-TABS-PLAN.md section 4): one small button beside an edited value that puts back
 * its standard value and says which. The caller shows it only while the value differs. The canvas nodes draw the

 */
function restoreMark(standard, onRestore) {
  const button = Object.assign(document.createElement('button'), { type: 'button', className: 'restore-mark', textContent: '↺', title: `Restore to ${standard}` });
  button.dataset.ui = 'restore-mark';
