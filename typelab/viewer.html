function facts(c) {
  // A denture reads only the rows that apply to it; the aligner-only rows (arch, cross-checks, gaps, edge
  // coverage, support crossings) would show "not oriented" and similar in red for a case that has none.
  const DENTURE_ROWS = ['Kind', 'Shape check', 'Result', 'Safety check', 'Islands not resolved', 'Unresolved islands', 'Islands resolved', 'Islands outside the allowed area', 'Print angle', 'Up decision', 'Tips by source', 'Unsupportable tips', 'Tips placed', 'Tips left out', 'Left-out reasons', 'Scan clean-up', 'Time (s)',
    'Rim plane', 'Rim note', 'Peel: largest layer, ours (mm²)', 'Peel: largest layer, owner (mm²)', 'Peel: layers where ours is >10% above owner', 'Most tips on one support tree', 'Trunk area / neck area', 'Owner contacts', 'Owner contacts, median distance to displayed model (mm)', 'Owner area covered %', 'Our area outside owner %'];
  const verdict = c.result !== 'built' ? `Not built${c.reason ? ` - ${c.reason}` : ''}`
    : c.needsLook ? `Built - needs a look${c.reason ? `: ${c.reason}` : ''}` : 'Built - nothing flagged';
  const rows = [
    ['Verdict', verdict, c.result !== 'built' || Boolean(c.needsLook)],
    ['Kind', c.kind || 'aligner', !!c.shapeNote],
    ['Shape check', c.shapeNote || 'ok', !!c.shapeNote],
    ['Result', c.result, c.result !== 'built'],
    ['Safety check', c.verdict || '-', c.verdict && c.verdict !== 'clear'],
    ['Supports crossing the aligner', c.crossings, c.crossings > 0],
    ['Crossings not judged', c.uncertain, c.uncertain > 0],
    // Denture: the engine island report (the amber marks and these rows are the same list). Aligner: the generate island check.
    ...(c.kind === 'denture' ? [
      ['Islands not resolved', c.islandsUnresolved, c.islandsUnresolved > 0],
      ['Unresolved islands', c.unresolvedIslands || '-', c.islandsUnresolved > 0],
      ['Islands resolved', c.islandsResolved ?? '-', false],
      ['Islands outside the allowed area', c.islandsOutsideArea, false],
    ] : [
      ['Low points with no support', c.islandsUnresolved, c.islandsUnresolved > 0],
      ['Low points outside the area', c.islandsOutsideArea, false],
    ]),
    ['Print angle', printAngleText(c), false],
    // Step 1 (orientation by the trim): how the arch was read and whether the floor rule agrees on up/down.
    ['Arch', c.archKind === 'open' ? 'open arch (trim decided)' : c.archKind === 'ring' ? 'ring (floor rule decided)' : c.archKind == null ? '-' : 'not oriented', c.archKind === ''],
    ['Up/down cross-check', c.upCrossCheck || (c.upCrossCheck == null ? '-' : 'none'), c.upCrossCheck === 'disagrees'],
    ['Floor offset ratio', c.floorOffsetRatio ?? '-', false],
    ['Scan clean-up', c.cleanedDegenerateTriangles ? `${c.cleanedDegenerateTriangles} collapsed triangle${c.cleanedDegenerateTriangles === 1 ? '' : 's'} removed` : 'none needed', false],
    ['Structures left out', c.structuresLeftOut || 'none', false],
    ['Tips placed', c.tipsPlaced, false],
    ['Tips left out', c.tipsLeftOut, false],
    ['Largest gap, outer edge (mm)', c.outerGapMm ?? '-', false],
    ['Largest gap, opening (mm)', c.openingGapMm ?? '-', false],
    ['Edge coverage needs review', c.rimNeedsReview ? 'yes' : 'no', c.rimNeedsReview],
    ['Time (s)', c.seconds, false],
  ];
  // Denture only: the owner's contacts (with the mapping check) and the area comparison; '-' when the scan has no contacts file.
  if (c.kind === 'denture') rows.push(
    ['Up decision', c.upDecision || '-', false],
    ['Tips by source', c.tipsBySource || '-', false],
    ['Suction and drain', c.traps || 'none found', false],
    ['Unsupportable tips', c.unsupportableTips ?? '-', false],
    ['Left-out reasons', c.tipsLeftOutReasons || '-', false],
    ['Peel: largest layer, ours (mm²)', c.peelMaxOurs == null ? (c.peelNote || '-') : `${c.peelMaxOurs} at ${c.peelMaxOursAtMm} mm (above the raft${c.peelRaftTopMm ? `, top ${c.peelRaftTopMm} mm` : ''})`, false],
    ['Peel: largest layer, owner (mm²)', c.peelMaxOwner == null ? '-' : `${c.peelMaxOwner} at ${c.peelMaxOwnerAtMm} mm`, false],
    ['Peel: layers where ours is >10% above owner', c.peelLayersOver ?? '-', c.peelLayersOver > 0],
    ['Most tips on one support tree', c.maxTipsPerTrunk ?? 'n/a', false],
    ['Trunk area / neck area', c.trunkToNeckArea ?? 'n/a', false],
    ['Owner contacts', c.ownerContacts ?? '-', false],
    ['Rim plane', (c.rimPlane ?? c.middlePlane) || '-', false],
    // The rim asked for and not used (a drawn rim, or the flat area's edge): red, because the run fell back silently otherwise.
    ['Rim note', c.rimNote || 'the rim asked for was used', Boolean(c.rimNote)],
    ['Owner contacts, median distance to displayed model (mm)', c.ownerContactsMedianMm ?? '-', c.ownerContactsMedianMm != null && c.ownerContactsMedianMm > 1],
    ['Owner area covered %', c.ownerAreaCoveredPct ?? '-', false],
    ['Our area outside owner %', c.outsideOwnerAreaPct ?? '-', false],
  );
  if (c.reason) rows.push(['Why it needs a look', c.reason, true]);
  // The long explanation (plain-words reason, orientation note) is the hover text of the Result and Reason rows.
  const explanation = [c.reason ? explain(c) : '', c.orientationNote ?? ''].filter(Boolean).join(' ');
  const FACT_HELP = {
    'Result': explanation, 'Why it needs a look': explanation, 'Verdict': explanation, 'Print angle': c.angleReason || 'The print tilt the build chose.',
    'Unresolved islands': 'Lowest points of regions that start mid-air that no built tip serves, with height, size and reason.',
    'Left-out reasons': 'Why tips were not built, with counts.', 'Up decision': 'How the teeth-top side was decided.',
  };
  const factRows = c.kind === 'denture' ? rows.filter(([k]) => DENTURE_ROWS.includes(k) || k === 'Why it needs a look' || k === 'Verdict') : rows;
  const byName = new Map(factRows.map((row) => [row[0], row]));
  const used = new Set();
  const line = ([k, v, bad]) => {
    used.add(k);
    const dt = document.createElement('dt'); dt.textContent = FACT_SHORT[k] ?? k;
    dt.dataset.tipTitle = k;
    if (FACT_HELP[k] || FACT_SHORT[k]) dt.dataset.tip = FACT_HELP[k] || k;
    else delete dt.dataset.tipTitle;
    const dd = document.createElement('dd'); dd.textContent = String(v ?? '-'); if (bad) dd.className = 'bad';
    dd.dataset.ui = `review-fact-${k.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '')}`;
    if (k === 'Left-out reasons') dd.dataset.ui = 'review-fact-left-out-reasons';
    if (k === 'Unresolved islands') dd.dataset.ui = 'review-fact-unresolved-islands';
    return [dt, dd];
  };
  const groupBlock = (id, title, names) => {
    const mine = names.filter((n) => byName.has(n)).map((n) => byName.get(n));
    if (mine.length === 0) return [];
    const list = document.createElement('dl');
    list.className = 'fact-list';
    list.dataset.ui = `review-facts-list-${id}`;
    list.append(...mine.flatMap(line));
    const group = collapsible(id, title, [], [list], `review-facts-${id}`, factOpen);
    group.classList.add('fact-group');
    // Counts belong to the layer groups only.
    group.querySelector('.count').remove();
    return [group];
  };
  const groups = FACT_GROUPS.flatMap(([id, title, , names]) => groupBlock(id, title, names));
  const rest = factRows.map(([k]) => k).filter((k) => !used.has(k));
  document.getElementById('facts').replaceChildren(...groups, ...groupBlock('more', 'More', rest));
  document.getElementById('source').textContent = c.source ?? '';
  drawTilt(c);
  drawPeel(c);
  loadOrientFile(c);
  loadZonesFile(c);
}

/*
 * THE ZONES TAB'S CASE FILE (plan D2, written by reviewCase.ts): every zone-graph node's value per face, for the
 * per-node preview. Loaded per case; the overlay is rebuilt for the node still selected.
 */
async function loadZonesFile(c) {
  zonesRead = null;
  // A live preview belongs to one case's scan: a new case (or a run's result) drops it and asks again if still edited.
  livePreview = null;
  livePending = false;
  if (c.kind === 'denture' && c.zonesFile) {
    const meta = await fetch(urlOf(c.zonesFile)).then((r) => (r.ok ? r.json() : null)).catch(() => null);
    const bin = meta ? await fetch(urlOf(meta.bin)).then((r) => (r.ok ? r.arrayBuffer() : null)).catch(() => null) : null;
    if (caseNow !== c && caseNow?.case !== c.case) return;
    if (meta && bin && bin.byteLength === meta.ids.length * meta.faces) zonesRead = { ids: meta.ids, faces: meta.faces, values: new Uint8Array(bin) };
  }
  scheduleZonePreview();
}

/** The overlay for the selected node, or none: the zone layers come back when nothing is selected or off the Zones tab. */
/**
 * After a Zones edit, ask the server for a live preview of the canvas (plan D3) - debounced, so a burst of edits asks
 * once. Only for a served denture review, only for a graph that differs from the run and validates; an answer for an
 * older canvas, or another case, is dropped.
 */
async function scheduleZonePreview() {
  clearTimeout(livePreviewTimer);
  previewLib ??= await import('./zonePreview.mjs');
  if (!reviewServed || kindNow !== 'denture' || !caseNow?.source || !graphLib) { showZonePreview(); return; }
  const ran = ranZoneGraphJson ? graphLib.upgradeGraph(ranZoneGraphJson) : graphLib.defaultGraph();
  // A width-only edit on 2 Rim previews too (Fable: keyed on the graph AND the widths); a belt covering nothing is not sent.
  const unchanged = previewLib.sameGraph(ran, zoneGraph) && graphLib.sameBelts(ranPlacement, placementEdits);
  const refused = graphLib.validate(zoneGraph).problems.length > 0 || graphLib.RIM_STRIP_IDS.some((id) => graphLib.beltProblem(placementEdits, id));
  if (unchanged || refused) { livePending = false; showZonePreview(); return; }
  livePending = true;
  showZonePreview();
  livePreviewTimer = setTimeout(async () => {
    const seq = ++livePreviewSeq;
    const graph = zoneGraph;
    const belts = graphLib.beltEdits(placementEdits);
    const c = caseNow;
    const fail = (why) => { if (seq !== livePreviewSeq) return; livePending = false; zonePreviewNote.hidden = false; zonePreviewNote.textContent = `The live preview did not run: ${why}. Apply and run to see the edit.`; };
    try {
      const reply = await fetch('/zone-preview', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ source: c.source, zoneGraph: graph, placement: belts }) });
      const answer = await reply.json().catch(() => ({}));
      if (seq !== livePreviewSeq || caseNow !== c) return;
      if (!reply.ok || !answer.ok) { if (reply.status !== 409) fail(refusalReason(answer.log) ?? answer.error ?? reply.status); return; }
      const bin = await fetch(answer.bin).then((r) => (r.ok ? r.arrayBuffer() : null)).catch(() => null);
      if (seq !== livePreviewSeq || caseNow !== c) return;
      if (!bin || bin.byteLength !== answer.ids.length * answer.faces) { fail('its values did not arrive whole'); return; }
      livePending = false;
      livePreview = { graph, belts, read: { ids: answer.ids, faces: answer.faces, values: new Uint8Array(bin) }, seconds: answer.seconds };
      showZonePreview();
    } catch (error) {
      fail(error.message);
    }
  }, 800);
}

/*
 * THE TABS 4 AND 5 LIVE PREVIEW (plan D3, serve.mjs POST /tilt-preview, tiltPreviewRun.ts, words in tiltPreview.mjs).
 * A setting changed on tab 4 or a search number on tab 5 (or the strip widths, or a canvas) asks the engine for the
 * print-angle search with the page's settings and the tips at the angle it picks - no build, about 7 s. Tab 4 draws
 * those tips on the model, coloured by their path to the plate, with the run's own tips and pillars hidden; tab 5 shows
 * the pick and every angle tried. Only while the page differs from what the run on screen used (`ranTiltKey`, reset by
 * Apply): a preview of what already ran would hide the built supports for nothing.
 */
/** What a preview is asked with - the same edits Apply sends - and its key; the key alone when nothing is edited. */
function tiltAsk() {
  const rules = benchRulesNow();
  const pose = kindNow === 'denture' ? poseEdits : {};
  const placement = kindNow === 'denture' ? placementEdits : {};
  const zone = graphLib && zoneGraph && !graphLib.isDefault(zoneGraph) ? zoneGraph : null;
  const orient = kindNow === 'denture' && orientLib && orientGraph && !orientLib.isDefault(orientGraph) ? orientGraph : null;
  const key = JSON.stringify({ rules, pose, placement, zone, orient });
  return { key, ask: { rules, pose, placement, zoneGraph: zone, orientGraph: orient } };
}

/** Ask for a preview of the page's settings, debounced; drop it when the page matches the run or cannot preview. */
async function scheduleTiltPreview() {
  clearTimeout(tiltTimer);
  tiltLib ??= await import('./tiltPreview.mjs');
  const { key, ask } = tiltAsk();
  ranTiltKey ??= JSON.stringify({ rules: {}, pose: {}, placement: {}, zone: null, orient: null });
  // In a session the run on screen used the opened type (or the applied draft), not the standard: while the editors
  // hold exactly that, there is nothing to preview - a saved type's own numbers are not an edit. (The session's names
  // are declared further down the script, hence the guard.)
  const inSession = inSessionNow();
  const asRun = inSession && !editsNotRun();
  const wanted = reviewServed && kindNow === 'denture' && caseNow?.source && (stageNow === 'support' || stageNow === 'angle') && (inSession ? !asRun : key !== ranTiltKey);
  // The search cannot run on numbers tab 5 already refuses; its own note says why.
  if (!wanted || searchProblem(searchNow())) {
    tiltPending = false;
    if (key === ranTiltKey || asRun) { tiltLive = null; tiltError = null; }
    showTiltPreview();
    return;
  }
  if (tiltLive?.key === key && tiltLive.case === caseNow) { showTiltPreview(); return; }
  tiltPending = true;
  showTiltPreview();
  tiltTimer = setTimeout(async () => {
    const seq = ++tiltSeq;
    const c = caseNow;
    try {
      const reply = await fetch('/tilt-preview', { method: 'POST', headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ source: c.source, ...ask, frame: orientRead?.frame ?? null }) });
      const answer = await reply.json().catch(() => ({}));
      if (seq !== tiltSeq || caseNow !== c) return;
      if (reply.status === 409) return;
      tiltPending = false;
      if (!reply.ok || !answer.ok) { tiltError = answer.error ?? `answer ${reply.status}`; tiltLive = null; }
      else { tiltError = null; tiltLive = { key, case: c, result: answer }; }
    } catch (error) {
      if (seq !== tiltSeq) return;
      tiltPending = false;
      tiltError = error.message;
    }
    showTiltPreview();
  }, 800);
}

/** The preview, if it is of the page as it is now and of this case. A declaration, so searchCard may call it early. */
function tiltNow() {
  return tiltLive && tiltLive.case === caseNow && tiltLive.key === tiltAsk().key ? tiltLive.result : null;
}

/** Draws the preview's tips (tab 4) and writes the note (tabs 4 and 5); the search card reads `tiltNow()` itself. */
function showTiltPreview() {
  if (tiltOverlay) { tiltOverlay.parent?.remove(tiltOverlay); tiltOverlay.traverse((o) => { o.geometry?.dispose(); o.material?.dispose?.(); }); tiltOverlay = null; }
  const onTab = kindNow === 'denture' && (stageNow === 'support' || stageNow === 'angle');
  const result = tiltNow();
  tiltPreviewNote.hidden = !onTab || !(result || tiltPending || tiltError);
  if (!tiltPreviewNote.hidden && tiltLib) {
    tiltPreviewNote.textContent = tiltError && !tiltPending
      ? `The live preview did not run: ${tiltError}. Apply and run to see the settings.`
      : `${tiltLib.tiltPreviewNote(result, { tab: stageNow, ranDeg: caseNow?.printAngleDeg ?? null, pending: tiltPending })}${result ? ` (${result.seconds} s)` : ''}`;
  }
  if (stageNow === 'angle' && lastChain && !tiltRedrawing) { tiltRedrawing = true; drawChain(...lastChain); tiltRedrawing = false; }
  if (onTab && stageNow === 'support' && result?.kind === 'scan' && result.tips && model && tiltLib) {
    tiltOverlay = new THREE.Group();
    tiltOverlay.name = 'tilt-preview-tips';
    const ball = new THREE.SphereGeometry(0.45, 10, 8);
    for (const [state, { token }] of Object.entries(tiltLib.TIP_STATES)) {
      const tips = result.tips.filter((t) => (state === 'unknown' ? !(t.state in tiltLib.TIP_STATES) || t.state === 'unknown' : t.state === state));
      if (tips.length === 0) continue;
      const mesh = new THREE.InstancedMesh(ball, new THREE.MeshBasicMaterial({ color: cssToken(token) }), tips.length);
      const at = new THREE.Matrix4();
      tips.forEach((t, k) => mesh.setMatrixAt(k, at.makeTranslation(t.position[0], t.position[1], t.position[2])));
      tiltOverlay.add(mesh);
    }
    // In the GLB's own space, like the side labels: the model's matrix carries the tips with it.
    model.add(tiltOverlay);
  }
  applyVisibility();
}

let previewTicket = 0;
async function showZonePreview() {
  // A ticket, as show() uses: two calls racing across the first import (or a case change) must not both build an
  // overlay, or one is orphaned on the model (Fable's review).
  const ticket = ++previewTicket;
  if (zoneOverlay) { zoneOverlay.parent?.remove(zoneOverlay); zoneOverlay.traverse((o) => { o.geometry?.dispose(); o.material?.dispose?.(); }); zoneOverlay = null; }
  isolatedKeys = null;
  previewLib ??= await import('./zonePreview.mjs');
  if (ticket !== previewTicket) return;
  const ran = graphLib ? (ranZoneGraphJson ? graphLib.upgradeGraph(ranZoneGraphJson) : graphLib.defaultGraph()) : null;
  // Edited = the canvas OR the Rim tab's belt widths differ from the run on screen (the widths change the belts' faces).
  const beltsNow = graphLib ? graphLib.beltEdits(placementEdits) : {};
  const edited = Boolean(graphLib && (!previewLib.sameGraph(ran, zoneGraph) || !graphLib.sameBelts(ranPlacement, placementEdits)));
  // THE LIVE PREVIEW (plan D3): when the page differs from the run and a preview of THIS graph and THESE widths has come
  // back, the values are the preview's (keyed on both, or an old width's preview would pass for current - Fable); and
  // with nothing selected on Zones the final Zone is shown, so an edit shows its effect at once.
  const live = edited && livePreview && previewLib.sameGraph(livePreview.graph, zoneGraph) && JSON.stringify(livePreview.belts) === JSON.stringify(beltsNow) ? livePreview : null;
  const read = live ? live.read : zonesRead;
  // THE RIM TAB (owner 2026-11-24: "rim tab needed to have live preview in 3d"): its selected node is shown by the
  // zone-graph node it stands for (rimTabTarget) - the same values, the same overlay.
  const onRim = stageNow === 'rim';
  // The rim plane and the crossing are drawn by the run, not by the zone graph: selecting one isolates its layers.
  const rimLayers = onRim && kindNow === 'denture' && graphLib ? graphLib.RIM_TAB_LAYERS[rimSelected] : null;
  if (rimLayers) {
    isolatedKeys = rimLayers;
    zonePreviewNote.hidden = false;
    zonePreviewNote.textContent = `${rimSelected === 'CROSSING' ? 'The rim crossing (the oral cavity ray origin) on the rim and symmetry planes' : 'The rim plane'}, as the run on screen fitted it. It comes from the finished rim, so a Rim setting change shows after Apply and run. Click the empty canvas to see everything again.`;
    applyVisibility();
    return;
  }
  const picked = onRim ? (rimSelected && graphLib ? graphLib.rimTabTarget(rimSelected, zoneGraph) : null) : zoneSelected;
  const shownId = picked ?? (live && !onRim ? zoneGraph.outputs?.zone : null);
  const active = shownId && (stageNow === 'zones' || onRim) && kindNow === 'denture' && graphLib;
  zonePreviewNote.hidden = !active && !(edited && livePending && (stageNow === 'zones' || onRim));
  if (!active) {
    if (!zonePreviewNote.hidden) zonePreviewNote.textContent = onRim ? 'Previewing your edit on the model… select a node to see it.' : 'Previewing your edit on the model (zones only, nothing is built)…';
    applyVisibility();
    return;
  }
  const node = zoneGraph?.nodes.find((n) => n.id === shownId);
  const title = node ? (graphLib.wordsOf(node, zoneGraph)?.title ?? node.kind) : shownId;
  const gives = graphLib.KINDS[node?.kind]?.out;
  if (gives === 'rim') {
    // The Rim line gives a line, not faces: the run's own line layer is shown, alone on the model. A changed Rim setting
    // is not previewed - the line is found in the run - and the note says so.
    isolatedKeys = ['DENTURE', 'Dental rim (continuous'];
    const rimEdited = !previewLib.sameGraph(ran, zoneGraph);
    zonePreviewNote.textContent = `The rim line, as the run on screen found it (the thick line). Only it is shown on the model; click the empty canvas to see everything again.${rimEdited ? ' Your Rim setting changes show after Apply and run.' : ''}`;
    applyVisibility();
    return;
  }
  const values = previewLib.nodeValues(read, shownId);
  const groups = values && (gives === 'mask' || gives === 'zone') ? previewLib.previewGroups(values, gives === 'zone') : null;
  // The model: the GLB's denture mesh, written with the engine's own face order (reviewCase.ts), so face k is face k.
  let base = null;
  model?.traverse((o) => { if (!base && o.isMesh && keyOf(o.name) === 'DENTURE') base = o; });
  const index = base?.geometry.index;
  const drawn = Boolean(groups && index && index.count / 3 === read.faces);
  // A rim belt (on 2 Rim, or its node on Zones) is shown with the rim line it grows from, in the line's own colour, so
  // which side the belt leans to can be seen (owner 2026-11-25). Its faces glow in --node-marks, the line is --layer-rim-edge.
  const beltPicked = Boolean(picked) && graphLib.RIM_STRIP_IDS.includes(onRim ? rimSelected : picked);
  const note = previewLib.previewNote({ title, groups, hasRead: Boolean(read), canvasChanged: edited && !live, gives, drawn, final: !picked, rimLine: beltPicked });
  zonePreviewNote.textContent = live
    ? `Live preview of your edit (zones only - nothing is built until Apply; the belt widths on 2 Rim; ${live.seconds} s). ${note}`
    : edited && livePending ? `${note} Previewing your edit…` : note;
  if (!drawn) { applyVisibility(); return; }
  zoneOverlay = new THREE.Group();
  // A SELECTED face set (a strip, a ray, a combine) glows and has its outline drawn (owner 2026-11-23: "glow it so we
  // know which is the selected node's strip"); the final zone and a Mark keep their steady three colours.
  const glows = Boolean(picked) && gives === 'mask';
  const glowing = [];
  for (const group of groups) {
    if (group.faces.length === 0) continue;
    const ix = new Uint32Array(group.faces.length * 3);
    group.faces.forEach((f, k) => { ix[k * 3] = index.getX(f * 3); ix[k * 3 + 1] = index.getX(f * 3 + 1); ix[k * 3 + 2] = index.getX(f * 3 + 2); });
    const geometry = new THREE.BufferGeometry();
    geometry.setAttribute('position', base.geometry.getAttribute('position'));
    geometry.setIndex(new THREE.BufferAttribute(ix, 1));
    // Drawn just in front of the model (polygon offset), so the tint sits on the surface it describes.
    // depthWrite off for the glowing tint: it sits in front of the surface (polygon offset), and writing its depth would
    // hide the outline below, which is drawn at the surface's own depth.
    const material = new THREE.MeshBasicMaterial({ color: cssToken(group.token), side: THREE.DoubleSide, polygonOffset: true, polygonOffsetFactor: -2, polygonOffsetUnits: -2, transparent: glows, depthWrite: !glows });
    zoneOverlay.add(new THREE.Mesh(geometry, material));
    if (glows) {
      glowing.push(material);
      // The set's outline, bold and steady, so its edge reads even at the dim end of the glow.
      const outline = new THREE.BufferGeometry();
      outline.setAttribute('position', base.geometry.getAttribute('position'));
      outline.setIndex(new THREE.BufferAttribute(previewLib.boundaryEdges(index.array, group.faces), 1));
      // Depth-tested (owner 2026-11-24: "the preview should not see through the model"): it drew with depthTest off,
      // so the belt's far side showed through the part. The outline lies on the model's own vertices, so it passes the
      // depth test where its face is visible and is hidden where the part is in front of it.
      zoneOverlay.add(new THREE.LineSegments(outline, new THREE.LineBasicMaterial({ color: cssToken('--ink') })));
    }
  }
  zoneOverlay.userData.glow = glowing;
  base.add(zoneOverlay);
  if (picked) isolatedKeys = beltPicked ? ['DENTURE', 'Dental rim (continuous'] : ['DENTURE'];
  applyVisibility();
}

/*
 * THE ORIENT TAB'S CASE FILE (WORKBENCH-TABS-PLAN B3, written by reviewCase.ts): each Orient node's readout lines
 * ("how sure was it") and the six named sides of the FINAL orientation. The side names are drawn on the 3D view on
 * every tab - Front, Back, Teeth side, Tissue side, Left, Right - so every later tab can refer to them. Positions are in
 * the review file's own space; the model's world matrix carries them wherever the view puts the model.
 */
async function loadOrientFile(c) {
  const data = c.kind === 'denture' && c.orientFile ? await fetch(urlOf(c.orientFile)).then((r) => (r.ok ? r.json() : null)).catch(() => null) : null;
  if (caseNow !== c && caseNow?.case !== c.case) return;
  orientRead = data;
  for (const label of sideLabels) label.el.remove();
  sideLabels = (data?.sides ?? []).map((side) => {
    const el = Object.assign(document.createElement('div'), { className: 'marker-label side-label', textContent: side.name });

/**
 * Run scan `k` of the session with the session's type, unless it has a result or is under way. A STOPPED or FAILED
 * scan stays so until asked: `force` true (its card's Run / Retry) re-runs either, 'stopped' (Run all) only a stopped
 * one. Without that, opening a stopped scan started it again at once - Stop undid itself (Fable, 2026-11-26).
 */
async function runScan(k, force = false, use = null) {
  const source = session.scans[k];
  // `use`: another type to run this scan with (the compare's); by default what is shown.
  const id = sessionLib.resultId(source, use ? draftLib.runPrint(use.type) : sessionPrint());
  const now = sessionLib.stateOf(session, id).state;
  if (now === 'done' || now === 'running' || now === 'queued' || (now === 'failed' && force !== true) || (now === 'stopped' && !force)) return;
  const asked = session;
  const type = use ?? (flipped && compareEntry ? compareEntry : { type: sessionRunType(), builtIn: sessionType.builtIn && !applied.has(sessionType.id) });
  session.results.set(id, { state: 'queued', since: Date.now() });
  drawSession();
  pollJobs();
  const reply = await fetch('/run', { method: 'POST', body: JSON.stringify({ kind: session.kind, source, type: type.type, builtIn: type.builtIn, label: id }) })
    .then((r) => r.json()).catch((error) => ({ error: `the server did not answer: ${error.message}` }));
  let result;
  if (reply.ok) {
    const summary = await fetch(`${reply.url}summary.json`).then((r) => r.json()).catch(() => null);
    // (A run that did not apply its type's graph never gets here: the server answers it as failed - serve.mjs, notApplied.)
    result = summary ? { state: 'done', url: reply.url, summary } : { state: 'failed', error: 'the run finished but its summary could not be read' };
  } else result = reply.stopped ? { state: 'stopped' } : { state: 'failed', error: reply.error ?? 'no reason given', log: reply.log };
  if (asked !== session) return; // a new import replaced this session while it ran
  session.results.set(id, result);
  drawSession();
  refreshCacheSize();
}
/** Which of this session's runs the server is running and which wait (GET /jobs), while any is under way. */
let jobsTimer = 0;
async function pollJobs() {
  clearTimeout(jobsTimer);
  if (!session) return;
  const pending = [...session.results.entries()].filter(([, r]) => r.state === 'queued' || r.state === 'running');
  if (pending.length === 0) return;
  const { jobs = [] } = await fetch('/jobs').then((r) => r.json()).catch(() => ({}));
  for (const [id, run] of pending) {
    const job = jobs.find((j) => j.label === id);
    if (job?.state === 'running' && run.state !== 'running') session.results.set(id, { state: 'running', since: job.startedAt ?? Date.now(), key: job.key });
    else if (job) session.results.set(id, { ...run, key: job.key });
  }
  redrawSessionState();
  jobsTimer = setTimeout(pollJobs, 1000);
}
/** Stop every run of this session that waits or goes. */
async function stopSession() {
  const { jobs = [] } = await fetch('/jobs').then((r) => r.json()).catch(() => ({}));
  const mine = jobs.filter((j) => session?.results.has(j.label));
  await Promise.all(mine.map((j) => fetch('/run-stop', { method: 'POST', body: JSON.stringify({ key: j.key }) })));
}
async function refreshCacheSize() {
  const size = await fetch('/cache-size').then((r) => r.json()).catch(() => null);
  const label = document.getElementById('cache-size');

  document.getElementById('cache-clear').hidden = !size || size.runs === 0;

/** Import the scans at `path` (a folder or one scan file) - or every path in `paths` - as a new session of the chosen category. */
async function importFrom(path, paths) {

/**
 * A session of `kind` on the imported scans (`read`, the /import answer), on the type picked before for this category,
 * else its built-in. `carry` (a review folder becoming a session) opens THE BUILT-IN with the editors' values as they
 * stand as its draft: on a review folder the editors hold edits measured against the built-in - the folder's own type
 * is never loaded into them - so carrying them onto a saved type would wipe what that type pinned (Fable,
 * 2026-11-26). `at` is the scan to show first.
 */
function startSession(kind, read, { carry = false, onBuiltIn = false, at = null } = {}) {
  keepDraft(); // the session being left keeps its unsaved edits
  session = sessionLib.newSession({ kind, scans: read.cases });
  kindNow = kind;
  const types = sessionTypes();
  const builtIn = types.find((t) => t.builtIn) ?? types[0];
  // `onBuiltIn`: a review folder's session opens on the built-in whether its edits are carried or the built-in's kept
  // edits are chosen instead - the dialog named the built-in, so another type must not open.
  sessionType = carry || onBuiltIn ? builtIn : types.find((t) => t.id === sessionType?.id) ?? builtIn;
  if (carry) {
    // A draft needs an id; a review folder may have none typed. Then the built-in's own id, name and badge: nothing was
    // named, so nothing is renamed (a blank name became the id, and an untouched folder kept a renamed "draft"). Its
    // edits stay read-only until they get their own id, which Apply and Save then say - the same as in any session.
    if (!/^[a-z0-9][a-z0-9.-]*$/.test(typeName)) {
      typeName = sessionType.id;
      typeFullName = sessionType.name;
      typeBadge = sessionType.type.badge ?? '';
    }
    const carried = draftFromEditors();
    openTypeInEditors(carried, sessionType, sessionType.stamp);
    keepDraft();

  for (const id of ['type-pick', 'run-all']) document.getElementById(id).hidden = false;
  drawTypePick();

  // in the stage's note it was wiped by the first model to load, so the skipped files were never seen.
  session.words = `${read.words}${read.truncated ? ' (stopped at 5000 files)' : ''}`;

/*
 * A REVIEW FOLDER'S SCANS AS A SESSION (2026-11-26, the owner's "complete still open": the review folder's older Apply
 * and Save are retired). A batch folder is the RECORD of a run and still opens to be looked at. Trying an edit on it
 * now opens its scans - the files the run read, where they still are, never copied - as a scan session, with the type
 * the run used when that type is saved (else the built-in), and the editors' values carried over as that type's
 * draft, so nothing edited on the folder is lost. From there Apply and Save go the one way every session goes (/run,
 * /save-draft). Answers { error } when it could not, else { carried }: false when the person chose the built-in's kept
 * edits over the folder's, so the caller stops rather than run what they did not ask for.
 */
async function sessionFromReview() {
  const sources = [...new Set(cases.map((c) => c.source).filter(Boolean))];
  if (sources.length === 0) return { error: 'this review folder does not say which scans it ran' };
  const read = await fetch('/import', { method: 'POST', body: JSON.stringify({ paths: sources }) }).then((r) => r.json()).catch((error) => ({ error: error.message }));
  if (read.error) return { error: `its scans could not be opened: ${read.error}` };
  if (read.cases.length === 0) return { error: `none of its scans can run: ${read.words}` };
  if (!(await loadCatalog())) return { error: 'the type list could not be read' };
  // The scan that was on screen stays on screen (the server answers resolved Windows paths; the summary may not).
  const plainPath = (p) => p.replace(/\\/g, '/').toLowerCase();
  const at = caseNow?.source ? read.cases.find((c) => plainPath(c) === plainPath(caseNow.source)) ?? null : null;
  // An unsaved draft already kept for the built-in would be replaced by this carry: the person decides, never silently.
  const builtIn = (catalogNow?.types ?? []).find((t) => t.builtIn && t.category === kindNow);
  const kept = builtIn && drafts.get(draftKey(builtIn));
  const carry = !kept || window.confirm(`There are unsaved edits kept for a new type based on ${builtIn.name} ("${kept.profile?.name?.en ?? kept.id}"). Replace them with this folder's edits? Cancel opens the kept edits instead, and this folder's edits are dropped.`);
  startSession(kindNow, read, { carry, onBuiltIn: true, at });
  return { carried: carry };
}

    // A REVIEW FOLDER runs nothing itself (its piecemeal re-run is retired): its scans open as a session with the
    // editors' values as a draft (sessionFromReview), and the Apply below runs that draft like any session's. An
    // Orient edit's own auto-run never makes that move unasked: its status line says Apply does.
    const fromFolder = !session;
    if (fromFolder) {
      if (auto) return; // autoRunOrient waits for a session; a timer left from one that closed does nothing
      status.textContent = 'Opening this folder\'s scans as a session with your edits…';
      const moved = await sessionFromReview();
      if (moved.error) { status.textContent = `Not applied: ${moved.error}.`; return; }
      // The person chose the kept edits over the folder's: open them, run nothing they did not ask for.
      if (!moved.carried) { status.textContent = `This folder's scans are open as a session with the kept edits of ${sessionType.name}; this folder's edits were dropped. Apply runs them.`; return; }
    }
    const graphEdited = Boolean(graphLib && zoneGraph && !graphLib.isDefault(zoneGraph));
    // The Orient canvas (U6): a denture's only, like the search - an aligner reads no Orient graph in this version.
    const orientEdited = Boolean(kindNow === 'denture' && orientLib && orientGraph && !orientLib.isDefault(orientGraph));
    // The Rim tab's strip widths are a DENTURE type's (the strip says an aligner type keeps the built-in aligner's
    // numbers), and they persist in localStorage - so a denture session's leftovers must not refuse an aligner run.
    const placementNow = kindNow === 'denture' ? placementEdits : {};
    // Only a denture run carries the search (poseNow above): a denture session's bad leftovers refused an aligner run
    // with "Fix the search first", a tab the aligner strip does not link to (Fable, 2026-11-23).
    const poseProblem = kindNow === 'denture' ? searchProblem(searchNow()) : null;
    if (poseProblem) { status.textContent = `Fix the search first (5 Print angle): ${poseProblem}.`; return; }
    const widthProblem = [...Object.entries(placementNow).map(([key, value]) => graphLib?.widthProblem(key, value)),
      ...['RIMBAND', 'LOWRIMBAND'].map((id) => graphLib?.beltProblem(placementNow, id))].find(Boolean);
    if (widthProblem) { status.textContent = `Fix the rim first (2 Rim): ${widthProblem}.`; return; }
    if (!/^[a-z0-9][a-z0-9.-]*$/.test(typeName)) { status.textContent = 'The type id (the Type strip above the stages) is lower-case letters, digits, dots and dashes.'; return; }
    const graphProblems = graphEdited ? graphLib.validate(zoneGraph).problems : [];
    if (graphProblems.length) { status.textContent = `Fix the zone graph first (3 Zones): ${graphProblems[0]}`; return; }
    const orientProblems = orientEdited ? orientLib.validate(orientGraph).problems : [];
    if (orientProblems.length) { status.textContent = `Fix the Orient graph first (1 Orient): ${orientProblems[0]}`; return; }
    // Apply runs the WHOLE draft - the opened type with the editors' values - on the scan on screen, through the
    // session's own runs (kept, two at a time; reviewer overhaul step 8). Nothing changed is said first: refusing an
    // untouched built-in as "read-only" answered an edit nobody made. A built-in is read-only: its edits become a new
    // type, which needs its own id.
    const draft = draftFromEditors();
    if (draftLib.runPrint(draft) === draftLib.runPrint(sessionRunType())) {
      // Just moved from a review folder with nothing edited: the scans run with the type as it is (they are running).
      status.textContent = fromFolder ? `This folder's scans are open as a session with ${sessionType.name}, and run as you open them (or Run all). Edit, then Apply to try your changes.`
        : 'Nothing to run: the scans already show these settings. A new name or badge alone needs no run - Save keeps it.';
      return;
    }
    if (sessionType.builtIn && typeName.trim() === sessionType.id) {
      status.textContent = `${sessionType.name} is built in and read-only: give the new type its own id and name in the Type strip above the stages (or press Duplicate), then Apply - it becomes a new type based on ${sessionType.name}.`;
      return;
    }
    applied.set(sessionType.id, draft);
    flipped = false; // show what was just applied, not the compared type
    keepDraft();
    status.textContent = `Applied to ${draft.profile?.name?.en ?? draft.id}: the scan on screen runs with your edits - the banner on the stage shows its progress. Other scans run when you open them, or with Run all. Not saved yet.`;
    drawSession();
    if (lastChain) drawChain(...lastChain); // the Type strip ticks Apply
  };
  run.addEventListener('click', () => applyNow());
  applyRun = applyNow;

  // FOLDED INTO THE STAGES (owner, 2026-11-20: "wouldn't it be more organized if folded into nodes?").
  // Every rule this panel listed now sits on the node that reads it, so showing the list too was a
  // second copy of the same controls. The list stays in the DOM, hidden, because it is where the
  // values are HELD and Apply reads them - the nodes mirror it - and only the run button, the note and
  // the status move up beside the stage tabs.
  if (reviewServed) {
    const slot = document.getElementById('stage-run');
    slot.append(document.getElementById('bench-note'), document.querySelector('.bench-actions'), status);
    slot.hidden = false;
  }
} catch (error) {
  // No server, or the rules module is not served: leave the panel hidden rather than showing a dead button.
  console.info('typelab panel not available:', error.message);
}
</script>
</body>
</html>
