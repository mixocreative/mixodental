function searchCard() {
  const s = searchNow();
  const node = document.createElement('div');
  node.className = 'chain-node search';
  node.dataset.ui = 'chain-node-print-angle';
  const title = document.createElement('span');
  title.className = 'n';
  title.textContent = 'Print-angle search';
  const fig = document.createElement('div');
  fig.className = 'deg-figure';
  // Drawn from the numbers, not a picture of them: the plate, upright (0), the search's end, and the
  // angle this case picked. Leaning RIGHT here is "teeth side further up" (denture/pose.rs:13-17).
  const ray = (deg, len) => {
    const r = (deg * Math.PI) / 180;
    return [60 + len * Math.sin(r), 112 - len * Math.cos(r)].map((n) => n.toFixed(1));
  };
  const [ex, ey] = ray(s.endDeg, 92);
  const [ax0, ay0] = ray(s.startDeg, 44);
  const [ax1, ay1] = ray(s.endDeg, 44);
  const picked = caseNow?.printAngleDeg;
  const [px, py] = ray(picked ?? 0, 92);
  // Owner 2026-11-24: "print angle search node should also mark front and back just so we are clear". The side on the
  // plate and the side on top, as the run's Orient named them (the standard: Back on the plate, Front on top); none for
  // the flat-base recipe, which names no sides.
  const sides = sidePreviewLib?.sideChoices(ranOrientGraphJson ?? orientLib?.defaultGraph());
  const OTHER = { back: 'front', front: 'back', teeth: 'tissue', tissue: 'teeth', left: 'right', right: 'left' };
  const sideMarks = sides
    // The top name sits LEFT of the upright line, out of the way of the lean lines that fan out to its right.
    ? `<text x="55" y="34" text-anchor="end" class="side">${sidePreviewLib.SIDE_LABELS[OTHER[sides.plate]]}</text><text x="8" y="125" class="side">${sidePreviewLib.SIDE_LABELS[sides.plate]} on the plate</text>`
    : '';
  fig.innerHTML = `<svg viewBox="0 0 260 128" role="img" aria-label="Print angle: 0 degrees upright, search to ${s.endDeg} degrees${picked == null ? '' : `, picked ${picked} degrees`}">`
    + '<line x1="8" y1="112" x2="252" y2="112" class="plate"/><text x="160" y="125">build plate</text>'
    + `<line x1="60" y1="112" x2="60" y2="16" class="up"/><text x="48" y="12">0°</text>${sideMarks}`
    + (s.startDeg > 0 ? (() => { const [sx, sy] = ray(s.startDeg, 92); return `<line x1="60" y1="112" x2="${sx}" y2="${sy}" class="up"/><text x="${Number(sx) + 4}" y="${sy}">${s.startDeg}°</text>`; })() : '')
    + `<line x1="60" y1="112" x2="${ex}" y2="${ey}" class="up"/><text x="${Number(ex) + 4}" y="${ey}">${s.endDeg}°</text>`
    + `<path d="M${ax0} ${ay0} A44 44 0 0 1 ${ax1} ${ay1}" class="arc"/>`
    + (picked == null ? '' : `<line x1="60" y1="112" x2="${px}" y2="${py}" class="lean"/><text x="${Number(px) + 6}" y="${Number(py) + 14}" class="picked">picked ${picked}°</text>`)
    + '</svg>';
  const how = document.createElement('p');
  how.className = 'deg-how';
  // Fable read this from denture/upright.rs:25 and pose.rs:1-17; verified there 2026-11-20.
  how.textContent = '0° is the denture standing upright on the open ends of the U, front of the arch on top. Each degree leans it back so the teeth side faces further up.';
  const box = document.createElement('div');
  box.className = 'chain-sets';
  // The type's name and badge moved to the New-type strip above the stage tabs (drawTypeStrip).
  // The search: real fields now that the engine takes a type's numbers (engine 70).
  const defaults = graphLib?.PRINT_ANGLE_SEARCH ?? { startDeg: 0, endDeg: 45, stepDeg: 2, marginDeg: 2 };
  for (const [key, label, field, why] of POSE_FIELDS) {
    const row = document.createElement('label');
    row.className = 'chain-set';
    row.dataset.tipTitle = label;
    row.dataset.tip = `${why} Built-in: ${defaults[field]}°.`;
    const input = Object.assign(document.createElement('input'), { type: 'number', step: 'any', min: '0', max: '90', value: String(s[field]) });
    input.dataset.ui = `pose-${key}`;
    input.addEventListener('change', () => {
      const value = Number(input.value);
      if (input.value === '' || value === defaults[field]) delete poseEdits[key];
      else poseEdits[key] = value;
      try { localStorage.setItem('review-pose', JSON.stringify(poseEdits)); } catch { /* per-viewer only */ }
      if (lastChain) drawChain(...lastChain);
      scheduleTiltPreview();
    });
    row.append(Object.assign(document.createElement('span'), { className: 'k', textContent: `${label} (°)${poseEdits[key] !== undefined ? ' · edited' : ''}` }), input);
    // Restore goes to what the opened type SAVED (owner, 2026-11-25), the built-in's when it saved none.
    const savedPose = savedBaseline?.pose?.[key];
    if (poseEdits[key] !== savedPose) {
      row.append(restoreMark(savedPose === undefined ? `the built-in ${defaults[field]}°` : `${savedPose}° (saved in ${savedBaseline.name})`, () => {
        if (savedPose === undefined) delete poseEdits[key]; else poseEdits[key] = savedPose;
        try { localStorage.setItem('review-pose', JSON.stringify(poseEdits)); } catch { /* per-viewer only */ }
        if (lastChain) drawChain(...lastChain);
        scheduleTiltPreview();
      }));
    }
    box.append(row);
  }
  const pickedRow = document.createElement('div');
  pickedRow.className = 'chain-set';
  pickedRow.dataset.tipTitle = 'picked';
  pickedRow.dataset.tip = `What the search chose for this case${caseNow?.stableBand ? `, stable over ${caseNow.stableBand}` : ''}. It keeps the best lean by an ORDERED preference: safety tiers, then fewest boxed-in lowest points, then fewest lows outside the allowed area, THEN the smallest overhang area (denture/tilt.rs:16-19).`;
  pickedRow.innerHTML = '<span class="k">picked</span><span class="v"></span>';
  pickedRow.querySelector('.v').textContent = caseNow?.printAngleDeg == null ? '-' : `${caseNow.printAngleDeg}°`;
  box.append(pickedRow);
  // The live preview (plan D3): the pick the page's settings give, and every angle the search tried with them.
  const live = tiltNow();
  if (live?.kind === 'scan') {
    const previewRow = document.createElement('div');
    previewRow.className = 'chain-set';
    previewRow.dataset.ui = 'search-preview-pick';
    previewRow.dataset.tipTitle = 'preview';
    previewRow.dataset.tip = 'What the search picks with the settings on this page, before Apply. No support is built for it.';
    previewRow.innerHTML = '<span class="k">preview</span><span class="v"></span>';
    previewRow.querySelector('.v').textContent = `${live.pickedDeg}°${live.band ? `, stable ${live.band[0]}-${live.band[1]}°` : ''}`;
    const angles = document.createElement('div');
    angles.className = 'chain-none';
    angles.dataset.ui = 'search-preview-angles';
    angles.textContent = `Angles tried: ${live.rows.map((r) => `${r.tiltDeg}° ${r.failed.length ? `fails ${r.failed.join(', ')}` : r.robust ? 'robust' : 'passes'}`).join(' · ')}`;
    box.append(previewRow, angles);
  }
  const problem = searchProblem(s);
  const note = document.createElement('div');
  note.className = problem ? 'chain-none bad' : 'chain-none';
  note.dataset.ui = 'search-note';
  note.textContent = problem
    ? `Fix the search first: ${problem}.`
    : 'Apply tries these angles on this folder. Save type keeps them, as the type named above, for next time. In the app the angle dial still fine-tunes or overrides it.';
  node.append(title, fig, how, box, note);
  return node;
}

/** The stage tabs and whichever stage is chosen. */
function drawChain(present, names) {
  lastChain = [present, names];
  // The model's pose depends on the stage (the Orient tab shows it at rest), and every stage change comes through here.
  turnModel();
  const section = document.getElementById('chain');
  const tabs = document.getElementById('stage-tabs');
  const body = document.getElementById('stage-body');
  if (!section || !tabs || !body) return;
  // The type being made sits above the stages for both kinds - only a served review can run or save one.
  const strip = document.getElementById('type-strip');
  if (strip) { strip.hidden = !reviewServed; if (reviewServed) drawTypeStrip(); }
  if (kindNow !== 'denture') {
    // An aligner run shows the aligner's LOCKED graph read-only (step 4.4c, docs/ORIENT-NODES.md section 10).
    section.hidden = !graphLib;
    // The canvas when the bundle loaded; the plain cards otherwise, so the aligner graph never vanishes.
    if (graphLib) { tabs.textContent = ''; body.textContent = ''; if (!drawRimCanvas(body, 'aligner')) drawAlignerGraph(body); }
    return;
  }
  section.hidden = false;
  tabs.textContent = '';
  STAGES.forEach((stage, k) => {
    if (k > 0) tabs.append(Object.assign(document.createElement('span'), { className: 'stage-arrow', textContent: '→' }));
    const tab = document.createElement('button');
    tab.type = 'button';
    tab.className = 'stage-tab';
    tab.textContent = stage.title;
    tab.dataset.ui = `stage-tab-${stage.id}`;
    tab.setAttribute('aria-pressed', String(stageNow === stage.id));
    tab.addEventListener('click', () => {
      stageNow = stage.id;
      try { localStorage.setItem('review-stage', stageNow); } catch { /* per-viewer convenience only */ }
      // Only what this tab and the earlier ones produce (the owner's preview rule): the step walk's cut-off.
      setStep(stage.cut);
      drawChain(present, names);
      // The per-node overlay belongs to the Zones and Rim tabs only.
      showZonePreview();
      // Tabs 4 and 5 preview the page's settings (plan D3); off them their tips come down.
      scheduleTiltPreview();
    });
    tabs.append(tab);
  });
  body.textContent = '';
  const stage = STAGES.find((s) => s.id === stageNow) ?? STAGES.find((s) => s.id === 'zones');
  if (stage.id === 'zones') { drawZoneEditor(body, present, names); return; }
  // ORIENT AND RIM SHOW THEIR STEPS AS NODES on the canvas below, so the step cards only repeated them and took the
  // room (owner 2026-11-23: "do we still need these, or combine it with the canvas"). What the cards still told you -
  // which colour in 3D is which - stays as one line of swatches; the tab itself already cuts the 3D to its steps.
  // Without the canvas bundle the cards come back, so the tab is never empty.
  const hasCanvas = stage.id === 'orient' ? Boolean(orientLib && editorLib) : stage.id === 'rim' ? Boolean(graphLib && editorLib?.mountRimCanvas) : false;
  // The key rides in the canvas's own toolbar row, not a row of its own (owner 2026-11-23: "combine with the bottom
  // canvas so there's more space").
  if (hasCanvas) {
    if (stage.id === 'orient') drawOrientEditor(body, colourKey(stage, present));
    else drawRimCanvas(body, 'denture', colourKey(stage, present));
    return;
  }
  const rail = document.createElement('div');
  rail.className = 'chain-rail';
  rail.dataset.ui = `stage-rail-${stage.id}`;
  const cards = stage.steps.map((at) => chainCard(at, present, names));
  if (stage.id === 'angle') cards.push(searchCard());
  cards.forEach((card, k) => {
    if (k > 0) rail.append(Object.assign(document.createElement('span'), { className: 'chain-link', textContent: '>' }));
    rail.append(card);
  });
  body.append(rail);
  if (stage.id === 'support' || stage.id === 'angle') body.append(tiltPreviewNote);
  if (stage.id === 'orient') drawOrientEditor(body);
  if (stage.id === 'rim') drawRimCanvas(body, 'denture');
}

/**
 * Stage 1's Orient graph, editable (U6): which face goes to the plate and which way is up. The standard setup is
 * today's denture Step 1; "Flat-base recipe" is the owner's new kind's (ruling 1, 2026-11-23): the largest flat area
 * set on the plate. Every rule lives in `orientGraph.mjs`; this only draws it and keeps it.
 */
/*
 * DUPLICATE, COPY, PASTE on a node canvas (reviewer overhaul step 13; the rules are nodeClip.mjs, reached through the
 * canvas's own library): the Zones and the Orient toolbars each get these four buttons from here. They act on EVERY
 * selected node (Shift-click adds one, Shift-drag draws a box), or on the selection with its inputs as a wired group.
 * The clip outlives a switch of type, so nodes copy ACROSS types; a wire to a node not copied arrives empty and is
 * named, never re-routed; a selected node that may not be copied is named, not dropped silently.
 * A copy lands BELOW where its originals stood, by the group's own height and one card more, so a group keeps its
 * shape and stays clear of them - without positions every pasted node stacked in the middle of the view, and a 40 px
 * shift left the copies covering their originals (the Orient cards are wider than that by far; seen 2026-11-26).
 */
const PASTE_GAP = 320; // about one card's height on either canvas, in canvas units
function nodeTools({ canvas, ui, lib, graph, category, summary, save, positions, setPositions }) {
  const tell = (text) => { toolNotes[canvas] = text; summary.textContent = text; };
  const named = (ids) => ids.join(', ');
  const leftOut = (left) => (left?.length ? ` Not copied: ${left.join('; ')}.` : '');
  const selected = () => {
    const ids = canvasSelection[canvas].filter((id) => graph.nodes.some((n) => n.id === id));
    if (!ids.length) throw new Error('select a node on the canvas first (Shift-click or Shift-drag for several)');
    return ids;
  };
  const placeBeside = (done, at) => {
    const next = { ...(positions() ?? {}) };
    const ys = Object.keys(done.ids).filter((old) => at?.[old]).map((old) => at[old].y);
    const down = ys.length ? Math.max(...ys) - Math.min(...ys) + PASTE_GAP : 0;
    for (const [old, fresh] of Object.entries(done.ids)) if (at?.[old]) next[fresh] = { x: at[old].x, y: at[old].y + down };
    setPositions(next);
  };
  const button = (label, key, title, run) => {
    const b = Object.assign(document.createElement('button'), { type: 'button', textContent: label, title });
    b.dataset.ui = `${ui}-${key}`;
    b.addEventListener('click', () => { try { run(); } catch (error) { tell(`Not done: ${error.message}`); } });
    return b;
  };
  const copy = (withInputs) => () => {
    const clip = lib.copyNodes(graph, selected(), { category, withInputs });
    const at = Object.fromEntries(clip.nodes.filter((n) => positions()?.[n.id]).map((n) => [n.id, positions()[n.id]]));
    nodeClips[canvas] = { ...clip, at };
    tell(`Copied ${named(clip.nodes.map((n) => n.id))}${withInputs ? ' with their inputs' : ''}. Paste here, or after picking another type.${leftOut(clip.left)}`);
    paste.disabled = false;
  };
  const duplicate = button('Duplicate', 'duplicate', 'A copy of every selected node beside it, reading what it reads.', () => {
    const done = lib.duplicateNodes(graph, selected(), { category });
    placeBeside(done, positions());
    tell(`Duplicated ${named(Object.keys(done.ids))} as ${named(Object.values(done.ids))}.${leftOut(done.left)}`);
    save(done.graph);
  });
  const copyOne = button('Copy', 'copy', 'Copy the selected nodes, to paste here or into another type.', copy(false));
  const copyGroup = button('Copy with inputs', 'copy-group', 'Copy the selected nodes and every node feeding them, as one wired group.', copy(true));
  const paste = button('Paste', 'paste', 'Add the copied nodes to this graph with fresh ids. A wire to a node that was not copied arrives empty.', () => {
    const clip = nodeClips[canvas];
    if (!clip) throw new Error('nothing is copied yet');
    const done = lib.pasteNodes(graph, clip, { category });
    placeBeside(done, clip.at);
    tell(`Pasted as ${named(Object.values(done.ids))}.${done.cut.length ? ` Empty, wire them: ${done.cut.join(', ')}.` : ''}`);
    save(done.graph);
  });
  paste.disabled = !nodeClips[canvas];
  return [duplicate, copyOne, copyGroup, paste];
}

function drawOrientEditor(body, key = null) {
  if (!orientLib || !editorLib) return;
  const g = orientGraph;
  const { problems } = orientLib.validate(g);
  const save = (next) => {
    orientGraph = next;
    try { localStorage.setItem('review-orient-graph', JSON.stringify(next)); } catch { /* per-viewer only */ }
    relabelSides();
    autoRunOrient(); // before the redraw, so the status line already says a run is coming
    if (lastChain) drawChain(...lastChain);
  };
  const status = document.createElement('div');
  status.className = orientLib.isDefault(g) ? 'zone-status default' : 'zone-status edited';
  status.dataset.ui = 'orient-status';
  const ran = ranOrientGraph === 'default' ? 'the standard Step 1' : `your Orient setup (${ranOrientGraph.slice(0, 8)})`;
  // Measured against what RAN, not against the standard: "changed - Apply" right after an Apply read as a dead button.
  status.textContent = ranThis(orientLib, g, ranOrientGraphJson)
    ? `Orient graph: ${ran} - the review on screen ran this.`
    // Only while a run is really queued: a canvas edited before a reload starts nothing until it is edited again.
    : !inSessionNow() ? `Orient graph: changed - Apply opens this folder's scans as a session and runs it there. The review on screen used ${ran}.`
    : autoRunTimer !== null ? `Orient graph: changed - it runs on its own in a moment (about 27 s). The review on screen used ${ran}.`
    : `Orient graph: changed - Apply and run again to use it. The review on screen used ${ran}.`;
  const bar = document.createElement('div');
  bar.className = 'zone-bar';
  const summary = document.createElement('span');
  summary.dataset.ui = 'orient-report';
  summary.className = problems.length ? 'zone-summary bad' : 'zone-summary ok';
  summary.textContent = problems.length === 0 ? 'All connections are complete.' : `${problems.length} to fix: ${problems[0]}`;
  if (toolNotes.orient) { summary.textContent = `${toolNotes.orient} ${summary.textContent}`; toolNotes.orient = ''; }
  const pick = document.createElement('select');
  pick.dataset.ui = 'orient-add-kind';
  for (const [groupKey, group] of Object.entries(orientLib.NODE_GROUPS)) {
    const optgroup = Object.assign(document.createElement('optgroup'), { label: group.title });
    for (const kind of Object.keys(orientLib.KINDS).filter((k) => orientLib.KIND_GROUP[k] === groupKey && !orientLib.NOT_IN_PALETTE.includes(k))) {
      optgroup.append(Object.assign(document.createElement('option'), { value: kind, textContent: orientLib.KIND_WORDS[kind].title, title: orientLib.KIND_WORDS[kind].says }));
    }
    pick.append(optgroup);
  }
  const add = Object.assign(document.createElement('button'), { type: 'button', textContent: 'Add node', title: 'Adds the chosen node in the middle of the view.' });
  add.dataset.ui = 'orient-add';
  add.addEventListener('click', () => save(orientLib.addNode(g, pick.value)));
  const flat = Object.assign(document.createElement('button'), { type: 'button', textContent: 'Flat-base recipe', title: 'Largest flat area -> Set as bottom: the base goes on the plate. Made for a model with a flat base.' });
  flat.dataset.ui = 'orient-flat-base';
  flat.addEventListener('click', () => { orientPositions = editorLib.autoLayout(orientLib.flatBaseGraph(), []); save(orientLib.flatBaseGraph()); });
  const reset = Object.assign(document.createElement('button'), { type: 'button', textContent: 'Back to standard Step 1', title: 'The canvas goes back to today\'s Step 1.' });
  reset.dataset.ui = 'orient-reset';
  reset.disabled = orientLib.isDefault(g);
  reset.addEventListener('click', () => { orientPositions = editorLib.autoLayout(orientLib.defaultGraph(), []); save(orientLib.defaultGraph()); });
  const copyTools = nodeTools({
    canvas: 'orient', ui: 'orient-node', lib: orientLib, graph: g, category: 'orient', summary, save,
    positions: () => orientPositions,
    setPositions: (next) => { orientPositions = next; try { localStorage.setItem('review-orient-layout', JSON.stringify(next)); } catch { /* per-viewer only */ } },
  });
  const tools = Object.assign(document.createElement('span'), { className: 'zone-tools-row' });
  tools.append(pick, add, ...copyTools, flat, reset);
  bar.append(summary, ...(key ? [key] : []), tools);
  const props = {
    lib: canvasLib(orientLib, savedBaseline?.orientGraph), graph: g, positions: orientPositions, liveParams: [], onGraph: save,
    onSelectMany: (ids) => { canvasSelection.orient = ids; },
    // What each step measured on the case on screen (B3): the readouts of the graph that RAN for it.
    values: orientRead?.lines ?? {},
    onPositions: (next) => {
      orientPositions = next;
      try { localStorage.setItem('review-orient-layout', JSON.stringify(next)); } catch { /* per-viewer only */ }
      orientHandle?.update({ ...props, positions: next });
    },
  };
  if (!orientPositions?.outputs) orientPositions = { ...editorLib.autoLayout(g, []), ...(orientPositions ?? {}) };
  props.positions = orientPositions;
  body.append(status, bar, orientRestNote, orientSideNote, orientCanvasHost);
  relabelSides();
  if (orientHandle) orientHandle.update(props);
  else orientHandle = editorLib.mountZoneEditor(orientCanvasHost, props);
}

/**
 * The rim tab as a node canvas (`nodeGraph.mjs` rimTabView / rimOutputLines, `nodeEditor/RimCanvas.tsx`): the rim and
 * the strips grown from it, with their settings (C3) and the Rim output card; the nodes computed from the finished rim
 * greyed with their reason. False when the bundle or the graph library did not load, so the caller can fall back to
 * plain cards.
 */
function drawRimCanvas(body, kind, key = null) {
  if (!graphLib || !editorLib?.mountRimCanvas) return false;
  const note = document.createElement('p');
  note.className = 'chain-note';
  note.dataset.ui = 'rim-canvas-note';
  note.textContent = kind === 'aligner'
    ? 'The aligner\'s steps as nodes. They are locked in this version: each stands for today\'s aligner code, and the settings that shape them are in the aligner profile. Greyed nodes need the finished rim.'
    : 'The rim and the strips grown from it, with their settings: change one and Apply and run to see it. The rim reads the final orientation of 1 Orient. Greyed nodes need the finished rim, so they appear here only for reference.';
  if (key) {
    const bar = Object.assign(document.createElement('div'), { className: 'zone-bar' });
    bar.append(note, key);
    body.append(bar, rimCanvasHost);
  } else {
    body.append(note, rimCanvasHost);
  }
  // standsOnFlatArea: the Orient canvas's pose is a Stand on the flat area, the only pose the flat edge can follow.
  const pose = orientGraph?.nodes?.find((n) => n.id === orientGraph.outputs?.pose);
  const ctx = { graph: zoneGraph, placement: placementEdits, ran: ranPlacement, standsOnFlatArea: pose?.kind === 'setBottom',
    ...(savedBaseline ? { saved: { graph: savedBaseline.zoneGraph, placement: savedBaseline.placement } } : {}) };
  // The denture's tab shows its selected node on the model (showZonePreview) with its note above the canvas.
  if (kind === 'denture') rimCanvasHost.before(zonePreviewNote);
  const onSelect = kind === 'denture' ? (id) => { if (id !== rimSelected) { rimSelected = id; showZonePreview(); } } : undefined;
  const props = { kind, view: graphLib.rimTabView(kind, ctx), output: graphLib.rimOutputLines(kind, ctx), onField: kind === 'denture' ? onRimField : undefined, onSelect };
  if (rimHandle) rimHandle.update(props);
  else rimHandle = editorLib.mountRimCanvas(rimCanvasHost, props);
  return true;
}

/**
 * One Rim tab field changed (C3). The Rim's settings go on the zone graph's RIM node - the one graph the engine reads,
 * drawn on two tabs - and a value equal to the standard is REMOVED rather than written, so an undone edit leaves the
 * standard graph standard. The strip widths go to `placementEdits`, the type's profile numbers sent with Apply.
 */
function onRimField(nodeId, field, value) {
  const back = value === null || String(value) === String(field.standard);
  if (field.target === 'graph') {
    zoneGraph = { ...zoneGraph, nodes: zoneGraph.nodes.map((n) => {
      if (n.id !== nodeId) return n;
      const { [field.key]: _old, ...rest } = n.params ?? {};
      return { ...n, params: back ? rest : { ...rest, [field.key]: value } };
    }) };
    try { localStorage.setItem('review-zone-graph', JSON.stringify(zoneGraph)); } catch { /* per-viewer only */ }
  } else {
    if (back) delete placementEdits[field.key];
    // A dropdown answers in text ("0", "1.5"); a profile number is a number, or the server drops it (RIM_PLACEMENT).
    else placementEdits[field.key] = field.choices ? Number(value) : value;
    try { localStorage.setItem('review-placement', JSON.stringify(placementEdits)); } catch { /* per-viewer only */ }
  }
  if (lastChain) drawChain(...lastChain);
  scheduleTiltPreview();
  // The belts' faces change with their widths: preview them on the model (the zone preview, keyed on the widths).
  scheduleZonePreview();
}

/**
 * The aligner's graph, read-only: today's aligner chain as locked nodes (`nodeGraph.mjs` alignerGraph). Nothing here
 * is a control - every node is fixed in this version, and a field that accepted an edit the engine refuses would be
 * a control that lies. Each card says what the step is, what it reads and which output it fills.
 */
function drawAlignerGraph(body) {
  const g = graphLib.alignerGraph();
  const note = document.createElement('p');
  note.className = 'chain-note';
  note.dataset.ui = 'aligner-graph-note';
  note.textContent = 'The aligner\'s steps as nodes, in the same shape as the denture\'s zone graph. They are locked in this version: each stands for today\'s aligner code. The settings that shape them are in the aligner profile.';
  const rail = document.createElement('div');
  rail.className = 'chain-rail';
  rail.dataset.ui = 'aligner-graph-nodes';
  g.nodes.forEach((n, k) => {
    const spec = graphLib.ALIGNER_KINDS[n.kind];
    if (k > 0) rail.append(Object.assign(document.createElement('span'), { className: 'chain-link', textContent: '>' }));
    const card = document.createElement('div');
    card.className = 'chain-node locked';
    card.dataset.ui = `aligner-node-${n.id}`;
    const title = Object.assign(document.createElement('span'), { className: 'n', textContent: spec.label });
    const lock = Object.assign(document.createElement('span'), { className: 'lock', textContent: 'locked' });
    const says = Object.assign(document.createElement('span'), { className: 'chain-none', textContent: spec.says });
    card.append(title, lock, says);
    const from = Object.values(n.inputs);
    if (from.length > 0) {
      const names = from.map((id) => graphLib.ALIGNER_KINDS[g.nodes.find((m) => m.id === id).kind].label);
      card.append(Object.assign(document.createElement('span'), { className: 'chain-none', textContent: `Reads: ${names.join(', ')}` }));
    }
    const fills = Object.entries(g.outputs).filter(([, id]) => id === n.id).map(([name]) => name.replace(/_/g, ' '));
    if (fills.length > 0) card.append(Object.assign(document.createElement('span'), { className: 'chain-none', textContent: `Output: ${fills.join(', ')}` }));
    rail.append(card);
  });
  body.append(note, rail);
}

/** Stage 2: the zone graph, editable. */
function drawZoneEditor(body, present, names) {
  if (!graphLib) {
    body.append(Object.assign(document.createElement('p'), { className: 'chain-none', textContent: 'The zone editor needs the review server (nodeGraph.mjs did not load).' }));
    return;
  }
  const g = zoneGraph;
  const { problems, warnings } = graphLib.validate(g);
  const idle = new Set(graphLib.unreached(g));
  const save = (next) => {
    // R1b's angle is the one zone parameter that runs today (rule noSupportSteepDeg). The canvas edits
    // the graph; this carries that one value on to the rule, so Apply re-runs with it.
    const live = benchFields?.get('noSupportSteepDeg');
    const deg = next.nodes.find((n) => n.id === 'R1b')?.params.deg;
    if (live && deg !== undefined) live.input.value = Number(deg) > 0 ? String(deg) : '';
    zoneGraph = next;
    try { localStorage.setItem('review-zone-graph', JSON.stringify(next)); } catch { /* per-viewer only */ }
    scheduleZonePreview();
    drawChain(present, names);
  };

  // Status: which of the two things the operator is looking at, every time - in one line, so the
  // canvas keeps the room (UX review 2026-11-20: seven rows of chrome above it hid its own controls).
  const status = document.createElement('div');
  status.className = graphLib.isDefault(g) ? 'zone-status default' : 'zone-status edited';
  status.dataset.ui = 'zone-status';
  // Two facts, both said every time: what the canvas holds, and what produced the review on screen.
  // They differ right after an edit, until Apply runs it - and that gap is exactly what must be visible.
  const ran = ranZoneGraph === 'default' ? 'the standard setup'
    : ranZoneGraph === 'unknown' ? 'a setup this folder does not record' : `your setup (${ranZoneGraph.slice(0, 8)})`;
  // F5: once this page has applied a graph, say whether the canvas still IS that graph.
  // Measured against what RAN (the summary's graph), as the Orient tab's: a folder that does not record it keeps the
  // old wording, since nothing on screen can say whether the canvas matches it.
  status.textContent = ranZoneGraph !== 'unknown' && ranThis(graphLib, g, ranZoneGraphJson)
    ? `Zone setup: ${ran} - the review on screen ran this.`
    : graphLib.isDefault(g) ? `Standard zone setup. The review on screen used ${ran}.`
    : `Your zone setup (changed) - Apply and run again to use it. The review on screen used ${ran}.`;

  // One toolbar: is it complete, the colour key, add a node, back to standard.
  const bar = document.createElement('div');
  bar.className = 'zone-bar';
  // Problems that name a node are drawn ON that node; only the rest (an output left empty) need words here.
  const onNodes = (m) => g.nodes.some((n) => m.startsWith(`${n.id}: `));
  const loose = problems.filter((m) => !onNodes(m));
  const summary = document.createElement('span');
  summary.dataset.ui = 'zone-report';
  summary.className = problems.length ? 'zone-summary bad' : 'zone-summary ok';
  summary.textContent = problems.length === 0 ? 'All connections are complete.'
    : `${problems.length} to fix${problems.length > loose.length ? ' - shown in red on the nodes' : ''}${loose.length ? `: ${loose[0]}` : ''}.`;
  // What the last Duplicate / Copy / Paste did: an edit redraws this bar, so its words are carried over once.
  if (toolNotes.zones) { summary.textContent = `${toolNotes.zones} ${summary.textContent}`; toolNotes.zones = ''; }
  const legend = document.createElement('span');
  legend.className = 'zone-legend';
  legend.dataset.ui = 'zone-legend';
  for (const [groupKey, group] of Object.entries(graphLib.NODE_GROUPS)) {
    if (groupKey === 'orient') continue; // not drawn on this canvas
    const key = Object.assign(document.createElement('span'), { textContent: group.title, title: group.says });
    key.style.setProperty('--zn-group', `var(${group.token})`);
    legend.append(key);
  }
  const pick = document.createElement('select');
  pick.dataset.ui = 'zone-add-kind';
  // Grouped like the canvas's coloured stripes, so the list reads in the same categories.
  for (const [groupKey, group] of Object.entries(graphLib.NODE_GROUPS)) {
    const kinds = Object.entries(graphLib.KINDS).filter(([kind, spec]) => spec.stage === 'zones' && graphLib.KIND_GROUP[kind] === groupKey && !graphLib.NOT_IN_PALETTE.includes(kind));
    if (kinds.length === 0) continue;
    const optgroup = Object.assign(document.createElement('optgroup'), { label: group.title });
    for (const [kind] of kinds) optgroup.append(Object.assign(document.createElement('option'), { value: kind, textContent: graphLib.KIND_WORDS[kind].title, title: graphLib.KIND_WORDS[kind].says }));
    pick.append(optgroup);
  }
  const add = Object.assign(document.createElement('button'), { type: 'button', textContent: 'Add node', title: 'Adds the chosen node in the middle of the view. Remove one by selecting it and pressing × or Delete.' });
  add.dataset.ui = 'zone-add';
  add.addEventListener('click', () => save(graphLib.addNode(g, pick.value)));
  const reset = Object.assign(document.createElement('button'), { type: 'button', textContent: 'Back to standard setup', title: 'Undo every zone edit: the canvas goes back to the standard setup.' });
  reset.dataset.ui = 'zone-reset';
  reset.disabled = graphLib.isDefault(g);
  reset.addEventListener('click', () => {
    zonePositions = editorLib ? editorLib.autoLayout(graphLib.defaultGraph(), graphLib.FIXED.outputs) : null;
    try { localStorage.removeItem('review-zone-layout-2'); } catch { /* per-viewer only */ }
    save(graphLib.defaultGraph());
  });
  // The session's category when one is open (its names are declared further down the script, hence the guard).
  const kindOfGraph = (() => { try { return session?.kind ?? kindNow; } catch { return kindNow; } })();
  const copyTools = nodeTools({
    canvas: 'zones', ui: 'node', lib: graphLib, graph: g, category: kindOfGraph, summary, save,
    positions: () => zonePositions,
    setPositions: (next) => { zonePositions = next; try { localStorage.setItem('review-zone-layout-2', JSON.stringify(next)); } catch { /* per-viewer only */ } },
  });
  const tools = Object.assign(document.createElement('span'), { className: 'zone-tools-row' });
  tools.append(pick, add, ...copyTools, reset);
  bar.append(summary, legend, tools);
  // Kept for the card editor fallback, which still lists every problem in words.
  const report = document.createElement('div');
  report.className = 'zone-report';
  for (const p of problems) report.append(Object.assign(document.createElement('div'), { className: 'bad', textContent: p }));
  for (const w of warnings) report.append(Object.assign(document.createElement('div'), { className: 'warn', textContent: w }));

  // The outputs the engine reads, by name - each one a choice of node.
  const outs = document.createElement('div');
  outs.className = 'zone-outs';
  outs.dataset.ui = 'zone-outputs';
  for (const [name, want] of Object.entries(graphLib.REQUIRED_OUTPUTS)) {
    const label = document.createElement('label');
    label.className = 'zone-out';
    label.dataset.tipTitle = graphLib.OUTPUT_WORDS[name].title;
    label.dataset.tip = `${graphLib.OUTPUT_WORDS[name].says} Needs ${graphLib.TYPE_WORDS[want] ?? want}; left empty, the run is refused.`;
    const sel = sourceSelect(g, want, g.outputs[name]);
    sel.dataset.ui = `zone-out-${name}`;
    sel.addEventListener('change', () => save(graphLib.bindOutput(g, name, sel.value || null)));
    label.append(Object.assign(document.createElement('span'), { className: 'k', textContent: graphLib.OUTPUT_WORDS[name].title }), sel);
    outs.append(label);
  }

  // The canvas: drag nodes, draw wires socket to socket, delete with Backspace. Outputs are nodes on
  // it, so the output row is only the fallback's.
  if (editorLib) {
    const props = {
      lib: canvasLib(graphLib, savedBaseline?.zoneGraph), graph: g, positions: zonePositions,
      liveParams: benchFields?.has('noSupportSteepDeg') ? ['R1b.deg'] : [],
      onGraph: save,
      // The selected node's values on the model (plan D2): the zone as it stands at that node.
      onSelect: (id) => { if (id !== zoneSelected) { zoneSelected = id; showZonePreview(); } },
      onSelectMany: (ids) => { canvasSelection.zones = ids; },
      onPositions: (next) => {
        zonePositions = next;
        try { localStorage.setItem('review-zone-layout-2', JSON.stringify(next)); } catch { /* per-viewer only */ }
        editorHandle?.update({ ...props, positions: next });
      },
    };
    // Only the output node is filled in here: a node ADDED from the toolbar is left unplaced, and the
    // canvas puts it in the middle of the view, where the operator is looking.
    if (!zonePositions.outputs) zonePositions = { ...editorLib.autoLayout(g, graphLib.FIXED.outputs), ...zonePositions };
    body.append(status, bar, zonePreviewNote, zoneCanvasHost);
    // An edit can change what the selected node means against the run: the note says so.
    if (zoneSelected) showZonePreview();
    if (editorHandle) editorHandle.update(props);
    else editorHandle = editorLib.mountZoneEditor(zoneCanvasHost, props);
    return;
  }

  // Fallback: the card editor, when the canvas bundle is not there.
  const rail = document.createElement('div');
  rail.className = 'chain-rail zone-rail';
  rail.dataset.ui = 'zone-nodes';
  g.nodes.forEach((n, k) => rail.append(zoneCard(g, n, k, idle, save)));

  body.append(status, bar, report, outs, rail);
}

/** A select of the nodes whose output fits `want` ('mask', or 'mask|rim'). */
function sourceSelect(g, want, current) {
  const sel = document.createElement('select');
  sel.append(Object.assign(document.createElement('option'), { value: '', textContent: '— none —' }));
  // A Mark's `under` is optional ("zone?"): the mark is not part of the type.
  const fits = graphLib.inputType(want).split('|');
  for (const n of g.nodes) {
    const out = graphLib.KINDS[n.kind]?.out;
    if (!fits.includes(out)) continue;
    sel.append(Object.assign(document.createElement('option'), { value: n.id, textContent: `${n.id} · ${graphLib.KINDS[n.kind].label}`, selected: n.id === current }));
  }
  return sel;
}

/** One zone node: kind, wires, parameters, remove, move. */
function zoneCard(g, n, k, idle, save) {
  const spec = graphLib.KINDS[n.kind];
  const card = document.createElement('div');
  card.className = `chain-node zone-node${idle.has(n.id) ? ' idle' : ''}${spec.fixed ? ' fixed' : ''}`;
  card.dataset.ui = `zone-node-${n.id}`;
  const head = document.createElement('div');
  head.className = 'zone-head';
  const title = document.createElement('span');
  title.className = 'n';
  const words = graphLib.wordsOf(n, g);
  title.textContent = `${words.title} · ${n.id}`;
  title.dataset.tipTitle = words.title;
  title.dataset.tip = `${words.says}${n.note ? ` — ${n.note}` : ''}`;
  head.append(title);
  const tools = document.createElement('span');
  tools.className = 'zone-tools';
  const mk = (txt, ui, tip, on, disabled = false) => {
    const b = Object.assign(document.createElement('button'), { type: 'button', textContent: txt, disabled });
    b.dataset.ui = ui;
    b.title = tip;
    b.addEventListener('click', on);
    return b;
  };
  const move = (dir) => {
    const nodes = [...g.nodes];
    const j = k + dir;
    if (j < 0 || j >= nodes.length) return;
    [nodes[k], nodes[j]] = [nodes[j], nodes[k]];
    save({ ...g, nodes });
  };
  tools.append(
    mk('◀', `zone-left-${n.id}`, 'Move left. This only changes where the card is drawn — what a zone means is set by its WIRES.', () => move(-1), k === 0),
    mk('▶', `zone-right-${n.id}`, 'Move right. Layout only; the wires decide the order of combination.', () => move(1), k === g.nodes.length - 1),
    mk('×', `zone-remove-${n.id}`, spec.fixed ? 'Found on an earlier tab — it cannot be removed here.' : 'Remove. Anything wired to it is left EMPTY and named in the report, never quietly re-routed.', () => save(graphLib.removeNode(g, n.id)), Boolean(spec.fixed)),
  );
  head.append(tools);
  card.append(head);
  if (idle.has(n.id)) card.append(Object.assign(document.createElement('div'), { className: 'chain-none', textContent: 'reaches no output — not evaluated, costs nothing' }));

  // Inputs: each a choice of wire. This IS the rearranging: which node feeds which side.
  for (const [name, want] of Object.entries(spec.inputs)) {
    const row = document.createElement('label');
    row.className = 'chain-set';
    row.dataset.tipTitle = `${n.id}.${name}`;
    row.dataset.tip = n.kind === 'subtract' ? (name === 'a' ? 'A, the minuend: the faces kept unless B holds them.' : 'B: the faces taken away from A.') : `Takes a ${want.replace('|', ' or ')}.`;
    const sel = sourceSelect(g, want, n.inputs[name]);
    sel.dataset.ui = `zone-in-${n.id}-${name}`;
    sel.addEventListener('change', () => save(graphLib.rewire(g, n.id, name, sel.value || null)));
    row.append(Object.assign(document.createElement('span'), { className: 'k', textContent: `in ${name}` }), sel);
    card.append(row);
  }
  // Parameters.
  for (const [key, value] of Object.entries(n.params)) {
    const row = document.createElement('label');
    row.className = 'chain-set';
    const numeric = typeof graphLib.KINDS[n.kind].params[key] === 'number';
    const words = graphLib.PARAM_WORDS[key] ?? { label: key, help: '' };
    // Anything that is not a number is a dropdown of the values the engine accepts - never free text.
    const input = document.createElement(numeric ? 'input' : 'select');
    if (numeric) Object.assign(input, { type: 'number', step: 'any' });
    else for (const [v, label] of words.choices ?? []) input.append(new Option(label, v));
    input.value = String(value);
    // Fixed in this version (graphLib.FIXED mirrors the engine): shown, never editable.
    const fixedHere = graphLib.fixedParam(n, key);
    input.disabled = fixedHere;
    input.dataset.ui = `zone-param-${n.id}-${key}`;
    // R1b's angle is the ONE zone parameter that already runs today, through the rule
    // noSupportSteepDeg. Its field mirrors the typelab panel, so turning it here and pressing Apply
    // actually re-runs the case - the only zone edit that does, until the engine takes a graph.
    const live = n.id === 'R1b' && key === 'deg' ? benchFields?.get('noSupportSteepDeg') : null;
    if (live) {
      input.value = live.input.value === '' ? String(value) : live.input.value;
      input.addEventListener('input', () => { live.input.value = input.value === '0' ? '' : input.value; });
    }
    // A dropdown hands back its choice's OWN value: a Mark's `seen` is true / false, and the engine refuses "true".
    const picked = () => (words.choices ?? []).find(([v]) => String(v) === input.value)?.[0] ?? input.value;
    input.addEventListener('change', () => save(graphLib.setParam(g, n.id, key, numeric ? Number(input.value) : picked())));
    row.title = fixedHere ? `${words.help} Fixed in this version: the engine does not read an edit yet.` : words.help;
    row.append(Object.assign(document.createElement('span'), { className: 'k', textContent: live ? `${words.label} · live` : words.label }), input);
    if (key === 'deg' && n.kind === 'parallelCast') {
      row.dataset.tipTitle = live ? 'deg · live (noSupportSteepDeg)' : 'deg';
      row.dataset.tip = `Degrees from the FROM axis toward the TOWARD axis. 0 = off. R1 is 45 from back toward tissue: direction = normalize(back·cos θ − top·sin θ) - it leans to TISSUE, not toward the teeth.${live ? ' LIVE: this one runs today - it mirrors the typelab rule noSupportSteepDeg, so press Apply in that panel to re-run. The engine reads only values strictly between 45 and 90 as on; typelab refuses the rest.' : ''}`;
    }
    card.append(row);
  }
  return card;
}

/**
 * The Type strip's "based on" words: in the scan session, the opened type - and, when the strip's id is another, that
 * this is a NEW type based on it (duplicate, or an id rename: the old id keeps loading). Outside it, the built-in.
 */
function basedOnWords() {
  let opened = null;
  try { opened = session ? sessionType : null; } catch { opened = null; } // the session's names are declared further down
  if (!opened) return 'based on the built-in';
  return typeName.trim() === opened.id ? `opened: ${opened.name}${opened.builtIn ? ' (built-in, read-only)' : ''}` : `a new type, based on ${opened.name}`;
}

/** Load the graph library once; then restore the operator's graph, or start from today's. */
async function loadGraphLib() {
  try {
    graphLib = await import('./nodeGraph.mjs');
    let saved = null;
    try { saved = JSON.parse(localStorage.getItem('review-zone-graph') || 'null'); } catch { saved = null; }
    zoneGraph = saved && Array.isArray(saved.nodes) ? graphLib.upgradeGraph(saved) : graphLib.defaultGraph();
  } catch {
    graphLib = null;
  }
  try {
    orientLib = await import('./orientGraph.mjs');
    sidePreviewLib = await import('./sidePreview.mjs');
    let saved = null;
    try { saved = JSON.parse(localStorage.getItem('review-orient-graph') || 'null'); } catch { saved = null; }
    orientGraph = saved && Array.isArray(saved.nodes) ? saved : orientLib.defaultGraph();
    try { orientPositions = JSON.parse(localStorage.getItem('review-orient-layout') || 'null'); } catch { orientPositions = null; }
  } catch {
    orientLib = null;
  }
  try {
    editorLib = await import('./built/node-editor.js');
    let layout = null;
    try { layout = JSON.parse(localStorage.getItem('review-zone-layout-2') || 'null'); } catch { layout = null; }
    zonePositions = layout && graphLib ? layout : (graphLib ? editorLib.autoLayout(zoneGraph, graphLib.FIXED.outputs) : {});
  } catch {
    editorLib = null; // no bundle: the card editor stands in
  }
}
await loadGraphLib();

/** The divider: drag (or arrow keys) to set the stage area's height; double-click to fit the content again. */
(function wireChainDivider() {
  const bar = document.getElementById('chain-divider');
  const root = document.documentElement;
  const KEY = 'review-chain-h';
  const headerH = () => document.querySelector('header')?.getBoundingClientRect().height ?? 40;
  // Both ends keep something usable: at least 120 px of stages, and at least 160 px of 3D view.
  const clamp = (h) => Math.round(Math.min(Math.max(h, 120), window.innerHeight - headerH() - 160));
  const set = (h) => {
    if (h === null) { root.style.removeProperty('--chain-h'); try { localStorage.removeItem(KEY); } catch { /* per-viewer only */ } return; }
    const px = clamp(h);
    root.style.setProperty('--chain-h', `${px}px`);
    try { localStorage.setItem(KEY, String(px)); } catch { /* per-viewer only */ }
  };
  let saved = null;
  try { saved = Number(localStorage.getItem(KEY)) || null; } catch { saved = null; }
  if (saved) set(saved);
  const current = () => document.getElementById('chain').getBoundingClientRect().height;
  bar.addEventListener('pointerdown', (e) => {
    bar.setPointerCapture(e.pointerId);
    bar.classList.add('dragging');
    const move = (ev) => set(window.innerHeight - ev.clientY);
    const up = () => { bar.classList.remove('dragging'); bar.removeEventListener('pointermove', move); bar.removeEventListener('pointerup', up); window.dispatchEvent(new Event('resize')); };
    bar.addEventListener('pointermove', move);
    bar.addEventListener('pointerup', up);
    e.preventDefault();
  });
  bar.addEventListener('dblclick', () => { set(null); window.dispatchEvent(new Event('resize')); });
  bar.addEventListener('keydown', (e) => {
    const step = e.shiftKey ? 80 : 24;
    if (e.key === 'ArrowUp') { set(current() + step); e.preventDefault(); }
    if (e.key === 'ArrowDown') { set(current() - step); e.preventDefault(); }
  });
  window.addEventListener('resize', () => { const v = root.style.getPropertyValue('--chain-h'); if (v) root.style.setProperty('--chain-h', `${clamp(parseFloat(v))}px`); });
})();

/** A layer key's colour token, as the GLB writers set it; transparent when the file has no such layer. */
function colourOf(key) {
  const token = SWATCH_VAR[key];
  return token ? cssToken(token) : 'var(--muted)';
}

/** The short label the layer table gives a key. */
function shortLabel(key) {
  return LAYER_TABLE.find(([prefix]) => prefix === key)?.[1] ?? key;
}

// The layer panel: collapsible groups, each with the layers the file has (a checkbox, its colour, a short label).
// A denture also gets the step-by-step controls on top.
function drawLayers() {
  const present = new Set();
  const names = [];
  model?.traverse((object) => { const key = object.name && keyOf(object.name); if (key) { present.add(key); names.push(object.name); } });
  drawChain(present, names);
  const box = document.getElementById('layers');
  box.className = 'layers';
  const groups = GROUP_DEFS.flatMap(([id, title]) => {
    const here = LAYER_TABLE.filter(([prefix, , , , group]) => group === id && present.has(prefix));
    if (here.length === 0) return [];
    return [collapsible(id, title, here.map(([prefix]) => prefix), here.map(layerRow), `review-group-${id}`)];
  });
  const parts = [];
  if (kindNow === 'denture') {
    const last = DENTURE_STEPS.length;
    const stepper = document.createElement('div');
    stepper.className = 'stepper';
    stepper.dataset.ui = 'review-stepper';
    const toggle = document.createElement('button');
    toggle.textContent = 'Step-by-step';
    toggle.dataset.ui = 'review-step-toggle';
    toggle.dataset.tipTitle = 'Step-by-step';
    toggle.dataset.tip = 'Show the layers in the order the review ran its ten steps: model first, then one step at a time.';
    toggle.setAttribute('aria-pressed', String(stepAt !== null));
    toggle.addEventListener('click', () => setStep(stepAt === null ? 0 : null));
    stepper.append(toggle);
    if (stepAt !== null) {
      const prev = Object.assign(document.createElement('button'), { textContent: 'Prev', disabled: stepAt === 0 });
      prev.dataset.ui = 'review-step-prev';
      prev.addEventListener('click', () => setStep(stepAt - 1));
      const next = Object.assign(document.createElement('button'), { textContent: 'Next', disabled: stepAt === last });
      next.dataset.ui = 'review-step-next';
      next.addEventListener('click', () => setStep(stepAt + 1));
      const where = document.createElement('span');
      where.className = 'muted step-where';
      where.dataset.ui = 'review-step-where';
      where.textContent = stepAt === 0 ? 'Model only' : `${stepAt}/${last} ${DENTURE_STEPS[stepAt - 1][0].replace(/^\d+\.\s*/, '')}`;
      if (stepAt > 0) { where.dataset.tipTitle = DENTURE_STEPS[stepAt - 1][0]; where.dataset.tip = ruleText(DENTURE_STEPS[stepAt - 1][1]); }
      stepper.append(prev, next, where);
    }
    parts.push(stepper);
  }
  box.replaceChildren(...parts, ...groups);
  refreshGroupCounts();
}

// ---- Hover picking ----------------------------------------------------------------------------------
// The scene is picked with a THREE.Raycaster from the pointer. The first visible hit (a line hit wins over a surface it
// lies on) is described by describeHit(): the layer's plain name, key facts that are cheap to read from the picked
// geometry (ray length, tip reason, pillar height, face count) and the layer's explanation.
const raycaster = new THREE.Raycaster();
const ndc = new THREE.Vector2();
const worldPoint = (position, index, object) => new THREE.Vector3().fromBufferAttribute(position, index).applyMatrix4(object.matrixWorld);
const mm = (value) => `${value.toFixed(value < 10 ? 2 : 1)} mm`;
const visibleDeep = (object) => { for (let o = object; o; o = o.parent) if (!o.visible) return false; return true; };

// Connected parts of a welded mesh (union-find over the index), with each part's world-space height; built on first hover, cached on the object.
function partsOf(object) {
  if (object.userData.parts) return object.userData.parts;
  const geometry = object.geometry;
  const count = geometry.attributes.position.count;
  const parent = Int32Array.from({ length: count }, (_, i) => i);
  const find = (i) => { while (parent[i] !== i) { parent[i] = parent[parent[i]]; i = parent[i]; } return i; };
  const index = geometry.index.array;
  for (let i = 0; i < index.length; i += 3) { const a = find(index[i]); parent[find(index[i + 1])] = a; parent[find(index[i + 2])] = a; }
  const low = new Map(), high = new Map();
  object.updateMatrixWorld(true);
  for (let i = 0; i < count; i++) {
    const root = find(i), y = worldPoint(geometry.attributes.position, i, object).y;
    low.set(root, Math.min(low.get(root) ?? Infinity, y));
    high.set(root, Math.max(high.get(root) ?? -Infinity, y));
  }
  object.userData.parts = { find, height: (vertex) => high.get(find(vertex)) - low.get(find(vertex)), count: new Set(Array.from({ length: count }, (_, i) => find(i))).size };
  return object.userData.parts;
}

function describeHit(hit) {
  const object = hit.object;
  const key = keyOf(object.name) ?? keyOf(object.parent?.name);
  const entry = key && entryOf(key);
  if (!entry) return { title: plain(object.name || object.parent?.name) || 'Object' };
  const [, label, legend] = entry;
  const geometry = object.geometry;
  const facts = [];
  let title = label;
  if (/^R\d/.test(key)) {
    // Each arrow is 6 vertices (shaft + two head strokes; R1b 2 * dashes + 4, from the layer's extras): the first is its start, the shaft's last its end.
    const position = geometry.attributes.position;
    const per = object.userData.verticesPerArrow ?? 6, endAt = object.userData.shaftEndVertex ?? 1;
    const arrow = Math.floor(hit.index / per);
    const from = worldPoint(position, arrow * per, object), to = worldPoint(position, arrow * per + endAt, object);
    facts.push(`Length ${mm(from.distanceTo(to))}`, `Arrow ${arrow + 1} of ${position.count / per}`);
  } else if (key === 'Tips left out') {
    const tip = Math.floor(hit.faceIndex / (object.userData.trianglesPerItem ?? 24));
    const reasons = object.userData.reasons ?? [];
    const reason = reasons[tip];
    title = 'Tip left out';
    if (reason !== undefined) facts.push(`Reason: ${REASONS.find(([prefix]) => reason.startsWith(prefix))?.[1] ?? reason}`, `Code: ${reason}`);
    facts.push(`Tip ${tip + 1} of ${reasons.length || '?'}`);
  } else if (key.startsWith('Tips:')) {
    title = `Tip (${key.slice(6)})`;
    const per = object.userData.trianglesPerItem ?? 24, item = Math.floor(hit.faceIndex / per);
    const reason = (object.userData.reasons ?? [])[item];
    if (reason !== undefined) {
      // The cone's axis in world space (the print pose, +Y up): apex = the vertex repeated most, axis = vertex mean minus apex.
      const pos = geometry.attributes.position, pts = [];
      for (let i = item * per * 3; i < (item + 1) * per * 3 && i < pos.count; i++) pts.push(worldPoint(pos, i, object));
      const key = (v) => `${v.x.toFixed(4)},${v.y.toFixed(4)},${v.z.toFixed(4)}`, count = new Map();
      for (const v of pts) count.set(key(v), (count.get(key(v)) ?? 0) + 1);
      const apexKey = [...count.entries()].sort((a, b) => b[1] - a[1])[0]?.[0];
      const apex = pts.find((v) => key(v) === apexKey);
      if (apex) {
        const axis = pts.reduce((a, v) => a.add(v), new THREE.Vector3()).divideScalar(pts.length).sub(apex).normalize();
        facts.push(`Tip face slope ${THREE.MathUtils.radToDeg(Math.acos(Math.max(-1, Math.min(1, -axis.y)))).toFixed(1)}° slope from horizontal (print pose; 0 = flat ceiling, 90 = vertical wall)`);
      }
      facts.push(reason);
    }
    else facts.push(`Tip ${Math.floor(hit.faceIndex / 24) + 1} of ${geometry.index ? Math.round(geometry.index.count / 72) : '?'}`);
  } else if (key === 'Tips that cannot reach') {
    title = 'Tip that cannot reach the plate';
  } else if (['SUPPORT PILLARS', 'GOLD', 'YOUR SUPPORTS'].includes(key) && geometry.index) {
    const parts = partsOf(object);
    title = key === 'GOLD' ? 'Support (aligner)' : key === 'YOUR SUPPORTS' ? 'Your support (-sup)' : 'Support pillar';
    facts.push(`Height ${mm(parts.height(geometry.index.array[hit.faceIndex * 3]))}`, `${parts.count} parts in this layer`);
  } else if (['DENTURE', 'NEUTRAL', 'TEAL'].includes(key)) {
    facts.push(`${Math.round((geometry.index ? geometry.index.count : geometry.attributes.position.count) / 3).toLocaleString()} triangles`);
  } else if (!geometry.index && geometry.attributes.position.count % 3 === 0 && !object.isLine) {
    facts.push(`${Math.round(geometry.attributes.position.count / 3).toLocaleString()} faces in this layer`);
  }
  const shownName = ['Dental rim (continuous', 'Hole outlines'].includes(key) ? plain(object.name).replace('(continuous hard edge)', '') : '';
  return { title: shownName || title, facts, note: ruleText(legend) };
}

function pick(clientX, clientY) {
  if (!model) return;
  const rect = renderer.domElement.getBoundingClientRect();
  ndc.set(((clientX - rect.left) / rect.width) * 2 - 1, -((clientY - rect.top) / rect.height) * 2 + 1);
  raycaster.setFromCamera(ndc, camera);
  const threshold = Math.max(0.15, camera.position.distanceTo(controls.target) * 0.004);
  raycaster.params.Line.threshold = threshold;
  const hits = raycaster.intersectObject(model, true).filter((h) => (h.object.isMesh || h.object.isLine) && visibleDeep(h.object));
  const first = hits[0];
  if (!first) { hideTip(); return; }
  // A thin line lying on a surface would always lose to it: a line hit close behind the first hit wins.
  const line = first.object.isLine ? first : hits.find((h) => h.object.isLine && h.distance <= first.distance + threshold * 4);
  showTip(describeHit(line ?? first), clientX, clientY);
}

let pickTimer = 0;
const canvas = renderer.domElement;
canvas.addEventListener('pointermove', (event) => {
  if (event.buttons || event.pointerType === 'touch') { hideTip(); return; }
  const { clientX, clientY } = event;
  clearTimeout(pickTimer);
  pickTimer = setTimeout(() => pick(clientX, clientY), 50);
});
canvas.addEventListener('pointerleave', () => { clearTimeout(pickTimer); hideTip(); });
// Touch has no hover: a tap (no drag) shows the tooltip.
let tapAt = null;
canvas.addEventListener('pointerdown', (event) => { hideTip(); tapAt = event.pointerType === 'touch' ? [event.clientX, event.clientY] : null; });
canvas.addEventListener('pointerup', (event) => {
  if (tapAt && Math.hypot(event.clientX - tapAt[0], event.clientY - tapAt[1]) < 6) pick(event.clientX, event.clientY);
  tapAt = null;
});

// Plain words for the reason codes (reasons.json beside this page, first matching prefix wins), so
// runs made before summary.json carried `explanation` read the same.
const REASONS = await fetch('/reasons.json').then((r) => (r.ok ? r.json() : { reasons: [] })).then((j) => j.reasons ?? []).catch(() => []);
const explain = (c) => c.explanation || REASONS.find(([prefix]) => (c.reason ?? '').startsWith(prefix))?.[1] || c.reason || '';
// "case-003 · scan name" — the file name (no folder, no .stl / .glb / .gltf) from summary.json's source path.
const fileName = (c) => (c.source ?? '').split(/[\\/]/).pop().replace(/\.(stl|glb|gltf)$/i, '');
const caseLabel = (c) => (fileName(c) ? `${c.case} · ${fileName(c)}` : c.case);

}

/** Clear the stage (no model, no facts) and put up the card with its words and, when given, one action button. */

/* THE SCAN SESSION'S WORDS for a scan with no run to show yet, in the list and on the stage card. */
const SESSION_WORDS = {
  'not run': () => 'Not run with this type yet',
  running: (c) => `Running, ${Math.round((Date.now() - (c.session.since ?? Date.now())) / 1000)} s`,
  queued: () => 'Waiting for a free run slot',

/** The stage card for a scan of the session with no run to show: its state, and Run, Stop or Retry. */
function showSessionCard(row) {

  stageCard({
    name: caseLabel(row),
    result: SESSION_WORDS[state](row),

async function show(row) {
  document.getElementById('nocase-action').hidden = true;
  const ticket = ++showing;
  kindNow = row.kind === 'denture' ? 'denture' : 'aligner';
  caseNow = row;
  // Step-by-step belongs to denture cases only; an aligner always shows its checkboxes.
  if (kindNow !== 'denture') stepAt = null;
  dropModel();
  const url = row.glb ? urlOf(row.glb) : '';
  // The Step 1 evidence GLB (trim chains, U ends, plane, back arrow) loads into the same scene; a
  // case that was not built may still have one, so the owner sees what orientation detected.
  const evidenceUrl = row.orientationGlb ? urlOf(row.orientationGlb) : '';
  // No GLB (the case was not built): a card with the case, its result and the reason in plain words.
  const card = document.getElementById('nocase');
  card.hidden = Boolean(row.glb);
  if (!row.glb) {
    document.getElementById('nocase-name').textContent = caseLabel(row);
    document.getElementById('nocase-result').textContent = RESULT_WORDS[row.result] ?? `Result: ${row.result}`;
    document.getElementById('nocase-text').textContent = explain(row) || 'No reason was recorded.';
    document.getElementById('nocase-code').textContent = row.reason ? `Why it needs a look: ${row.reason}` : '';
  }
  document.getElementById('note').textContent = url || evidenceUrl ? 'Loading...'
    : row.glb ? `${row.glb} was not in what was dropped. Drop the whole batch-... folder.` : '';
  if (url || evidenceUrl) {
    const loaded = await Promise.all([url, evidenceUrl].filter(Boolean).map((at) => loader.loadAsync(at)));
    // A newer selection started while this one loaded: drop this result.
    if (ticket !== showing) return;
    model = new THREE.Group();
    for (const gltf of loaded) model.add(gltf.scene);
    model.traverse((object) => {
      // Markers draw over everything, so a crossing inside a support body still shows.
      if (object.isMesh && plain(object.parent?.name).startsWith('MARK') || plain(object.parent?.name).startsWith('ISLAND')) {
        object.material.depthTest = false;
        object.renderOrder = 10;
      }
      // Shade the surfaces so the shape reads; markers and tubes keep their flat colour.
      const key = object.isMesh && keyOf(object.name);
      if (key && SUPPORT_KEYS.includes(key)) {
        // Weld the duplicated corners first so the normals are smooth across each part, not faceted.
        const old = object.geometry;
        object.geometry = mergeVertices(old);
        old.dispose();
        object.geometry.computeVertexNormals();
        const tint = object.material.color.clone();
        const colours = new Float32Array(object.geometry.attributes.position.count * 3);
        for (let i = 0; i < colours.length; i += 3) tint.toArray(colours, i);
        object.geometry.setAttribute('color', new THREE.BufferAttribute(colours, 3));
        object.userData.colour = tint;
        object.material = PLASTIC;
      } else if (key && ['DENTURE', 'TEAL', 'NEUTRAL'].includes(key)) {
        if (!object.geometry.attributes.normal) object.geometry.computeVertexNormals();
        // ACES plus the new lights washed the model to white, so its colour is dimmed (0.6) and it takes a light room reflection: neutral, matte, shaded.
        object.material = new THREE.MeshStandardMaterial({ color: key === 'DENTURE' ? DENTURE_COLOUR : object.material.color.clone().multiplyScalar(0.6), roughness: 0.85, envMapIntensity: 0.25, side: THREE.DoubleSide });
      }
    });
    // ONE COLOUR PER PLANE, the same on its chip and in 3D (docs/ORIENT-NODES.md section 10): a plane takes its token
    // whatever colour its GLB was written with - the engine writes the trim plane, the host the others.
    model.traverse((object) => {
      const key = keyOf(object.name || '') ?? keyOf(object.parent?.name || '');
      if (!object.material || !PLANE_KEYS.includes(key)) return;
      object.material.vertexColors = false;
      object.material.color.set(cssToken(SWATCH_VAR[key]));
      object.material.needsUpdate = true;
    });
    scene.add(model);
    const supports = new THREE.Box3();
    model.traverse((object) => {
      const key = object.isMesh && keyOf(object.name);
      if (key && PILLAR_KEYS.includes(key)) supports.expandByObject(object);
    });
    // The ray origin's sphere: its world-space centre (the label's anchor).
    model.updateMatrixWorld(true);
    model.traverse((object) => {
      if (object.isMesh && keyOf(object.name) === 'Oral cavity ray') boxAnchor = new THREE.Box3().setFromObject(object).getCenter(new THREE.Vector3());
    });
    floorY = supports.isEmpty() ? null : supports.min.y;
    underside = false;
    // The open tab's 3D cut, also on load: it was set only by a tab CLICK, so a reload on 1 Orient showed every layer,
    // supports included, until a tab was pressed (Fable's review).
    if (kindNow === 'denture' && stepAt === null) stepAt = STAGES.find((s) => s.id === stageNow)?.cut ?? null;
    applyVisibility();
    // The same scan again (another type, the compare's flip): keep the camera, so the two pictures line up.
    if (row.source !== lastShownSource) look(VIEWS.fit());
    lastShownSource = row.source;
    document.getElementById('note').textContent = '';
    // The zone overlay belongs to THIS model: the zone file can land before the GLB, and the overlay it built then was
    // hung on the previous case's model (Fable's review).
    if (zoneSelected || rimSelected) showZonePreview();
    // A new model stands as its run put it; the live turn (if the canvas still differs from that run) is re-applied.
    relabelSides();
  }
  drawLayers();
}

function openRun(summary, glbUrl, csvUrl) {
  // A review folder, not the scan session: the session's bar and banner go, its runs stay in the cache, and its
  // unsaved edits are kept first (they were lost here, Fable 2026-11-26).
  keepDraft();
  session = null;
  document.getElementById('stage-state').hidden = true;
  cases = summary.cases;
  applyRunGlobals(summary, glbUrl);
  const needing = cases.filter((c) => c.needsLook);
  const built = cases.filter((c) => c.result === 'built').length;
  const made = summary.created ? `, made ${new Date(summary.created).toLocaleString()}` : '';
  document.getElementById('totals').textContent = `${built} built, ${needing.length} need a look (${cases.length} file(s))${made}`;
  const csv = document.getElementById('csv');
  csv.hidden = !csvUrl;
  if (csvUrl) csv.href = csvUrl;
  // Open on All with the first BUILT case shown in 3D: starting on "Needs a look" showed only the

  onlyLook = false;

/**
 * What ONE run made the review on screen with - its rules, both graphs, the strip widths - and where its files are.
 * A review folder is one run for every case; in the scan session each scan's run is its own, so this is applied for
 * the case being shown (`select`).
 */
function applyRunGlobals(summary, glbUrl) {
  RULES = summary.ruleDefaults ?? {};
  // Which zone graph produced THIS run: "default", or the digest of the edited graph the node editor
  // sent. Without it an edited run and a default run look identical on screen.
  // A folder that does not record it (older than engine 69, or a writer that dropped it) is UNKNOWN,
  // not "default": the same label on a good day and a bad day is no label at all (cia F7).
  ranZoneGraph = summary.zoneGraph ?? 'unknown';
  // "default", not "unknown" as for the zone graph: every folder written before the Orient graph existed (U5) ran the
  // standard Step 1, so its missing key is a fact, not a gap.
  ranOrientGraph = summary.orientGraph ?? 'default';
  ranZoneGraphJson = summary.zoneGraphRan ?? null;
  ranOrientGraphJson = summary.orientGraphRan ?? null;
  ranPlacement = summary.placementRan ?? null;
  urlOf = glbUrl;
}

// Dropped or chosen files: a batch-... folder (summary.json + case GLBs), or GLB files alone.
// When several runs are in the drop, the newest summary.json wins and only GLBs beside it are used.
async function openFiles(entries) {
  blobs.forEach((url) => URL.revokeObjectURL(url));
  blobs = [];
  const dirOf = (path) => path.slice(0, path.lastIndexOf('/') + 1);
  const nameOf = (path) => path.slice(path.lastIndexOf('/') + 1);
  const blob = (file) => { const url = URL.createObjectURL(file); blobs.push(url); return url; };
  let run = null;
  for (const { path, file } of entries.filter(({ path }) => nameOf(path) === 'summary.json')) {
    try {
      const summary = JSON.parse(await file.text());
      if (Array.isArray(summary.cases) && (!run || (summary.created ?? '') > (run.summary.created ?? ''))) run = { summary, dir: dirOf(path) };
    } catch { /* not a review summary */ }
  }
  const glbs = entries.filter(({ path }) => /\.glb$/i.test(path) && (!run || dirOf(path) === run.dir));
  // A dropped SCAN cannot run from here: a dropped file has no path on this machine, and scans are read where they
  // are, never copied (patient data). Say where it goes instead of opening it as a drawing with nothing on it.
  const toRun = 'To run a scan, use Import files at the top - it is read where it is, never copied.';
  if (!run && entries.some(({ path }) => /\.(stl|gltf)$/i.test(path))) { empty(`Dropping opens a review folder an earlier run made, not a scan. ${toRun}`); return; }
  if (!run && glbs.length === 0) { empty('No summary.json or .glb file in what was dropped. Drop a batch-... folder from typelab/output.'); return; }
  const byName = new Map(glbs.map(({ path, file }) => [nameOf(path), file]));
  const summary = run?.summary ?? {
    cases: glbs.map(({ path }) => ({ case: nameOf(path).replace(/\.glb$/i, ''), source: path, result: 'built', glb: nameOf(path), needsLook: false })),
  };
  const missing = summary.cases.filter((c) => c.glb && !byName.has(c.glb));
  const csv = run && entries.find(({ path }) => path === `${run.dir}summary.csv`);
  openRun(summary, (name) => (byName.has(name) ? blob(byName.get(name)) : ''), csv ? blob(csv.file) : '');
  if (missing.length) document.getElementById('totals').textContent += `, ${missing.length} GLB(s) not in the drop`;
  if (!run) document.getElementById('totals').textContent += `. Opened as review drawings to look at, not run. ${toRun}`;
}

async function readEntry(entry) {
  if (entry.isFile) return [{ path: entry.fullPath, file: await new Promise((ok, fail) => entry.file(ok, fail)) }];
  const reader = entry.createReader();
  const children = [];
  for (let batch; (batch = await new Promise((ok, fail) => reader.readEntries(ok, fail))).length;) children.push(...batch);
  return (await Promise.all(children.map(readEntry))).flat();
}
