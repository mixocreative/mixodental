<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <title>mixoDental</title>
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />

    <!--
      THE FOUR FACES THE FIRST SCREEN PAINTS, FETCHED AT PARSE TIME.

      Every face in src/fonts.css is `font-display: swap`, which is the right choice - it never hides
      text - but it does mean the first screen is drawn in a fallback and then RE-DRAWN when the real
      font arrives.

      (This was first written up as the cause of a key that drew wrong for seconds on 2026-11-18. It
      was not: that was a selector list in theme.css ending in a comma. The preloads stay because the
      swap flash is real on a cold load, just smaller than it was blamed for.)

      The fonts are discovered LAST. Nothing in the HTML mentions them: the
      browser has to fetch the bundle (dev) or the stylesheet (build), parse four CSS files, match a
      `unicode-range`, and only then ask for a woff2. These four lines move that request to the first
      moment the parser can make it, alongside the bundle rather than behind it.

      FOUR, NOT THE WHOLE SET. A preload the page does not use is a wasted download and a console
      warning, so this is only what the entry screen actually paints: Atkinson 400 (the body line),
      Atkinson 700 (which weight 600 - the keys and the labels - resolves to), and Roboto Mono 400
      and 700 (the screen heading and the footer's counts). Japanese and Chinese stay on demand;
      `japanese-subset` is large and most sessions never show a character of it.

      `crossorigin` is NOT optional on a font preload, same origin or not: fonts are fetched in
      anonymous CORS mode, so a preload without it is a SECOND, separate fetch and the flicker stays.
    -->
    <link rel="preload" as="font" type="font/woff2" crossorigin
      href="/node_modules/@fontsource/atkinson-hyperlegible-next/files/atkinson-hyperlegible-next-latin-400-normal.woff2" />
    <link rel="preload" as="font" type="font/woff2" crossorigin
      href="/node_modules/@fontsource/atkinson-hyperlegible-next/files/atkinson-hyperlegible-next-latin-700-normal.woff2" />
    <link rel="preload" as="font" type="font/woff2" crossorigin
      href="/node_modules/@fontsource/roboto-mono/files/roboto-mono-latin-400-normal.woff2" />
    <link rel="preload" as="font" type="font/woff2" crossorigin
      href="/node_modules/@fontsource/roboto-mono/files/roboto-mono-latin-700-normal.woff2" />
    <style>
      /*
       * THE LAST RESORT, AND THE ONLY STYLES THAT CANNOT LIVE IN src/styles.css.
       *
       * This banner's job is to appear when the module bundle never ran, which is exactly when the
       * stylesheet - imported by main.tsx - never loaded either. So it carries its own, inline, with
       * literal colours and no custom properties: the one surface in this app that may not depend on
       * anything the app loads.
       */
      /* Styled by CLASS, not id: the <noscript> copy below is a second element and two elements may
         not share one id. Only the live banner carries `id="boot"`, which is what the script and
         `main.tsx` reach for. */
      .boot { max-width: 34rem; margin: 10vh auto; padding: 24px; font: 16px/1.6 system-ui, sans-serif; color: #15171a; background: #ffffff; border: 1px solid #d7d9dd; border-radius: 10px; text-align: left; }
      .boot p { margin: 0 0 10px; }
      .boot p:last-child { margin: 0; }
      .boot code { font: 13px/1.4 ui-monospace, monospace; color: #5b6069; }
      @media (prefers-color-scheme: dark) {
        .boot { color: #e8eaed; background: #1b1d21; border-color: #33363c; }
        .boot code { color: #9aa0a8; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <!--
      A FAILURE BEFORE REACT MOUNTS STILL HAS TO SAY SOMETHING.

      Last night's fix gave the app a capability check and a root error boundary, but both live inside
      `src/main.tsx` - so neither runs when the module itself fails to load or parse, which is exactly
      what a browser below the declared floor does (audit MIXO-03: Chrome/Edge 93, Firefox 114,
      Safari 15.4). Before this, that case was the blank white page all over again, by a route the
      boundary cannot reach. The sibling app mixoMesh has had this for a while
      (`src/app/entry.js`, a window error listener plus a catch on the boot import writing into
      static markup); the 2026-11-12 three-repo plan says to take it.

      IT SITS OUTSIDE #root ON PURPOSE. React 18's `createRoot(container).render()` does not clear
      the container's existing children, so a banner placed inside #root would still be on screen
      underneath a working app. `main.tsx` removes this element once React has rendered.

      THE WORDS ARE IN ALL THREE LANGUAGES, which is the one place this app does not use `t()`. It
      cannot: `src/i18n.ts` is in the bundle that just failed. Three short lines need no logic and
      cannot pick the wrong one.
    -->
    <div id="boot" class="boot" hidden>
      <p>mixoDental could not start in this browser. It needs a recent Chrome, Edge, Firefox or Safari.</p>
      <p lang="ja">mixoDental をこのブラウザで起動できませんでした。最新の Chrome、Edge、Firefox、Safari が必要です。</p>
      <p lang="zh-Hant">mixoDental 無法在這個瀏覽器啟動。需要較新版本的 Chrome、Edge、Firefox 或 Safari。</p>
      <p><code id="boot-detail"></code></p>
    </div>

    <noscript>
      <div class="boot">
        <p>mixoDental needs JavaScript. Nothing is uploaded: the app runs entirely in this browser.</p>
        <p lang="ja">mixoDental は JavaScript が必要です。ファイルはアップロードされません。すべてこのブラウザ内で処理されます。</p>
        <p lang="zh-Hant">mixoDental 需要 JavaScript。檔案不會上傳，全部都在這個瀏覽器中處理。</p>
      </div>
    </noscript>

    <script>
      /*
       * CLASSIC SCRIPT, NOT A MODULE, and deliberately before the module tag.
       *
       * A module that fails to parse never runs a line of its own, so nothing inside the bundle can
       * report that the bundle is broken. This listener is registered by an ordinary script that any
       * browser back to about 2015 can read, which is the only way to catch it.
       *
       * It reveals the banner and never hides it again: `main.tsx` removes the element on a
       * successful mount, so a late error after the app is up reaches the React boundary instead and
       * this stays out of the way.
       */
      (function () {
        var shown = false;
        function show(detail) {
          if (shown) return;
          var boot = document.getElementById('boot');
          if (!boot) return;
          shown = true;
          boot.hidden = false;
          var line = document.getElementById('boot-detail');
          if (line && detail) line.textContent = String(detail).slice(0, 300);
        }
        /*
         * TWO LISTENERS, AND THE CAPTURING ONE IS THE WHOLE POINT.
         *
         * A failed RESOURCE (this page's own module bundle) fires `error` on the element and that
         * event DOES NOT BUBBLE, so a plain window listener never hears the one failure this banner
         * exists for. It is only reachable in the capture phase. Learned the hard way: the first
         * version of this had the bubbling listener alone and the start gate's blocked-module pass
         * read `bootShown false`.
         *
         * Restricted to SCRIPT and LINK targets on purpose. Without that, a 404 favicon or a missing
         * font would reveal the banner for the instant before React mounts and removes it - a
         * flash of "could not start" over an app that started.
         */
        window.addEventListener('error', function (event) {
          var tag = event && event.target && event.target.tagName;
          if (tag === 'SCRIPT' || tag === 'LINK') show('The application files could not be loaded.');
        }, true);
        window.addEventListener('error', function (event) {
          show((event && (event.message || (event.error && event.error.message))) || '');
        });
        window.addEventListener('unhandledrejection', function (event) {
          show((event && event.reason && (event.reason.message || event.reason)) || '');
        });
        /*
         * AND THE SILENT CASE: a bundle that 404s or is blocked fires no error anybody hears on some
         * browsers. If nothing has mounted a few seconds after the document is ready, say so.
         * `main.tsx` clears this timer, so a slow-but-working start never shows the banner.
         */
        /*
         * ?diag=1 — THE LOAD TRACE, and why it is in this script rather than in the app.
         *
         * On 2026-11-18 the owner reported a control that drew wrong for a few seconds after every
         * load and then corrected itself. It could not be reproduced on the development machine:
         * six experiments (disabling each stylesheet in turn, blocking the theme attribute, sampling
         * every 25 ms through a reload) all showed the control correct from its first painted frame.
         * A transient that only happens on ONE machine cannot be found by reasoning from another.
         *
         * So the app records its own early frames. It samples the controls named below every 100 ms
         * for six seconds and keeps only the frames where something CHANGED, then prints the list on
         * the page - a screenshot of it is a complete answer, from the machine that has the problem.
         *
         * It is in the classic script, before the module, because the whole point is to be running
         * BEFORE React mounts and before the stylesheets the bundle carries have been injected. An
         * instrument that starts after the app does cannot see the app start.
         *
         * Gated on the query string, so it costs a normal load one `indexOf` and ships harmless.
         */
        if (location.search.indexOf('diag=1') !== -1) {
          var watch = ['[data-ui="start-choose-files"]', '.lang-select > select', '[data-ui="items-start"]'];
          var seen = {}, log = [], t0 = Date.now();
          /*
           * WHICH RULE IS WINNING, which is the question the numbers alone could not answer.
           *
           * The first version of this trace said the key was `font 30px "Roboto Mono" ink
           * rgb(23,51,78) on rgb(23,51,78)` - the right fill, the wrong everything else - and four
           * rounds of reasoning from that could not say WHY, because a computed value names no
           * source. `getMatchedCSSRules` was removed from browsers years ago, so this walks the
           * stylesheets and asks each rule whether it matches, which is the same answer by hand.
           *
           * Only rules that declare one of the properties in question, so the list is the handful
           * that could be responsible rather than every rule in the app. Cross-origin sheets throw
           * on `cssRules` and are skipped; `@media` blocks are stepped into one level, which is as
           * deep as this stylesheet goes.
           */
          var PROPS = ['color', 'font-size', 'font-family', 'background-color', 'padding'];
          var rulesFor = function (node) {
            var hits = [];
            var scan = function (rules, where) {
              for (var j = 0; j < rules.length; j++) {
                var rule = rules[j];
                if (rule.media && rule.cssRules) { scan(rule.cssRules, '@media ' + rule.media.mediaText + ' '); continue; }
                if (!rule.selectorText || !rule.style) continue;
                var sets = [];
                for (var k = 0; k < PROPS.length; k++) {
                  var value = rule.style.getPropertyValue(PROPS[k]);
                  if (value) sets.push(PROPS[k] + ': ' + value);
                }
                if (!sets.length) continue;
                var ok = false;
                try { ok = node.matches(rule.selectorText); } catch (e) { ok = false; }
                if (ok) hits.push('      ' + where + rule.selectorText + ' { ' + sets.join('; ') + ' }');
              }
            };
            for (var i = 0; i < document.styleSheets.length; i++) {
              try { scan(document.styleSheets[i].cssRules, ''); } catch (e) { /* cross-origin */ }
            }
            return hits;
          };
          var sample = function () {
            for (var i = 0; i < watch.length; i++) {
              var node = document.querySelector(watch[i]);
              var line;
              if (!node) {
                var root = document.getElementById('root');
                line = 'absent (root children ' + (root ? root.childElementCount : -1)
                  + ', sheets ' + document.styleSheets.length + ')';
              } else {
                var css = getComputedStyle(node), box = node.getBoundingClientRect();
                line = Math.round(box.width) + 'x' + Math.round(box.height)
                  + ' font ' + css.fontSize + ' ' + (css.fontFamily || '').split(',')[0]
                  + ' ink ' + css.color + ' on ' + css.backgroundColor
                  + ' pad ' + css.padding
                  + ' text "' + (node.textContent || '').slice(0, 24) + '"'
                  + ' sheets ' + document.styleSheets.length
                  + ' fonts ' + (document.fonts ? document.fonts.status : '?');
              }
              if (seen[watch[i]] !== line) {
                seen[watch[i]] = line;
                log.push((Date.now() - t0) + 'ms  ' + watch[i] + '  ' + line);
                // Only for an element that exists, and only when what it looks like has CHANGED:
                // the rule list is what explains the change, and it is long.
                if (node) log = log.concat(rulesFor(node));
              }
            }
          };
          var timer = setInterval(sample, 100);
          sample();
          setTimeout(function () {
            clearInterval(timer);
            var box = document.createElement('pre');
            box.id = 'mixo-diag';
            box.style.cssText = 'position:fixed;left:8px;right:8px;bottom:8px;max-height:60vh;overflow:auto;'
              + 'z-index:99999;margin:0;padding:10px;background:#fff;color:#15171a;border:1px solid #d7d9dd;'
              + 'border-radius:8px;font:11px/1.5 ui-monospace,monospace;white-space:pre-wrap';
            box.textContent = 'mixoDental load trace (?diag=1) — screenshot this\n'
              + 'device pixel ratio ' + window.devicePixelRatio + ', window ' + innerWidth + 'x' + innerHeight + '\n\n'
              + log.join('\n');
            document.body.appendChild(box);
            if (window.console && console.log) console.log(box.textContent);
          }, 6000);
        }

        window.__mixoBootTimer = setTimeout(function () {
          var root = document.getElementById('root');
          if (root && root.childElementCount === 0) show('The application did not start.');
        }, 8000);
      })();
    </script>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
