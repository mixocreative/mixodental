<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round">
  <!--
    THE SAME ARCH AS tool-rim, GIVEN A WIDTH - because that is exactly what this tool does: the step's
    own control is "Area width: width of the support area along each edge". Drawing an unrelated shape
    here hid the one relationship the operator needs to see, that the area is the rim band widened.
  -->
  <path d="M2.8 20v-7.5a9.2 9.2 0 0 1 18.4 0V20" />
  <path d="M8.2 20v-7.5a3.8 3.8 0 0 1 7.6 0V20" />
  <!-- The tips sit on the band's middle line, which is the rim line itself. -->
  <circle cx="5.5" cy="18.4" r="1" fill="currentColor" stroke="none" />
  <circle cx="6" cy="12.3" r="1" fill="currentColor" stroke="none" />
  <circle cx="9.2" cy="7.6" r="1" fill="currentColor" stroke="none" />
  <circle cx="14.8" cy="7.6" r="1" fill="currentColor" stroke="none" />
  <circle cx="18" cy="12.3" r="1" fill="currentColor" stroke="none" />
  <circle cx="18.5" cy="18.4" r="1" fill="currentColor" stroke="none" />
</svg>
